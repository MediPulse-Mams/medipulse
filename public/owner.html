<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediPulse — Vue Owner</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://unpkg.com/@tabler/icons-webfont@3.11.0/dist/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/shared.css">
<style>
body { background: #13151f; color: #E8ECF4; }
.kpi-card { background: #252936; border-radius: 16px; border: 1px solid rgba(255,255,255,0.09); padding: 20px; position: relative; overflow: hidden; }
.kpi-card::after { content: ''; position: absolute; width: 80px; height: 80px; border-radius: 50%; top: -25px; right: -25px; opacity: 0.1; }
.kpi-val { font-family: 'Syne', sans-serif; font-size: 32px; font-weight: 800; color: #fff; line-height: 1; margin-bottom: 6px; }
.kpi-lbl { font-size: 12px; color: #7B8BAA; font-family: 'Plus Jakarta Sans', sans-serif; }
.panel { background: #252936; border-radius: 16px; border: 1px solid rgba(255,255,255,0.09); padding: 20px; margin-bottom: 20px; }
.data-table { width: 100%; border-collapse: collapse; }
.data-table th { font-size: 11px; font-weight: 600; color: #7B8BAA; text-transform: uppercase; letter-spacing: 0.06em; padding: 8px 12px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.09); }
.data-table td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 13px; color: #E8ECF4; vertical-align: middle; }
</style>
</head>
<body>
<div id="mob-overlay" onclick="closeSidebar()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:49"></div>
<div class="layout">

  <!-- SIDEBAR -->
  <div class="sidebar sidebar-dark" id="sidebar">
    <div class="sidebar-logo">
      <div style="display:flex;align-items:center;gap:9px;margin-bottom:6px">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#06B6D4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        <div style="font-family:'Syne',sans-serif;font-size:19px;font-weight:800;letter-spacing:-0.5px;color:#E8ECF4">Medi<span style="color:#06B6D4">Pulse</span></div>
      </div>
      <div style="font-size:10px;color:#7B8BAA;padding-left:33px;font-style:italic">La réputation médicale, automatisée.</div>
    </div>
    <div class="sidebar-user">
      <div class="sidebar-avatar" id="sb-avatar" style="background:rgba(245,158,11,0.2);color:#F59E0B"></div>
      <div>
        <div class="sidebar-username" id="sb-name"></div>
        <div class="sidebar-role" style="font-size:11px;color:#7B8BAA">Owner</div>
      </div>
    </div>
    <div class="sidebar-nav">
      <div class="nav-section">Vue globale</div>
      <div class="nav-link active" id="nav-dashboard" onclick="showPage('dashboard')"><i class="ti ti-chart-bar"></i>Dashboard</div>
      <div class="nav-link" id="nav-cabinets" onclick="showPage('cabinets')"><i class="ti ti-building-hospital"></i>Cabinets</div>
      <div class="nav-link" id="nav-equipe" onclick="showPage('equipe')"><i class="ti ti-users-group"></i>Équipe</div>
      <div class="nav-link" id="nav-prospects" onclick="showPage('prospects')"><i class="ti ti-users"></i>Prospects</div>
      <div class="nav-link" id="nav-paiements" onclick="showPage('paiements')"><i class="ti ti-credit-card"></i>Paiements</div>
      <div class="nav-link" id="nav-tresorerie" onclick="showPage('tresorerie')"><i class="ti ti-chart-line"></i>Trésorerie</div>
    </div>
    <div class="sidebar-footer">
      <button class="logout-btn logout-btn-red" onclick="doLogout()">
        <i class="ti ti-logout" style="font-size:16px"></i> Déconnexion
      </button>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar" style="background:#1c1f2e;border-bottom:1px solid rgba(255,255,255,0.08)">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="mobile-menu-btn" onclick="toggleSidebar()" style="color:#E8ECF4"><i class="ti ti-menu-2"></i></button>
        <div style="font-family:'Syne',sans-serif;font-size:16px;font-weight:700;color:#E8ECF4" id="page-title">Vue 360°</div>
      </div>
      <div style="display:flex;align-items:center;gap:12px">
        <span style="padding:4px 14px;border-radius:99px;font-size:11px;font-weight:600;background:rgba(245,158,11,0.15);color:#F59E0B;border:1px solid rgba(245,158,11,0.25)">Owner</span>
        <span style="font-size:13px;color:#7B8BAA" id="topbar-date"></span>
        <div style="position:relative">
          <button onclick="toggleNotifs()" id="notif-btn" style="width:36px;height:36px;border-radius:10px;background:rgba(6,182,212,0.12);border:1px solid rgba(6,182,212,0.3);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E8ECF4" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span id="notif-badge" style="display:none;position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:#F43F5E;font-size:10px;font-weight:700;color:#fff;align-items:center;justify-content:center;font-family:'Plus Jakarta Sans',sans-serif">0</span>
          </button>
          <div id="notif-dropdown" style="display:none;position:absolute;right:0;top:44px;background:#252936;border:1px solid rgba(255,255,255,0.09);border-radius:14px;box-shadow:0 8px 32px rgba(0,0,0,0.3);width:320px;z-index:100;overflow:hidden">
            <div style="padding:14px 16px;border-bottom:1px solid rgba(255,255,255,0.09);display:flex;align-items:center;justify-content:space-between">
              <span style="font-size:14px;font-weight:700;color:#E8ECF4;font-family:'Plus Jakarta Sans',sans-serif">Notifications</span>
              <span onclick="clearNotifs()" style="font-size:12px;color:#06B6D4;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif">Tout effacer</span>
            </div>
            <div id="notif-list" style="max-height:320px;overflow-y:auto">
              <div style="padding:24px;text-align:center;color:#7B8BAA;font-size:13px;font-family:'Plus Jakarta Sans',sans-serif">Aucune notification</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="content" id="main-content" style="background:#13151f">
      <div style="text-align:center;padding:60px;color:#7B8BAA">Chargement...</div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="/js/supabase.js"></script>
<script src="/js/auth.js"></script>
<script>
let currentUser = null;
let userRecord = null;
let notifications = [];

// ══ INIT ══
(async () => {
  const auth = await requireAuth('owner');
  if (!auth) return;
  currentUser = auth.session.user;
  userRecord = auth.user;

  const initials = (userRecord.nom || currentUser.email).substring(0, 2).toUpperCase();
  document.getElementById('sb-avatar').textContent = initials;
  document.getElementById('sb-name').textContent = userRecord.nom || currentUser.email.split('@')[0];
  document.getElementById('topbar-date').textContent = new Date().toLocaleDateString('fr-FR', {day:'numeric',month:'long',year:'numeric'});

  showPage('dashboard');
  checkAlerts();
})();

// ══ NAVIGATION ══
function showPage(page) {
  document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
  const navEl = document.getElementById('nav-' + page);
  if (navEl) navEl.classList.add('active');
  const titles = {
    dashboard: 'Vue 360°', cabinets: 'Cabinets', equipe: 'Équipe commerciale',
    prospects: 'Prospects', paiements: 'Paiements', tresorerie: 'Trésorerie'
  };
  document.getElementById('page-title').textContent = titles[page] || 'Dashboard';

  if (page === 'dashboard') renderDashboard();
  else if (page === 'cabinets') renderCabinets();
  else if (page === 'equipe') renderEquipe();
  else if (page === 'prospects') renderProspects();
  else if (page === 'paiements') renderPaiements();
  else if (page === 'tresorerie') renderTresorerie();
}

function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }

// ══ NOTIFICATIONS ══
function addNotif(msg, type = 'info', icon = 'ti-bell') {
  notifications.unshift({ msg, type, icon, time: new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}) });
  updateNotifBadge();
  renderNotifList();
}
function updateNotifBadge() {
  const badge = document.getElementById('notif-badge');
  if (!badge) return;
  if (notifications.length > 0) { badge.style.display = 'flex'; badge.textContent = Math.min(notifications.length, 9) + (notifications.length > 9 ? '+' : ''); }
  else badge.style.display = 'none';
}
function toggleNotifs() {
  const dd = document.getElementById('notif-dropdown');
  if (dd) dd.style.display = dd.style.display === 'none' ? 'block' : 'none';
}
function clearNotifs() {
  notifications = []; updateNotifBadge(); renderNotifList();
  const dd = document.getElementById('notif-dropdown');
  if (dd) dd.style.display = 'none';
}
function renderNotifList() {
  const list = document.getElementById('notif-list');
  if (!list) return;
  const colors = { info: '#06B6D4', warning: '#F59E0B', error: '#F43F5E', success: '#10B981' };
  list.innerHTML = notifications.length ? notifications.map(n => `
    <div style="padding:12px 16px;border-bottom:1px solid rgba(255,255,255,0.05);display:flex;gap:10px;align-items:flex-start">
      <div style="width:32px;height:32px;border-radius:8px;background:rgba(6,182,212,0.1);display:flex;align-items:center;justify-content:center;flex-shrink:0">
        <i class="ti ${n.icon}" style="font-size:16px;color:${colors[n.type]||colors.info}"></i>
      </div>
      <div style="flex:1">
        <div style="font-size:13px;color:#E8ECF4;font-family:'Plus Jakarta Sans',sans-serif;line-height:1.4">${n.msg}</div>
        <div style="font-size:11px;color:#7B8BAA;margin-top:3px;font-family:'Plus Jakarta Sans',sans-serif">${n.time}</div>
      </div>
    </div>
  `).join('') : '<div style="padding:24px;text-align:center;color:#7B8BAA;font-size:13px;font-family:Plus Jakarta Sans,sans-serif">Aucune notification</div>';
}
document.addEventListener('click', e => {
  const dd = document.getElementById('notif-dropdown');
  const btn = document.getElementById('notif-btn');
  if (dd && btn && !btn.contains(e.target) && !dd.contains(e.target)) dd.style.display = 'none';
});

// ══ ALERTS ══
async function checkAlerts() {
  const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate() + 1);
  const tStr = tomorrow.toISOString().split('T')[0];
  const in3 = new Date(); in3.setDate(in3.getDate() + 3);
  const in3Str = in3.toISOString().split('T')[0];
  const { data: cabs } = await sb.from('cabinets').select('*');
  if (!cabs) return;
  cabs.forEach(c => {
    if (c.date_fin_trial === tStr && c.statut === 'trial')
      addNotif('⚠️ Trial expire demain — ' + (c.nom_cabinet||c.nom_medecin), 'warning', 'ti-clock');
    if (c.date_renouvellement === in3Str && c.statut === 'actif')
      addNotif('🔄 Renouvellement dans 3 jours — ' + (c.nom_cabinet||c.nom_medecin), 'warning', 'ti-refresh');
  });
}

// ══ DASHBOARD ══
async function renderDashboard() {
  const [{ data: pros }, { data: cabs }, { data: users }] = await Promise.all([
    sb.from('prospection').select('*'),
    sb.from('cabinets').select('*'),
    sb.from('users').select('*').eq('role', 'commercial'),
  ]);
  const p = pros||[], c = cabs||[], u = users||[];
  const actifs = c.filter(x => x.statut === 'actif');
  const trials = c.filter(x => x.statut === 'trial');
  const mrr = actifs.reduce((acc, x) => acc + (TARIF[x.plan] || TD), 0);
  const now = new Date();
  const firstDay = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split('T')[0];
  const signesMois = p.filter(x => x.statut === 'Signé' && x.date_appel >= firstDay).length;
  const daysLeft = Math.ceil((new Date(now.getFullYear(), now.getMonth()+1, 0) - now) / (1000*60*60*24));
  const colors = ['#06B6D4','#8B5CF6','#10B981','#F59E0B'];

  document.getElementById('main-content').innerHTML = `
    
    <div style="font-size:13px;color:#7B8BAA;margin-bottom:24px;font-family:'Plus Jakarta Sans',sans-serif">
      ${new Date().toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})}
    </div>

    <!-- KPI ROW 1 -->
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px">
      ${[
        {val:actifs.length,lbl:'Cabinets actifs',color:'#F59E0B',icon:'ti-building-hospital'},
        {val:mrr.toLocaleString('fr-FR')+' DH',lbl:'MRR (DH/mois)',color:'#10B981',icon:'ti-currency-dollar'},
        {val:p.length,lbl:'Prospects total',color:'#2563EB',icon:'ti-users'},
        {val:signesMois,lbl:'Signés ce mois',color:'#06B6D4',icon:'ti-circle-check'},
      ].map(k => `
        <div class="kpi-card" style="border-left:3px solid ${k.color}">
          <i class="ti ${k.icon}" style="font-size:20px;color:${k.color};display:block;margin-bottom:12px"></i>
          <div class="kpi-val">${k.val}</div>
          <div class="kpi-lbl">${k.lbl}</div>
        </div>
      `).join('')}
    </div>

    <!-- KPI ROW 2 -->
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px">
      ${[
        {val:trials.length,lbl:'En trial',color:'#F59E0B',icon:'ti-clock'},
        {val:p.filter(x=>x.statut==='Démo Bookée'||x.statut==='Démo Faite').length,lbl:'Démos',color:'#8B5CF6',icon:'ti-calendar-check'},
        {val:p.filter(x=>x.statut==='Refus').length,lbl:'Refus',color:'#F43F5E',icon:'ti-x'},
        {val:u.length,lbl:'Commerciaux',color:'#06B6D4',icon:'ti-users-group'},
      ].map(k => `
        <div class="kpi-card" style="border-left:3px solid ${k.color}">
          <i class="ti ${k.icon}" style="font-size:20px;color:${k.color};display:block;margin-bottom:12px"></i>
          <div class="kpi-val">${k.val}</div>
          <div class="kpi-lbl">${k.lbl}</div>
        </div>
      `).join('')}
    </div>

    <div style="display:grid;grid-template-columns:3fr 1fr;gap:20px">
      <!-- EQUIPE -->
      <div class="panel">
        <div style="font-size:14px;font-weight:600;color:#E8ECF4;margin-bottom:16px;font-family:'Plus Jakarta Sans',sans-serif;display:flex;align-items:center;gap:8px">
          <i class="ti ti-users-group" style="color:#06B6D4;font-size:16px"></i> Équipe commerciale
        </div>
        ${u.length ? u.map((usr, i) => {
          const signes = p.filter(x => x.commercial_id === usr.email && x.statut === 'Signé').length;
          const appels = p.filter(x => x.commercial_id === usr.email && x.statut !== 'Nouveau').length;
          const initials = (usr.nom||usr.email).substring(0,2).toUpperCase();
          return `
            <div style="display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,0.05)">
              <div style="width:40px;height:40px;border-radius:12px;background:${colors[i%4]}22;color:${colors[i%4]};display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex-shrink:0">${initials}</div>
              <div>
                <div style="font-size:14px;font-weight:600;color:#E8ECF4;font-family:'Plus Jakarta Sans',sans-serif">${usr.nom||usr.email}</div>
                <div style="font-size:12px;color:#7B8BAA;margin-top:2px;font-family:'Plus Jakarta Sans',sans-serif">${usr.type==='terrain'?'🚶 Terrain':'📞 Téléphone'}</div>
              </div>
              <div style="display:flex;gap:20px;margin-left:auto;text-align:right">
                <div><div style="font-family:'Syne',sans-serif;font-size:16px;font-weight:700;color:#10B981">${signes}</div><div style="font-size:10px;color:#7B8BAA">Signés</div></div>
                <div><div style="font-family:'Syne',sans-serif;font-size:16px;font-weight:700;color:#06B6D4">${appels}</div><div style="font-size:10px;color:#7B8BAA">Appels</div></div>
              </div>
            </div>
          `;
        }).join('') : '<div style="text-align:center;padding:32px;color:#7B8BAA;font-family:Plus Jakarta Sans,sans-serif">Aucun commercial</div>'}
      </div>

      <!-- COUNTDOWN + CABINETS -->
      <div style="display:flex;flex-direction:column;gap:16px">
        <div style="background:linear-gradient(135deg,rgba(245,158,11,0.08),rgba(234,88,12,0.05));border:1px solid rgba(245,158,11,0.2);border-radius:14px;padding:18px">
          <div style="font-size:12px;color:#7B8BAA;margin-bottom:4px;font-family:'Plus Jakarta Sans',sans-serif">Fin du mois</div>
          <div style="font-family:'Syne',sans-serif;font-size:42px;font-weight:800;color:#F59E0B;line-height:1">${daysLeft}</div>
          <div style="font-size:11px;color:#7B8BAA;font-family:'Plus Jakarta Sans',sans-serif">jours restants</div>
        </div>
        <div class="panel" style="flex:1;margin-bottom:0">
          <div style="font-size:13px;font-weight:600;color:#E8ECF4;margin-bottom:12px;font-family:'Plus Jakarta Sans',sans-serif">Derniers cabinets</div>
          ${c.length ? c.slice(-4).reverse().map(x => `
            <div style="padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.05)">
              <div style="font-size:13px;font-weight:600;color:#E8ECF4;font-family:'Plus Jakarta Sans',sans-serif">${x.nom_cabinet||x.nom_medecin}</div>
              <div style="font-size:11px;color:#7B8BAA;margin-top:2px;font-family:'Plus Jakarta Sans',sans-serif">${x.specialite} · <span style="color:${x.statut==='actif'?'#10B981':'#F59E0B'}">${x.statut}</span></div>
            </div>
          `).join('') : '<div style="text-align:center;padding:16px;color:#7B8BAA;font-size:12px;font-family:Plus Jakarta Sans,sans-serif">Aucun cabinet</div>'}
        </div>
      </div>
    </div>
  `;
}

// ══ CABINETS ══
async function renderCabinets() {
  const { data: cabs } = await sb.from('cabinets').select('*');
  const c = cabs || [];
  const statusConfig = {
    'trial':   { bg: 'rgba(245,158,11,0.12)', color: '#B45309', label: '🔄 Trial' },
    'actif':   { bg: 'rgba(16,185,129,0.12)', color: '#15803D', label: '✅ Actif' },
    'suspendu_propose': { bg: 'rgba(244,63,94,0.1)', color: '#BE123C', label: '⚠ Suspension proposée' },
    'suspendu': { bg: 'rgba(244,63,94,0.15)', color: '#BE123C', label: '🔴 Suspendu' },
  };

  document.getElementById('main-content').innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px">
      <div>
        
        <div style="font-size:13px;color:#7B8BAA;margin-top:2px;font-family:'Plus Jakarta Sans',sans-serif">${c.length} cabinets — ${c.filter(x=>x.statut==='actif').length} actifs — ${c.filter(x=>x.statut==='trial').length} en trial</div>
      </div>
    </div>
    <div class="panel" style="overflow-x:auto">
      <table class="data-table">
        <thead><tr>
          <th>Cabinet</th><th>Plan</th><th>Statut</th>
          <th>Trial / Renouvellement</th><th>Commercial</th><th>Actions</th>
        </tr></thead>
        <tbody>${c.length ? c.map(x => {
          const sc = statusConfig[x.statut] || { bg: 'rgba(255,255,255,0.05)', color: '#7B8BAA', label: x.statut || '—' };
          const isTrial = x.statut === 'trial';
          const daysLeft = x.date_fin_trial ? Math.ceil((new Date(x.date_fin_trial) - new Date()) / (1000*60*60*24)) : null;
          const urgence = daysLeft !== null && daysLeft <= 1;
          return `<tr>
            <td>
              <div style="font-weight:600">${x.nom_cabinet||x.nom_medecin}</div>
              <div style="font-size:11px;color:#7B8BAA;margin-top:2px">${x.specialite} · ${x.ville}</div>
            </td>
            <td><span style="padding:3px 10px;border-radius:99px;font-size:11px;font-weight:600;background:rgba(6,182,212,0.1);color:#06B6D4">${x.plan||'pro'}</span></td>
            <td><span style="padding:4px 10px;border-radius:99px;font-size:11px;font-weight:600;background:${sc.bg};color:${sc.color};font-family:'Plus Jakarta Sans',sans-serif">${sc.label}</span></td>
            <td style="font-size:12px;color:${urgence?'#F43F5E':'#7B8BAA'}">
              ${isTrial ? 'Trial expire : ' + (x.date_fin_trial||'—') + (daysLeft!==null?' ('+daysLeft+'j)':'') : 'Renouvellement : ' + (x.date_renouvellement||'—')}
            </td>
            <td style="font-size:12px;color:#7B8BAA">${x.commercial_id||'—'}</td>
            <td>
              <div style="display:flex;gap:6px">
                ${x.statut==='suspendu_propose'||x.statut==='en_attente_paiement' ? `
                  <button onclick="confirmer('${x.id}')" style="padding:5px 10px;border-radius:6px;border:none;background:rgba(16,185,129,0.15);color:#10B981;font-size:11px;font-weight:600;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif">✓ Confirmer</button>
                  <button onclick="suspendre('${x.id}')" style="padding:5px 10px;border-radius:6px;border:none;background:rgba(244,63,94,0.1);color:#F43F5E;font-size:11px;font-weight:600;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif">Suspendre</button>
                ` : ''}
                ${x.statut==='actif' ? `
                  <button onclick="proposerSuspension('${x.id}')" style="padding:5px 10px;border-radius:6px;border:none;background:rgba(255,255,255,0.06);color:#7B8BAA;font-size:11px;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif">Suspendre</button>
                ` : ''}
                ${x.statut==='suspendu' ? `
                  <button onclick="reactiver('${x.id}')" style="padding:5px 10px;border-radius:6px;border:none;background:rgba(16,185,129,0.15);color:#10B981;font-size:11px;font-weight:600;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif">Réactiver</button>
                ` : ''}
                ${x.statut==='trial' ? `
                  <button onclick="confirmer('${x.id}')" style="padding:5px 10px;border-radius:6px;border:none;background:rgba(6,182,212,0.1);color:#06B6D4;font-size:11px;font-weight:600;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif">Convertir</button>
                ` : ''}
              </div>
            </td>
          </tr>`;
        }).join('') : '<tr><td colspan="6" style="text-align:center;padding:32px;color:#7B8BAA">Aucun cabinet</td></tr>'}
        </tbody>
      </table>
    </div>
  `;
}

async function confirmer(id) {
  const renew = new Date(); renew.setMonth(renew.getMonth() + 1);
  const { error } = await sb.from('cabinets').update({ statut:'actif', statut_paiement:'payé', date_renouvellement: renew.toISOString().split('T')[0] }).eq('id', id);
  if (!error) { showToast('Cabinet activé', 'success'); renderCabinets(); }
}
async function suspendre(id) {
  const { error } = await sb.from('cabinets').update({ statut: 'suspendu' }).eq('id', id);
  if (!error) { showToast('Cabinet suspendu', 'error'); renderCabinets(); }
}
async function proposerSuspension(id) {
  const { error } = await sb.from('cabinets').update({ statut: 'suspendu_propose' }).eq('id', id);
  if (!error) { showToast('Suspension proposée', 'error'); renderCabinets(); }
}
async function reactiver(id) {
  const renew = new Date(); renew.setMonth(renew.getMonth() + 1);
  const { error } = await sb.from('cabinets').update({ statut: 'actif', date_renouvellement: renew.toISOString().split('T')[0] }).eq('id', id);
  if (!error) { showToast('Cabinet réactivé', 'success'); renderCabinets(); }
}

// ══ EQUIPE ══
async function renderEquipe() {
  const [{ data: users }, { data: pros }] = await Promise.all([
    sb.from('users').select('*').eq('role', 'commercial'),
    sb.from('prospection').select('*'),
  ]);
  const u = users||[], p = pros||[];
  const colors = ['#06B6D4','#8B5CF6','#10B981','#F59E0B'];

  document.getElementById('main-content').innerHTML = `
    
    <div class="panel">
      <table class="data-table">
        <thead><tr>
          <th>Commercial</th><th>Type</th><th>Prospects</th>
          <th>Appels</th><th>Démos</th><th>Signés</th><th>Primes estimées</th>
        </tr></thead>
        <tbody>${u.length ? u.map((usr, i) => {
          const myP = p.filter(x => x.commercial_id === usr.email);
          const signes = myP.filter(x => x.statut === 'Signé').length;
          const isTer = usr.type === 'terrain';
          const prime = signes * Math.round(TD * (isTer ? P_SIG_TER : P_SIG_TEL));
          const bonus = ([...(isTer?PAL_TER:PAL_TEL)].reverse().find(x => signes >= x.s) || {b:0}).b;
          const initials = (usr.nom||usr.email).substring(0,2).toUpperCase();
          return `<tr>
            <td>
              <div style="display:flex;align-items:center;gap:10px">
                <div style="width:32px;height:32px;border-radius:8px;background:${colors[i%4]}22;color:${colors[i%4]};display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700">${initials}</div>
                <span style="font-weight:600">${usr.nom||usr.email}</span>
              </div>
            </td>
            <td>${usr.type === 'terrain' ? '🚶 Terrain' : '📞 Téléphone'}</td>
            <td>${myP.length}</td>
            <td>${myP.filter(x => x.statut !== 'Nouveau').length}</td>
            <td>${myP.filter(x => x.statut==='Démo Bookée'||x.statut==='Démo Faite').length}</td>
            <td style="font-weight:700;color:#10B981">${signes}</td>
            <td style="font-weight:700;color:#06B6D4">${(prime+bonus).toLocaleString('fr-FR')} DH</td>
          </tr>`;
        }).join('') : '<tr><td colspan="7" style="text-align:center;padding:32px;color:#7B8BAA">Aucun commercial</td></tr>'}
        </tbody>
      </table>
    </div>
  `;
}

// ══ PAIEMENTS ══
async function renderPaiements() {
  const { data: cabs } = await sb.from('cabinets').select('*');
  const c = cabs || [];
  document.getElementById('main-content').innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px">
      <div style="font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:#E8ECF4">Paiements</div>
      <button onclick="openAddPaiement()" style="padding:10px 18px;border-radius:10px;background:linear-gradient(135deg,#2563EB,#06B6D4);color:#fff;border:none;font-size:13px;font-weight:600;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif">
        + Enregistrer paiement
      </button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px">
      <div class="kpi-card" style="border-left:3px solid #10B981">
        <i class="ti ti-trending-up" style="font-size:20px;color:#10B981;display:block;margin-bottom:12px"></i>
        <div class="kpi-val">0 DH</div><div class="kpi-lbl">Encaissé ce mois</div>
      </div>
      <div class="kpi-card" style="border-left:3px solid #F59E0B">
        <i class="ti ti-clock" style="font-size:20px;color:#F59E0B;display:block;margin-bottom:12px"></i>
        <div class="kpi-val">0</div><div class="kpi-lbl">En attente validation</div>
      </div>
      <div class="kpi-card" style="border-left:3px solid #2563EB">
        <i class="ti ti-building-hospital" style="font-size:20px;color:#2563EB;display:block;margin-bottom:12px"></i>
        <div class="kpi-val">${c.filter(x=>x.statut==='actif').length}</div><div class="kpi-lbl">Cabinets actifs</div>
      </div>
    </div>
    <div class="panel">
      <div style="font-size:14px;font-weight:600;color:#E8ECF4;margin-bottom:16px;font-family:'Plus Jakarta Sans',sans-serif">Historique des paiements</div>
      <table class="data-table">
        <thead><tr><th>Cabinet</th><th>Montant</th><th>Mode</th><th>Commercial</th><th>Date</th><th>Statut</th></tr></thead>
        <tbody id="paiements-tbody">
          <tr><td colspan="6" style="text-align:center;padding:32px;color:#7B8BAA">Aucun paiement enregistré</td></tr>
        </tbody>
      </table>
    </div>

    <!-- MODAL PAIEMENT -->
    <div id="paiement-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:200;align-items:center;justify-content:center;padding:20px" onclick="if(event.target===this)this.style.display='none'">
      <div style="background:#252936;border-radius:20px;border:1px solid rgba(255,255,255,0.09);width:100%;max-width:480px;padding:0 0 24px">
        <div style="padding:20px 24px 16px;border-bottom:1px solid rgba(255,255,255,0.09);display:flex;align-items:center;justify-content:space-between">
          <div style="font-size:17px;font-weight:700;color:#E8ECF4;font-family:'Plus Jakarta Sans',sans-serif">Enregistrer un paiement</div>
          <button onclick="document.getElementById('paiement-modal').style.display='none'" style="background:none;border:none;color:#7B8BAA;cursor:pointer;font-size:20px"><i class="ti ti-x"></i></button>
        </div>
        <div style="padding:20px 24px">
          <div style="font-size:11px;font-weight:600;color:#7B8BAA;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px;font-family:'Plus Jakarta Sans',sans-serif">Cabinet</div>
          <select id="p-cabinet" class="finput" style="background:#0f172a;border-color:#334155;color:#E8ECF4;margin-bottom:14px">
            <option value="">Sélectionner un cabinet</option>
            ${c.map(x => `<option value="${x.id}">${x.nom_cabinet||x.nom_medecin} — ${x.plan||'pro'}</option>`).join('')}
          </select>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">
            <div>
              <div style="font-size:11px;font-weight:600;color:#7B8BAA;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px;font-family:'Plus Jakarta Sans',sans-serif">Montant (DH)</div>
              <input id="p-montant" type="number" class="finput" placeholder="1499" style="background:#0f172a;border-color:#334155;color:#E8ECF4">

            <div>
              <div style="font-size:11px;font-weight:600;color:#7B8BAA;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px;font-family:'Plus Jakarta Sans',sans-serif">Mode</div>
              <select id="p-mode" class="finput" style="background:#0f172a;border-color:#334155;color:#E8ECF4">
                <option value="especes">💵 Espèces</option>

          <textarea id="p-notes" class="finput" rows="2" placeholder="Référence chèque, numéro virement..." style="background:#0f172a;border-color:#334155;color:#E8ECF4;resize:none"></textarea>

function openAddPaiement() {
  document.getElementById('paiement-modal').style.display = 'flex';
}

function savePaiement() {
  const cabId = document.getElementById('p-cabinet')?.value;
  const montant = document.getElementById('p-montant')?.value;
  const mode = document.getElementById('p-mode')?.value;
  if (!cabId || !montant) { showToast('Cabinet et montant requis', 'error'); return; }

  const modeLabels = { especes: '💵 Espèces', cheque: '📄 Chèque', virement: '🏦 Virement' };
  const tbody = document.getElementById('paiements-tbody');
  if (tbody) {
    if (tbody.querySelector('td[colspan]')) tbody.innerHTML = '';
    tbody.insertAdjacentHTML('afterbegin', `
      <tr>
        <td style="font-weight:600">Cabinet #${cabId}</td>
        <td style="color:#10B981;font-weight:600">${parseInt(montant).toLocaleString('fr-FR')} DH</td>
        <td>${modeLabels[mode]||mode}</td>
        <td>${currentUser?.email||'—'}</td>
        <td>${new Date().toLocaleDateString('fr-FR')}</td>
        <td><span style="padding:3px 10px;border-radius:99px;font-size:11px;font-weight:600;background:rgba(245,158,11,0.1);color:#F59E0B">En attente</span></td>
      </tr>
    `);
  }
  document.getElementById('paiement-modal').style.display = 'none';
  showToast('Paiement enregistré', 'success');
}

// ══ TRESORERIE ══
async function renderTresorerie() {
  const { data: cabs } = await sb.from('cabinets').select('*');
  const c = cabs || [];
  const actifs = c.filter(x => x.statut === 'actif');
  const mrr = actifs.reduce((acc, x) => acc + (TARIF[x.plan] || TD), 0);

  document.getElementById('main-content').innerHTML = `
    
    <div style="font-size:13px;color:#7B8BAA;margin-bottom:24px;font-family:'Plus Jakarta Sans',sans-serif">Trésorerie — Vue financière complète</div>

    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px">
      ${[
        {val:mrr.toLocaleString('fr-FR')+' DH',lbl:'MRR',color:'#10B981',icon:'ti-trending-up'},
        {val:'0 DH',lbl:'Encaissé ce mois',color:'#2563EB',icon:'ti-currency-dollar'},
        {val:'0 DH',lbl:'Sorties ce mois',color:'#F43F5E',icon:'ti-arrow-down'},
        {val:'0 DH',lbl:'Marge nette',color:'#06B6D4',icon:'ti-scale'},
      ].map(k => `
        <div class="kpi-card" style="border-left:3px solid ${k.color}">
          <i class="ti ${k.icon}" style="font-size:20px;color:${k.color};display:block;margin-bottom:12px"></i>
          <div class="kpi-val">${k.val}</div>
          <div class="kpi-lbl">${k.lbl}</div>
        </div>
      `).join('')}
    </div>

    <div class="panel" style="margin-bottom:24px">
      <div style="font-size:14px;font-weight:600;color:#E8ECF4;margin-bottom:20px;font-family:'Plus Jakarta Sans',sans-serif">Évolution mensuelle — Entrées vs Sorties</div>
      <div style="display:flex;align-items:flex-end;gap:12px;height:160px;border-bottom:1px solid rgba(255,255,255,0.09);padding-bottom:12px;margin-bottom:12px" id="tres-chart"></div>
      <div style="display:flex;gap:20px;justify-content:center">
        <div style="display:flex;align-items:center;gap:6px"><div style="width:12px;height:12px;border-radius:3px;background:#10B981"></div><span style="font-size:12px;color:#7B8BAA;font-family:'Plus Jakarta Sans',sans-serif">Entrées</span></div>
        <div style="display:flex;align-items:center;gap:6px"><div style="width:12px;height:12px;border-radius:3px;background:#F43F5E"></div><span style="font-size:12px;color:#7B8BAA;font-family:'Plus Jakarta Sans',sans-serif">Sorties</span></div>
      </div>
    </div>

    <div class="panel">
      <div style="font-size:14px;font-weight:600;color:#E8ECF4;margin-bottom:16px;font-family:'Plus Jakarta Sans',sans-serif">Mouvements</div>
      <div style="text-align:center;padding:32px;color:#7B8BAA;font-family:'Plus Jakarta Sans',sans-serif">
        <i class="ti ti-receipt" style="font-size:32px;display:block;margin-bottom:8px;color:rgba(255,255,255,0.09)"></i>
        Aucun mouvement — les paiements apparaîtront ici
      </div>
    </div>
  `;

  setTimeout(() => {
    const chart = document.getElementById('tres-chart');
    if (!chart) return;
    const months = ['Jan', 'Fév', 'Mar', 'Avr', 'Mai', 'Juin'];
    const entrees = [0, 0, 0, 0, 0, mrr];
    const maxVal = Math.max(...entrees, 1000);
    chart.innerHTML = months.map((m, i) => {
      const he = Math.max(Math.round((entrees[i] / maxVal) * 140), 4);
      const isLast = i === months.length - 1;
      return `<div style="flex:1;display:flex;align-items:flex-end;justify-content:center;gap:3px">
        <div style="width:40%;background:${isLast?'#10B981':'rgba(16,185,129,0.25)'};border-radius:4px 4px 0 0;height:${he}px"></div>
        <div style="width:40%;background:rgba(244,63,94,0.25);border-radius:4px 4px 0 0;height:4px"></div>
      </div>`;
    }).join('');
  }, 100);
}
</script>
