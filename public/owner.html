<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediPulse — Vue Owner</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://unpkg.com/@tabler/icons-webfont@3.11.0/dist/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/shared.css">
<style>
body{background:#13151f;color:#E8ECF4;font-family:'Plus Jakarta Sans',sans-serif}

/* ── GRIDS — CSS only ── */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:20px}
.kpi-grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:20px}
.main-grid{display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-bottom:20px}

/* ── CARDS ── */
.kpi-card{background:#252936;border-radius:14px;border:1px solid rgba(255,255,255,0.09);padding:18px;min-width:0;border-left:3px solid transparent}
.panel{background:#252936;border-radius:14px;border:1px solid rgba(255,255,255,0.09);padding:18px;margin-bottom:18px;min-width:0}

/* ── KPI ── */
.kpi-val{font-size:28px;font-weight:800;color:#fff;line-height:1;margin-bottom:5px;font-family:'Plus Jakarta Sans',sans-serif}
.kpi-lbl{font-size:12px;color:#7B8BAA}

/* ── TABLE ── */
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.data-table{width:100%;border-collapse:collapse;min-width:500px}
.data-table th{font-size:10px;font-weight:600;color:#7B8BAA;text-transform:uppercase;letter-spacing:0.06em;padding:8px 10px;text-align:left;border-bottom:1px solid rgba(255,255,255,0.08)}
.data-table td{padding:11px 10px;border-bottom:1px solid rgba(255,255,255,0.04);font-size:12px;color:#E8ECF4;vertical-align:middle}

/* ── COUNTDOWN ── */
.countdown{background:linear-gradient(135deg,rgba(245,158,11,0.08),rgba(234,88,12,0.05));border:1px solid rgba(245,158,11,0.2);border-radius:12px;padding:16px;margin-bottom:14px}

/* ── NOTIF ── */
.notif-dd{display:none;position:absolute;right:0;top:44px;background:#252936;border:1px solid rgba(255,255,255,0.09);border-radius:14px;box-shadow:0 8px 32px rgba(0,0,0,0.3);width:300px;z-index:100;overflow:hidden}

/* ── PAGE HEADER ── */
.page-header{margin-bottom:20px}
.page-title{font-size:20px;font-weight:800;color:#E8ECF4;font-family:'Plus Jakarta Sans',sans-serif}
.page-sub{font-size:12px;color:#7B8BAA;margin-top:4px}

/* ── RESPONSIVE ── */
@media(max-width:768px){
  .kpi-grid,.kpi-grid-2{grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .main-grid{grid-template-columns:1fr;gap:14px}
  .kpi-val{font-size:22px}
  .panel{padding:14px}
  .kpi-card{padding:14px}
  .notif-dd{width:260px;right:-60px}
  .page-title{font-size:18px}
}
</style>
</head>
<body>
<div class="layout">

  <!-- SIDEBAR -->
  <div class="sidebar sidebar-dark" id="sidebar">
    <div class="sidebar-logo">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:5px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#06B6D4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        <div style="font-size:18px;font-weight:800;letter-spacing:-0.5px;color:#E8ECF4">Medi<span style="color:#06B6D4">Pulse</span></div>
      </div>
      <div style="font-size:10px;color:#7B8BAA;padding-left:30px;font-style:italic">La réputation médicale, automatisée.</div>
    </div>
    <div class="sidebar-user">
      <div class="sidebar-avatar" id="sb-avatar" style="background:rgba(245,158,11,0.2);color:#F59E0B"></div>
      <div>
        <div class="sidebar-username" id="sb-name"></div>
        <div class="sidebar-role" style="font-size:11px">Owner</div>
      </div>
    </div>
    <div class="sidebar-nav">
      <div class="nav-section">Vue globale</div>
      <div class="nav-link active" id="nav-dashboard" onclick="showPage('dashboard')"><i class="ti ti-chart-bar"></i>Dashboard</div>
      <div class="nav-link" id="nav-cabinets" onclick="showPage('cabinets')"><i class="ti ti-building-hospital"></i>Cabinets</div>
      <div class="nav-link" id="nav-equipe" onclick="showPage('equipe')"><i class="ti ti-users-group"></i>Équipe</div>
      <div class="nav-link" id="nav-prospects" onclick="showPage('prospects')"><i class="ti ti-users"></i>Prospects</div>
      <div class="nav-link" id="nav-paiements" onclick="showPage('paiements')"><i class="ti ti-credit-card"></i>Paiements</div>
      <div class="nav-link" id="nav-tresorerie" onclick="showPage('tresorerie')"><i class="ti ti-chart-line"></i>Trésorerie</div>
    </div>
    <div class="sidebar-footer">
      <button class="logout-btn logout-btn-red" onclick="doLogout()">
        <i class="ti ti-logout" style="font-size:15px"></i> Déconnexion
      </button>
    </div>
  </div>

  <!-- Mobile overlay -->
  <div class="sidebar-overlay" id="mob-overlay" onclick="closeSidebar()"></div>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar" style="background:#1c1f2e;border-bottom:1px solid rgba(255,255,255,0.08)">
      <div style="display:flex;align-items:center;gap:10px">
        <button class="mobile-menu-btn" onclick="toggleSidebar()" style="color:#E8ECF4"><i class="ti ti-menu-2"></i></button>
        <div style="font-size:15px;font-weight:700;color:#E8ECF4" id="page-title">Vue 360°</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <span style="padding:3px 12px;border-radius:99px;font-size:11px;font-weight:600;background:rgba(245,158,11,0.15);color:#F59E0B;border:1px solid rgba(245,158,11,0.25)">Owner</span>
        <span style="font-size:11px;color:#7B8BAA" id="topbar-date"></span>
        <div style="position:relative">
          <button onclick="toggleNotifs()" id="notif-btn" style="width:34px;height:34px;border-radius:9px;background:rgba(6,182,212,0.12);border:1px solid rgba(6,182,212,0.3);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#E8ECF4" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span id="notif-badge" style="display:none;position:absolute;top:-5px;right:-5px;width:16px;height:16px;border-radius:50%;background:#F43F5E;font-size:9px;font-weight:700;color:#fff;align-items:center;justify-content:center">0</span>
          </button>
          <div class="notif-dd" id="notif-dd">
            <div style="padding:12px 16px;border-bottom:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:space-between">
              <span style="font-size:13px;font-weight:700;color:#E8ECF4">Notifications</span>
              <span onclick="clearNotifs()" style="font-size:11px;color:#06B6D4;cursor:pointer">Tout effacer</span>
            </div>
            <div id="notif-list" style="max-height:280px;overflow-y:auto">
              <div style="padding:20px;text-align:center;color:#7B8BAA;font-size:12px">Aucune notification</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="content" id="main-content" style="background:#13151f">
      <div style="text-align:center;padding:60px;color:#7B8BAA">Chargement...</div>
    </div>
  </div>
</div>

<div id="toast"></div>
<script src="/js/supabase.js"></script>
<script>
let currentUser=null,userRecord=null,notifications=[];

(async()=>{
  const auth=await requireAuth('owner');
  if(!auth)return;
  currentUser=auth.session.user;
  userRecord=auth.user;
  document.getElementById('sb-avatar').textContent=(userRecord.nom||currentUser.email).substring(0,2).toUpperCase();
  document.getElementById('sb-name').textContent=userRecord.nom||currentUser.email.split('@')[0];
  document.getElementById('topbar-date').textContent=new Date().toLocaleDateString('fr-FR',{day:'numeric',month:'long'});
  showPage('dashboard');
  checkAlerts();
})();

function showPage(page){
  closeSidebar();
  document.querySelectorAll('.nav-link').forEach(l=>l.classList.remove('active'));
  const el=document.getElementById('nav-'+page);
  if(el)el.classList.add('active');
  const titles={dashboard:'Vue 360°',cabinets:'Cabinets',equipe:'Équipe commerciale',prospects:'Prospects',paiements:'Paiements',tresorerie:'Trésorerie'};
  document.getElementById('page-title').textContent=titles[page]||'Dashboard';
  if(page==='dashboard')renderDashboard();
  else if(page==='cabinets')renderCabinets();
  else if(page==='equipe')renderEquipe();
  else if(page==='prospects')renderProspects();
  else if(page==='paiements')renderPaiements();
  else if(page==='tresorerie')renderTresorerie();
}

function toggleSidebar(){
  var sb=document.getElementById('sidebar');
  var ov=document.getElementById('mob-overlay');
  var open=sb.classList.toggle('open');
  if(ov)ov.classList.toggle('active',open);
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  var ov=document.getElementById('mob-overlay');
  if(ov)ov.classList.remove('active');
}

// ── NOTIFICATIONS ──
function addNotif(msg,type,icon){
  notifications.unshift({msg,type,icon,time:new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})});
  updateBadge();renderNotifList();
}
function updateBadge(){
  var b=document.getElementById('notif-badge');
  if(!b)return;
  if(notifications.length>0){b.style.display='flex';b.textContent=Math.min(notifications.length,9)+(notifications.length>9?'+':'');}
  else b.style.display='none';
}
function toggleNotifs(){var dd=document.getElementById('notif-dd');if(dd)dd.style.display=dd.style.display==='block'?'none':'block';}
function clearNotifs(){notifications=[];updateBadge();renderNotifList();var dd=document.getElementById('notif-dd');if(dd)dd.style.display='none';}
function renderNotifList(){
  var list=document.getElementById('notif-list');if(!list)return;
  var colors={info:'#06B6D4',warning:'#F59E0B',error:'#F43F5E',success:'#10B981'};
  list.innerHTML=notifications.length?notifications.map(n=>`
    <div style="padding:10px 14px;border-bottom:1px solid rgba(255,255,255,0.05);display:flex;gap:8px">
      <i class="ti ${n.icon||'ti-bell'}" style="font-size:15px;color:${colors[n.type]||colors.info};flex-shrink:0;margin-top:2px"></i>
      <div><div style="font-size:12px;color:#E8ECF4;line-height:1.4">${n.msg}</div><div style="font-size:10px;color:#7B8BAA;margin-top:2px">${n.time}</div></div>
    </div>`).join(''):'<div style="padding:20px;text-align:center;color:#7B8BAA;font-size:12px">Aucune notification</div>';
}
document.addEventListener('click',e=>{
  var dd=document.getElementById('notif-dd');
  var btn=document.getElementById('notif-btn');
  if(dd&&btn&&!btn.contains(e.target)&&!dd.contains(e.target))dd.style.display='none';
});

async function checkAlerts(){
  const tomorrow=new Date();tomorrow.setDate(tomorrow.getDate()+1);
  const tStr=tomorrow.toISOString().split('T')[0];
  const{data:cabs}=await sb.from('cabinets').select('*');
  if(!cabs)return;
  cabs.forEach(c=>{
    if(c.date_fin_trial===tStr&&c.statut==='trial')
      addNotif('⚠️ Trial expire demain — '+(c.nom_cabinet||c.nom_medecin),'warning','ti-clock');
  });
}

// ── DASHBOARD ──
async function renderDashboard(){
  const[{data:pros},{data:cabs},{data:users}]=await Promise.all([
    sb.from('prospection').select('*'),
    sb.from('cabinets').select('*'),
    sb.from('users').select('*').eq('role','commercial'),
  ]);
  const p=pros||[],c=cabs||[],u=users||[];
  const actifs=c.filter(x=>x.statut==='actif');
  const trials=c.filter(x=>x.statut==='trial');
  const mrr=actifs.reduce((acc,x)=>acc+(TARIF[x.plan]||TD),0);
  const now=new Date();
  const firstDay=new Date(now.getFullYear(),now.getMonth(),1).toISOString().split('T')[0];
  const signesMois=p.filter(x=>x.statut==='Signé'&&x.date_appel>=firstDay).length;
  const daysLeft=Math.ceil((new Date(now.getFullYear(),now.getMonth()+1,0)-now)/(1000*60*60*24));
  const colors=['#06B6D4','#8B5CF6','#10B981','#F59E0B'];

  document.getElementById('main-content').innerHTML=`
    <div class="page-header">
      <div class="page-title">Vue 360°</div>
      <div class="page-sub">${new Date().toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})}</div>
    </div>

    <div class="kpi-grid">
      <div class="kpi-card" style="border-left-color:#F59E0B">
        <i class="ti ti-building-hospital" style="font-size:18px;color:#F59E0B;display:block;margin-bottom:10px"></i>
        <div class="kpi-val">${actifs.length}</div>
        <div class="kpi-lbl">Cabinets actifs</div>
      </div>
      <div class="kpi-card" style="border-left-color:#10B981">
        <i class="ti ti-currency-dollar" style="font-size:18px;color:#10B981;display:block;margin-bottom:10px"></i>
        <div class="kpi-val">${mrr.toLocaleString('fr-FR')}</div>
        <div class="kpi-lbl">MRR (DH/mois)</div>
      </div>
      <div class="kpi-card" style="border-left-color:#2563EB">
        <i class="ti ti-users" style="font-size:18px;color:#2563EB;display:block;margin-bottom:10px"></i>
        <div class="kpi-val">${p.length}</div>
        <div class="kpi-lbl">Prospects total</div>
      </div>
      <div class="kpi-card" style="border-left-color:#06B6D4">
        <i class="ti ti-circle-check" style="font-size:18px;color:#06B6D4;display:block;margin-bottom:10px"></i>
        <div class="kpi-val">${signesMois}</div>
        <div class="kpi-lbl">Signés ce mois</div>
      </div>
    </div>

    <div class="kpi-grid-2">
      <div class="kpi-card" style="border-left-color:#F59E0B">
        <i class="ti ti-clock" style="font-size:18px;color:#F59E0B;display:block;margin-bottom:10px"></i>
        <div class="kpi-val">${trials.length}</div>
        <div class="kpi-lbl">En trial</div>
      </div>
      <div class="kpi-card" style="border-left-color:#8B5CF6">
        <i class="ti ti-calendar-check" style="font-size:18px;color:#8B5CF6;display:block;margin-bottom:10px"></i>
        <div class="kpi-val">${p.filter(x=>x.statut==='Démo Bookée'||x.statut==='Démo Faite').length}</div>
        <div class="kpi-lbl">Démos</div>
      </div>
      <div class="kpi-card" style="border-left-color:#F43F5E">
        <i class="ti ti-x" style="font-size:18px;color:#F43F5E;display:block;margin-bottom:10px"></i>
        <div class="kpi-val">${p.filter(x=>x.statut==='Refus').length}</div>
        <div class="kpi-lbl">Refus</div>
      </div>
      <div class="kpi-card" style="border-left-color:#06B6D4">
        <i class="ti ti-users-group" style="font-size:18px;color:#06B6D4;display:block;margin-bottom:10px"></i>
        <div class="kpi-val">${u.length}</div>
        <div class="kpi-lbl">Commerciaux</div>
      </div>
    </div>

    <div class="main-grid">
      <div class="panel">
        <div style="font-size:14px;font-weight:700;color:#E8ECF4;margin-bottom:14px;display:flex;align-items:center;gap:6px">
          <i class="ti ti-users-group" style="color:#06B6D4;font-size:15px"></i> Équipe commerciale
        </div>
        ${u.length?u.map((usr,i)=>{
          const signes=p.filter(x=>x.commercial_id===usr.email&&x.statut==='Signé').length;
          const appels=p.filter(x=>x.commercial_id===usr.email&&x.statut!=='Nouveau').length;
          return`<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.05)">
            <div style="width:36px;height:36px;border-radius:10px;background:${colors[i%4]}22;color:${colors[i%4]};display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0">${(usr.nom||usr.email).substring(0,2).toUpperCase()}</div>
            <div style="flex:1;min-width:0">
              <div style="font-size:13px;font-weight:600;color:#E8ECF4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${usr.nom||usr.email}</div>
              <div style="font-size:11px;color:#7B8BAA;margin-top:1px">${usr.type==='terrain'?'🚶 Terrain':'📞 Téléphone'}</div>
            </div>
            <div style="display:flex;gap:14px;text-align:right;flex-shrink:0">
              <div><div style="font-size:15px;font-weight:700;color:#10B981">${signes}</div><div style="font-size:9px;color:#7B8BAA">Signés</div></div>
              <div><div style="font-size:15px;font-weight:700;color:#06B6D4">${appels}</div><div style="font-size:9px;color:#7B8BAA">Appels</div></div>
            </div>
          </div>`;
        }).join(''):'<div style="text-align:center;padding:24px;color:#7B8BAA;font-size:13px">Aucun commercial</div>'}
      </div>

      <div>
        <div class="countdown">
          <div style="font-size:11px;color:#7B8BAA;margin-bottom:4px">Fin du mois</div>
          <div style="font-size:36px;font-weight:800;color:#F59E0B;line-height:1">${daysLeft}</div>
          <div style="font-size:11px;color:#7B8BAA">jours restants</div>
        </div>
        <div class="panel" style="margin-bottom:0">
          <div style="font-size:13px;font-weight:700;color:#E8ECF4;margin-bottom:12px">Derniers cabinets</div>
          ${c.length?c.slice(-4).reverse().map(x=>`
            <div style="padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.05)">
              <div style="font-size:12px;font-weight:600;color:#E8ECF4">${x.nom_cabinet||x.nom_medecin}</div>
              <div style="font-size:11px;color:#7B8BAA;margin-top:2px">${x.specialite} · <span style="color:${x.statut==='actif'?'#10B981':'#F59E0B'}">${x.statut}</span></div>
            </div>`).join(''):'<div style="text-align:center;padding:16px;color:#7B8BAA;font-size:12px">Aucun cabinet</div>'}
        </div>
      </div>
    </div>
  `;
}

// ── CABINETS ──
async function renderCabinets(){
  const{data:cabs}=await sb.from('cabinets').select('*');
  const c=cabs||[];
  const sc={
    'trial':{bg:'rgba(245,158,11,0.12)',color:'#B45309',label:'🔄 Trial'},
    'actif':{bg:'rgba(16,185,129,0.12)',color:'#15803D',label:'✅ Actif'},
    'suspendu_propose':{bg:'rgba(244,63,94,0.1)',color:'#BE123C',label:'⚠ Suspension proposée'},
    'suspendu':{bg:'rgba(244,63,94,0.15)',color:'#BE123C',label:'🔴 Suspendu'},
  };
  document.getElementById('main-content').innerHTML=`
    <div class="page-header">
      <div class="page-title">Cabinets</div>
      <div class="page-sub">${c.length} cabinets — ${c.filter(x=>x.statut==='actif').length} actifs — ${c.filter(x=>x.statut==='trial').length} en trial</div>
    </div>
    <div class="panel">
      <div class="table-scroll">
        <table class="data-table">
          <thead><tr><th>Cabinet</th><th>Plan</th><th>Statut</th><th>Échéance</th><th>Actions</th></tr></thead>
          <tbody>${c.length?c.map(x=>{
            const s=sc[x.statut]||{bg:'rgba(255,255,255,0.05)',color:'#7B8BAA',label:x.statut||'—'};
            const daysLeft=x.date_fin_trial?Math.ceil((new Date(x.date_fin_trial)-new Date())/(1000*60*60*24)):null;
            return`<tr>
              <td><div style="font-weight:600;color:#E8ECF4">${x.nom_cabinet||x.nom_medecin}</div><div style="font-size:10px;color:#7B8BAA;margin-top:1px">${x.specialite} · ${x.ville}</div></td>
              <td><span style="padding:2px 8px;border-radius:99px;font-size:10px;font-weight:600;background:rgba(6,182,212,0.1);color:#06B6D4">${x.plan||'pro'}</span></td>
              <td><span style="padding:3px 8px;border-radius:99px;font-size:10px;font-weight:600;background:${s.bg};color:${s.color}">${s.label}</span></td>
              <td style="font-size:11px;color:#7B8BAA">${x.statut==='trial'?'Trial : '+(x.date_fin_trial||'—')+(daysLeft!==null?' ('+daysLeft+'j)':''):'Renouv. : '+(x.date_renouvellement||'—')}</td>
              <td>
                <div style="display:flex;gap:4px;flex-wrap:wrap">
                  ${x.statut==='trial'?`<button onclick="confirmer('${x.id}')" style="padding:4px 8px;border-radius:5px;border:none;background:rgba(6,182,212,0.1);color:#06B6D4;font-size:10px;font-weight:600;cursor:pointer">Convertir</button>`:''}
                  ${x.statut==='actif'?`<button onclick="proposerSuspension('${x.id}')" style="padding:4px 8px;border-radius:5px;border:none;background:rgba(255,255,255,0.06);color:#7B8BAA;font-size:10px;cursor:pointer">Suspendre</button>`:''}
                  ${x.statut==='suspendu'?`<button onclick="reactiver('${x.id}')" style="padding:4px 8px;border-radius:5px;border:none;background:rgba(16,185,129,0.15);color:#10B981;font-size:10px;font-weight:600;cursor:pointer">Réactiver</button>`:''}
                  ${x.statut==='suspendu_propose'?`<button onclick="confirmer('${x.id}')" style="padding:4px 8px;border-radius:5px;border:none;background:rgba(16,185,129,0.15);color:#10B981;font-size:10px;font-weight:600;cursor:pointer">Confirmer</button><button onclick="suspendre('${x.id}')" style="padding:4px 8px;border-radius:5px;border:none;background:rgba(244,63,94,0.1);color:#F43F5E;font-size:10px;cursor:pointer">Suspendre</button>`:''}
                </div>
              </td>
            </tr>`;}).join(''):'<tr><td colspan="5" style="text-align:center;padding:28px;color:#7B8BAA">Aucun cabinet</td></tr>'}
          </tbody>
        </table>
      </div>
    </div>`;
}

async function confirmer(id){
  const renew=new Date();renew.setMonth(renew.getMonth()+1);
  await sb.from('cabinets').update({statut:'actif',date_renouvellement:renew.toISOString().split('T')[0]}).eq('id',id);
  showToast('Cabinet activé','success');renderCabinets();
}
async function suspendre(id){await sb.from('cabinets').update({statut:'suspendu'}).eq('id',id);showToast('Cabinet suspendu','error');renderCabinets();}
async function proposerSuspension(id){await sb.from('cabinets').update({statut:'suspendu_propose'}).eq('id',id);renderCabinets();}
async function reactiver(id){
  const renew=new Date();renew.setMonth(renew.getMonth()+1);
  await sb.from('cabinets').update({statut:'actif',date_renouvellement:renew.toISOString().split('T')[0]}).eq('id',id);
  showToast('Cabinet réactivé','success');renderCabinets();
}

// ── EQUIPE ──
async function renderEquipe(){
  const[{data:users},{data:pros}]=await Promise.all([
    sb.from('users').select('*').eq('role','commercial'),
    sb.from('prospection').select('*'),
  ]);
  const u=users||[],p=pros||[];
  const colors=['#06B6D4','#8B5CF6','#10B981','#F59E0B'];
  document.getElementById('main-content').innerHTML=`
    <div class="page-header"><div class="page-title">Équipe commerciale</div><div class="page-sub">${u.length} commercial${u.length>1?'s':''}</div></div>
    <div class="panel">
      <div class="table-scroll">
        <table class="data-table">
          <thead><tr><th>Commercial</th><th>Type</th><th>Prospects</th><th>Appels</th><th>Signés</th><th>Primes</th></tr></thead>
          <tbody>${u.length?u.map((usr,i)=>{
            const myP=p.filter(x=>x.commercial_id===usr.email);
            const signes=myP.filter(x=>x.statut==='Signé').length;
            const isTer=usr.type==='terrain';
            const prime=signes*Math.round(TD*(isTer?P_SIG_TER:P_SIG_TEL));
            const bonus=([...(isTer?PAL_TER:PAL_TEL)].reverse().find(x=>signes>=x.s)||{b:0}).b;
            return`<tr>
              <td><div style="display:flex;align-items:center;gap:8px"><div style="width:30px;height:30px;border-radius:7px;background:${colors[i%4]}22;color:${colors[i%4]};display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700">${(usr.nom||usr.email).substring(0,2).toUpperCase()}</div><span style="font-weight:600;font-size:12px">${usr.nom||usr.email}</span></div></td>
              <td style="font-size:12px">${usr.type==='terrain'?'Terrain':'Téléphone'}</td>
              <td style="font-size:12px">${myP.length}</td>
              <td style="font-size:12px">${myP.filter(x=>x.statut!=='Nouveau').length}</td>
              <td style="font-weight:700;color:#10B981;font-size:12px">${signes}</td>
              <td style="font-weight:700;color:#06B6D4;font-size:12px">${(prime+bonus).toLocaleString('fr-FR')} DH</td>
            </tr>`;}).join(''):'<tr><td colspan="6" style="text-align:center;padding:28px;color:#7B8BAA">Aucun commercial</td></tr>'}
          </tbody>
        </table>
      </div>
    </div>`;
}

// ── PROSPECTS ──
async function renderProspects(){
  const{data}=await sb.from('prospection').select('*').order('id');
  const prospects=data||[];
  document.getElementById('main-content').innerHTML=`
    <div class="page-header"><div class="page-title">Prospects</div><div class="page-sub">${prospects.length} au total</div></div>
    <div class="panel">
      <div class="table-scroll">
        <table class="data-table">
          <thead><tr><th>Médecin</th><th>Spécialité</th><th>Téléphone</th><th>Statut</th><th>Commercial</th></tr></thead>
          <tbody>${prospects.map(p=>{
            const st=ST.find(s=>s.key===p.statut)||ST[0];
            return`<tr>
              <td style="font-weight:600;font-size:12px">${p.nom}</td>
              <td style="color:#7B8BAA;font-size:11px">${p.specialite}</td>
              <td style="color:#7B8BAA;font-size:11px">${p.telephone_fixe||'—'}</td>
              <td><span style="padding:2px 8px;border-radius:99px;font-size:10px;font-weight:600;background:${st.bg};color:${st.color}">${st.label}</span></td>
              <td style="font-size:11px;color:#7B8BAA">${p.commercial_id||'Non assigné'}</td>
            </tr>`;}).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
}

// ── PAIEMENTS ──
async function renderPaiements(){
  const{data:cabs}=await sb.from('cabinets').select('*');
  const c=cabs||[];
  document.getElementById('main-content').innerHTML=`
    <div class="page-header">
      <div class="page-title">Paiements</div>
    </div>
    <div class="kpi-grid" style="margin-bottom:18px">
      <div class="kpi-card" style="border-left-color:#10B981"><i class="ti ti-trending-up" style="font-size:18px;color:#10B981;display:block;margin-bottom:10px"></i><div class="kpi-val">0 DH</div><div class="kpi-lbl">Encaissé ce mois</div></div>
      <div class="kpi-card" style="border-left-color:#F59E0B"><i class="ti ti-clock" style="font-size:18px;color:#F59E0B;display:block;margin-bottom:10px"></i><div class="kpi-val">0</div><div class="kpi-lbl">En attente validation</div></div>
      <div class="kpi-card" style="border-left-color:#2563EB"><i class="ti ti-building-hospital" style="font-size:18px;color:#2563EB;display:block;margin-bottom:10px"></i><div class="kpi-val">${c.filter(x=>x.statut==='actif').length}</div><div class="kpi-lbl">Cabinets actifs</div></div>
    </div>
    <div class="panel">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px">
        <div style="font-size:13px;font-weight:700;color:#E8ECF4">Historique des paiements</div>
        <button onclick="openPaiement()" style="padding:8px 14px;border-radius:8px;background:linear-gradient(135deg,#2563EB,#06B6D4);color:#fff;border:none;font-size:12px;font-weight:600;cursor:pointer">+ Enregistrer</button>
      </div>
      <div style="text-align:center;padding:28px;color:#7B8BAA;font-size:13px">Aucun paiement enregistré</div>
    </div>`;
}

function openPaiement(){
  // Charger les cabinets pour le select
  sb.from('cabinets').select('id,nom_cabinet').eq('statut','actif').then(({data})=>{
    const opts=(data||[]).map(cab=>'<option value="'+cab.id+'">'+cab.nom_cabinet+'</option>').join('');
    document.getElementById('modal-overlay').innerHTML=`
      <div style="background:#fff;border-radius:20px;padding:28px;width:100%;max-width:460px;box-shadow:0 20px 60px rgba(0,0,0,0.15)">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
          <div style="font-size:17px;font-weight:700;color:#0F172A">Enregistrer un paiement</div>
          <button onclick="closeModal()" style="background:none;border:none;cursor:pointer;font-size:20px;color:#94A3B8">✕</button>
        </div>
        <div style="display:flex;flex-direction:column;gap:14px">
          <div>
            <label style="font-size:11px;font-weight:600;color:#374151;text-transform:uppercase;letter-spacing:0.05em;display:block;margin-bottom:6px">Cabinet</label>
            <select id="pay-cabinet" style="width:100%;padding:11px 14px;border-radius:10px;border:1px solid #E5E7EB;font-size:14px;font-family:'Plus Jakarta Sans',sans-serif;outline:none;background:#F9FAFB">
              <option value="">Sélectionner un cabinet</option>
              ${opts}
            </select>
          </div>
          <div>
            <label style="font-size:11px;font-weight:600;color:#374151;text-transform:uppercase;letter-spacing:0.05em;display:block;margin-bottom:6px">Montant (DH)</label>
            <input id="pay-montant" type="number" placeholder="1499" style="width:100%;padding:11px 14px;border-radius:10px;border:1px solid #E5E7EB;font-size:14px;font-family:'Plus Jakarta Sans',sans-serif;outline:none;background:#F9FAFB">
          </div>
          <div>
            <label style="font-size:11px;font-weight:600;color:#374151;text-transform:uppercase;letter-spacing:0.05em;display:block;margin-bottom:6px">Mode de paiement</label>
            <select id="pay-mode" style="width:100%;padding:11px 14px;border-radius:10px;border:1px solid #E5E7EB;font-size:14px;font-family:'Plus Jakarta Sans',sans-serif;outline:none;background:#F9FAFB">
              <option value="virement">Virement</option>
              <option value="carte">Carte</option>
              <option value="cash">Cash</option>
              <option value="cheque">Chèque</option>
            </select>
          </div>
          <div>
            <label style="font-size:11px;font-weight:600;color:#374151;text-transform:uppercase;letter-spacing:0.05em;display:block;margin-bottom:6px">Statut</label>
            <select id="pay-statut" style="width:100%;padding:11px 14px;border-radius:10px;border:1px solid #E5E7EB;font-size:14px;font-family:'Plus Jakarta Sans',sans-serif;outline:none;background:#F9FAFB">
              <option value="valide">Validé</option>
              <option value="en_attente">En attente</option>
            </select>
          </div>
          <div>
            <label style="font-size:11px;font-weight:600;color:#374151;text-transform:uppercase;letter-spacing:0.05em;display:block;margin-bottom:6px">Note (optionnel)</label>
            <input id="pay-note" type="text" placeholder="Ex: Mois de mai 2026" style="width:100%;padding:11px 14px;border-radius:10px;border:1px solid #E5E7EB;font-size:14px;font-family:'Plus Jakarta Sans',sans-serif;outline:none;background:#F9FAFB">
          </div>
          <button onclick="handleCreatePayment()" style="width:100%;padding:14px;border-radius:12px;border:none;background:linear-gradient(135deg,#0A2540,#2563EB);color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;margin-top:4px">
            Enregistrer le paiement
          </button>
        </div>
      </div>`;
    document.getElementById('modal-overlay').style.display='flex';
  });
}

function closeModal(){
  document.getElementById('modal-overlay').style.display='none';
}

async function handleCreatePayment(){
  const cabinet_id=document.getElementById('pay-cabinet').value;
  const montant=parseFloat(document.getElementById('pay-montant').value);
  const mode=document.getElementById('pay-mode').value;
  const statut=document.getElementById('pay-statut').value;
  const note=document.getElementById('pay-note').value;

  if(!cabinet_id){showToast('Sélectionnez un cabinet','error');return;}
  if(!montant||montant<=0){showToast('Entrez un montant valide','error');return;}

  const{error}=await sb.from('paiements').insert([{
    cabinet_id,montant,mode,statut,note,
    mois:new Date().toLocaleDateString('fr-FR',{month:'long',year:'numeric'})
  }]);

  if(error){showToast('Erreur: '+error.message,'error');return;}
  
  closeModal();
  showToast('Paiement enregistré !','success');
  renderPaiements();
}

// ── TRESORERIE ──
async function renderTresorerie(){
  const{data:cabs}=await sb.from('cabinets').select('*');
  const c=cabs||[];
  const mrr=c.filter(x=>x.statut==='actif').reduce((acc,x)=>acc+(TARIF[x.plan]||TD),0);
  document.getElementById('main-content').innerHTML=`
    <div class="page-header"><div class="page-title">Trésorerie</div><div class="page-sub">Vue financière complète</div></div>
    <div class="kpi-grid" style="margin-bottom:18px">
      <div class="kpi-card" style="border-left-color:#10B981"><i class="ti ti-trending-up" style="font-size:18px;color:#10B981;display:block;margin-bottom:10px"></i><div class="kpi-val">${mrr.toLocaleString('fr-FR')}</div><div class="kpi-lbl">MRR (DH/mois)</div></div>
      <div class="kpi-card" style="border-left-color:#2563EB"><i class="ti ti-currency-dollar" style="font-size:18px;color:#2563EB;display:block;margin-bottom:10px"></i><div class="kpi-val">0</div><div class="kpi-lbl">Encaissé ce mois</div></div>
      <div class="kpi-card" style="border-left-color:#F43F5E"><i class="ti ti-arrow-down" style="font-size:18px;color:#F43F5E;display:block;margin-bottom:10px"></i><div class="kpi-val">0</div><div class="kpi-lbl">Sorties ce mois</div></div>
      <div class="kpi-card" style="border-left-color:#06B6D4"><i class="ti ti-scale" style="font-size:18px;color:#06B6D4;display:block;margin-bottom:10px"></i><div class="kpi-val">0</div><div class="kpi-lbl">Marge nette</div></div>
    </div>
    <div class="panel">
      <div style="font-size:13px;font-weight:700;color:#E8ECF4;margin-bottom:16px">Évolution mensuelle</div>
      <div id="tres-chart" style="display:flex;align-items:flex-end;gap:10px;height:120px;border-bottom:1px solid rgba(255,255,255,0.08);padding-bottom:10px;margin-bottom:10px"></div>
      <div style="display:flex;gap:16px;justify-content:center">
        <div style="display:flex;align-items:center;gap:5px"><div style="width:10px;height:10px;border-radius:2px;background:#10B981"></div><span style="font-size:11px;color:#7B8BAA">Entrées</span></div>
        <div style="display:flex;align-items:center;gap:5px"><div style="width:10px;height:10px;border-radius:2px;background:#F43F5E"></div><span style="font-size:11px;color:#7B8BAA">Sorties</span></div>
      </div>
    </div>
    <div class="panel" style="margin-bottom:0">
      <div style="font-size:13px;font-weight:700;color:#E8ECF4;margin-bottom:14px">Mouvements</div>
      <div style="text-align:center;padding:24px;color:#7B8BAA;font-size:12px">Aucun mouvement enregistré</div>
    </div>`;

  setTimeout(()=>{
    const chart=document.getElementById('tres-chart');if(!chart)return;
    const months=['Jan','Fév','Mar','Avr','Mai','Juin'];
    const entrees=[0,0,0,0,0,mrr];
    const maxVal=Math.max(...entrees,1000);
    chart.innerHTML=months.map((m,i)=>{
      const he=Math.max(Math.round((entrees[i]/maxVal)*110),4);
      const isLast=i===months.length-1;
      return`<div style="flex:1;display:flex;align-items:flex-end;justify-content:center;gap:2px">
        <div style="width:45%;background:${isLast?'#10B981':'rgba(16,185,129,0.25)'};border-radius:3px 3px 0 0;height:${he}px"></div>
        <div style="width:45%;background:rgba(244,63,94,0.2);border-radius:3px 3px 0 0;height:4px"></div>
      </div>`;
    }).join('');
  },100);
}
</script>
<div id="modal-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;align-items:center;justify-content:center;padding:20px"></div>
</body>
