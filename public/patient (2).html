<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MediPulse - Votre avis</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#F0F6FF}
body{font-family:'Plus Jakarta Sans',sans-serif;display:flex;align-items:center;justify-content:center;padding:20px;min-height:100vh}

.page{width:100%;max-width:400px}

.logo-bar{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:28px}
.logo-pulse{color:#2563EB}
.logo-text{font-size:18px;font-weight:800;color:#0F172A;letter-spacing:-0.3px}
.logo-text span{color:#2563EB}

.card{background:#fff;border-radius:24px;padding:28px 24px;box-shadow:0 2px 20px rgba(15,23,42,0.06),0 0 0 1px rgba(15,23,42,0.04)}

.cab-badge{display:flex;align-items:center;gap:12px;background:#F0F6FF;border-radius:14px;padding:12px 16px;margin-bottom:28px}
.cab-icon{width:40px;height:40px;border-radius:12px;background:#2563EB;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cab-icon svg{color:#fff}
.cab-name{font-size:13px;font-weight:700;color:#0F172A;line-height:1.3}
.cab-spec{font-size:11px;color:#64748B;margin-top:2px}

.screen{display:none}
.screen.active{display:block}

.q-title{font-size:22px;font-weight:800;color:#0F172A;text-align:center;line-height:1.3;margin-bottom:8px;letter-spacing:-0.3px}
.q-sub{font-size:13px;color:#94A3B8;text-align:center;margin-bottom:32px}

.emoji-stack{display:flex;flex-direction:column;gap:12px}

.emoji-btn{display:flex;align-items:center;gap:16px;padding:16px 20px;border-radius:16px;border:1.5px solid #E8EEF8;background:#FAFBFF;cursor:pointer;transition:all 0.15s;width:100%;text-align:left;font-family:'Plus Jakarta Sans',sans-serif;position:relative;overflow:hidden}
.emoji-btn:active{transform:scale(0.98)}
.emoji-btn.pos:hover,.emoji-btn.pos:focus{border-color:#BBF7D0;background:#F0FDF4}
.emoji-btn.mid:hover,.emoji-btn.mid:focus{border-color:#FDE68A;background:#FFFBEB}
.emoji-btn.neg:hover,.emoji-btn.neg:focus{border-color:#FECDD3;background:#FFF1F2}

.emoji-face{font-size:32px;line-height:1;flex-shrink:0}
.emoji-content{flex:1}
.emoji-label{font-size:15px;font-weight:700;color:#0F172A}
.emoji-desc{font-size:12px;color:#94A3B8;margin-top:2px}
.emoji-arrow{color:#CBD5E1;font-size:18px;flex-shrink:0}

.result-center{text-align:center}
.result-emoji{font-size:56px;margin-bottom:16px;display:block}
.result-title{font-size:22px;font-weight:800;color:#0F172A;margin-bottom:10px;letter-spacing:-0.3px}
.result-body{font-size:14px;color:#64748B;line-height:1.7;margin-bottom:28px}

.google-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:17px 20px;border-radius:16px;background:#1a73e8;color:#fff;font-size:15px;font-weight:700;text-decoration:none;border:none;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;letter-spacing:-0.2px;transition:all 0.15s}
.google-btn:active{transform:scale(0.98);background:#1557b0}
.google-btn .g-icon{width:20px;height:20px;flex-shrink:0}

.divider{display:flex;align-items:center;gap:12px;margin:20px 0}
.divider-line{flex:1;height:1px;background:#F1F5F9}
.divider-text{font-size:11px;color:#CBD5E1;font-weight:500}

.skip-btn{width:100%;padding:13px;border-radius:14px;background:transparent;border:1.5px solid #E2E8F0;color:#94A3B8;font-size:13px;font-weight:600;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;transition:all 0.15s}
.skip-btn:active{background:#F8FAFC}

.done-circle{width:72px;height:72px;border-radius:50%;background:#F0FDF4;border:2px solid #BBF7D0;display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
.done-check{width:32px;height:32px;color:#10B981}

.loading-dots{display:flex;align-items:center;justify-content:center;gap:6px;padding:24px 0}
.dot{width:8px;height:8px;border-radius:50%;background:#CBD5E1;animation:pulse 1.4s infinite}
.dot:nth-child(2){animation-delay:0.2s}
.dot:nth-child(3){animation-delay:0.4s}
@keyframes pulse{0%,80%,100%{opacity:0.3;transform:scale(0.8)}40%{opacity:1;transform:scale(1)}}

.footer{text-align:center;margin-top:20px;font-size:11px;color:#CBD5E1;display:flex;align-items:center;justify-content:center;gap:5px}

[dir="rtl"] .emoji-btn{flex-direction:row-reverse;text-align:right}
[dir="rtl"] .emoji-arrow{transform:rotate(180deg)}
[dir="rtl"] .cab-badge{flex-direction:row-reverse;text-align:right}
</style>
</head>
<body>
<div class="page">
  <div class="logo-bar">
    <svg class="logo-pulse" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
    <div class="logo-text">Medi<span>Pulse</span></div>
  </div>

  <div class="card">
    <div class="cab-badge" id="cab-badge" style="display:none">
      <div class="cab-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </div>
      <div>
        <div class="cab-name" id="cab-name"></div>
        <div class="cab-spec" id="cab-spec"></div>
      </div>
    </div>

    <div class="screen active" id="screen-loading">
      <div class="loading-dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>

    <div class="screen" id="screen-question">
      <div class="q-title" id="q-title"></div>
      <div class="q-sub" id="q-sub"></div>
      <div class="emoji-stack">
        <button class="emoji-btn pos" onclick="repondre('positif')">
          <span class="emoji-face">😊</span>
          <div class="emoji-content">
            <div class="emoji-label" id="lbl-pos"></div>
            <div class="emoji-desc" id="desc-pos"></div>
          </div>
          <span class="emoji-arrow">›</span>
        </button>
        <button class="emoji-btn mid" onclick="repondre('neutre')">
          <span class="emoji-face">😐</span>
          <div class="emoji-content">
            <div class="emoji-label" id="lbl-mid"></div>
            <div class="emoji-desc" id="desc-mid"></div>
          </div>
          <span class="emoji-arrow">›</span>
        </button>
        <button class="emoji-btn neg" onclick="repondre('negatif')">
          <span class="emoji-face">😞</span>
          <div class="emoji-content">
            <div class="emoji-label" id="lbl-neg"></div>
            <div class="emoji-desc" id="desc-neg"></div>
          </div>
          <span class="emoji-arrow">›</span>
        </button>
      </div>
    </div>

    <div class="screen" id="screen-positif">
      <div class="result-center">
        <span class="result-emoji">🌟</span>
        <div class="result-title" id="pos-title"></div>
        <div class="result-body" id="pos-body"></div>
        <a href="#" id="google-link" class="google-btn" target="_blank" onclick="marquerAvisLaisse()">
          <svg class="g-icon" viewBox="0 0 24 24" fill="white"><path d="M21.35 11.1H12.18V13.83H18.69C18.36 17.64 15.19 19.27 12.19 19.27C8.36 19.27 5 16.25 5 12C5 7.9 8.2 4.73 12.2 4.73C15.29 4.73 17.1 6.7 17.1 6.7L19 4.72C19 4.72 16.56 2 12.1 2C6.42 2 2.03 6.8 2.03 12C2.03 17.05 6.16 22 12.19 22C17.6 22 21.5 18.33 21.5 12.91C21.5 11.76 21.35 11.1 21.35 11.1Z"/></svg>
          <span id="google-btn-text"></span>
        </a>
        <div class="divider"><div class="divider-line"></div><div class="divider-text" id="or-text"></div><div class="divider-line"></div></div>
        <button class="skip-btn" id="skip-btn" onclick="showDone()"></button>
      </div>
    </div>

    <div class="screen" id="screen-negatif">
      <div class="result-center">
        <span class="result-emoji">🙏</span>
        <div class="result-title" id="neg-title"></div>
        <div class="result-body" id="neg-body"></div>
      </div>
    </div>

    <div class="screen" id="screen-done">
      <div class="result-center">
        <div class="done-circle">
          <svg class="done-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <div class="result-title" id="done-title"></div>
        <div class="result-body" id="done-body"></div>
      </div>
    </div>
  </div>

  <div class="footer">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
    Propulse par MediPulse
  </div>
</div>

<script>
var SB_URL = 'https://czttvnvcetgmjfqishig.supabase.co';
var SB_KEY = 'sb_publishable_mRTR9POOteWe_D2YgpucRQ_hMMxNP1m';

var token = null;
var lang = 'fr';
var lienGoogle = '';

var T = {
  fr: {
    question: 'Comment etait votre visite ?',
    sub: 'Votre avis aide le cabinet a progresser',
    pos: 'Tres satisfait', posDesc: 'Excellente experience',
    mid: 'Correct', midDesc: 'Experience moyenne',
    neg: 'Pas satisfait', negDesc: 'Experience a ameliorer',
    posTitle: 'Merci pour votre confiance !',
    posBody: 'Votre retour positif compte enormement. Pourriez-vous le partager sur Google ? Cela aide d\'autres patients a trouver le bon medecin.',
    googleBtn: 'Laisser un avis Google',
    or: 'ou',
    skip: 'Non merci, continuer sans laisser d\'avis',
    negTitle: 'Merci pour votre honnetete',
    negBody: 'Nous prenons votre retour tres au serieux. Le cabinet sera informe pour ameliorer votre prochaine experience.',
    doneTitle: 'Merci !',
    doneBody: 'Votre avis a bien ete enregistre. Bonne journee !'
  },
  ar: {
    question: 'كيف كانت زيارتكم ؟',
    sub: 'رأيكم يساعد العيادة على التطور',
    pos: 'راضٍ جداً', posDesc: 'تجربة ممتازة',
    mid: 'مقبول', midDesc: 'تجربة متوسطة',
    neg: 'غير راضٍ', negDesc: 'تجربة تحتاج تحسين',
    posTitle: 'شكراً على ثقتكم !',
    posBody: 'رأيكم الايجابي يعني لنا الكثير. هل يمكنكم مشاركته على Google ؟ سيساعد المرضى الاخرين في اختيار الطبيب المناسب.',
    googleBtn: 'ترك تقييم على Google',
    or: 'او',
    skip: 'لا شكراً، المتابعة بدون تقييم',
    negTitle: 'شكراً على صراحتكم',
    negBody: 'نأخذ ملاحظاتكم بجدية تامة. سيتم ابلاغ العيادة لتحسين تجربتكم القادمة.',
    doneTitle: 'شكراً !',
    doneBody: 'تم تسجيل رأيكم بنجاح. نتمنى لكم يوماً سعيداً !'
  }
};

function show(id) {
  document.querySelectorAll('.screen').forEach(function(s) { s.classList.remove('active'); });
  var el = document.getElementById(id);
  if (el) el.classList.add('active');
}

function setText(id, val) {
  var el = document.getElementById(id);
  if (el) el.textContent = val;
}

async function init() {
  var params = new URLSearchParams(window.location.search);
  token = params.get('token');
  lang = params.get('lang') || 'fr';
  var t = T[lang] || T.fr;

  if (lang === 'ar') {
    document.body.setAttribute('dir', 'rtl');
    document.documentElement.lang = 'ar';
  }

  if (!token) {
    setText('done-title', t.doneTitle);
    setText('done-body', 'Lien invalide.');
    show('screen-done');
    return;
  }

  try {
    var r = await fetch(SB_URL + '/rest/v1/envois_whatsapp?feedback_token=eq.' + token + '&select=*', {
      headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY }
    });
    var data = await r.json();

    if (!data || !data.length) {
      setText('done-title', t.doneTitle);
      setText('done-body', t.doneBody);
      show('screen-done');
      return;
    }

    var envoi = data[0];

    if (envoi.feedback_completed) {
      setText('done-title', t.doneTitle);
      setText('done-body', t.doneBody);
      show('screen-done');
      return;
    }

    if (envoi.cabinet_id) {
      var cr = await fetch(SB_URL + '/rest/v1/cabinets?id=eq.' + envoi.cabinet_id + '&select=*', {
        headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY }
      });
      var cab = await cr.json();
      if (cab && cab.length) {
        var c = cab[0];
        lienGoogle = c.lien_google || c.google_url || '';
        setText('cab-name', c.nom_cabinet || '');
        setText('cab-spec', (c.specialite || '') + (c.ville ? ' - ' + c.ville : ''));
        document.getElementById('cab-badge').style.display = 'flex';
      }
    }

    setText('q-title', t.question);
    setText('q-sub', t.sub);
    setText('lbl-pos', t.pos); setText('desc-pos', t.posDesc);
    setText('lbl-mid', t.mid); setText('desc-mid', t.midDesc);
    setText('lbl-neg', t.neg); setText('desc-neg', t.negDesc);
    show('screen-question');

  } catch(e) {
    console.error(e);
    setText('done-title', t.doneTitle);
    setText('done-body', t.doneBody);
    show('screen-done');
  }
}

async function patch(body) {
  try {
    await fetch(SB_URL + '/rest/v1/envois_whatsapp?feedback_token=eq.' + token, {
      method: 'PATCH',
      headers: {
        'apikey': SB_KEY,
        'Authorization': 'Bearer ' + SB_KEY,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify(body)
    });
  } catch(e) { console.error(e); }
}

async function repondre(sentiment) {
  var t = T[lang] || T.fr;
  var statut = sentiment === 'positif' ? 'positif' : 'negatif';
  await patch({ statut: statut, sentiment: sentiment, feedback_completed: true });

  if (sentiment === 'positif') {
    setText('pos-title', t.posTitle);
    setText('pos-body', t.posBody);
    setText('google-btn-text', t.googleBtn);
    setText('or-text', t.or);
    setText('skip-btn', t.skip);
    var gl = document.getElementById('google-link');
    if (lienGoogle && gl) {
      gl.href = lienGoogle;
      gl.style.display = 'flex';
      document.getElementById('or-text').parentElement.style.display = 'flex';
      document.getElementById('skip-btn').style.display = 'block';
    } else if (gl) {
      gl.style.display = 'none';
      document.getElementById('or-text').parentElement.style.display = 'none';
      document.getElementById('skip-btn').style.display = 'none';
    }
    show('screen-positif');
  } else {
    setText('neg-title', t.negTitle);
    setText('neg-body', t.negBody);
    show('screen-negatif');
  }
}

async function marquerAvisLaisse() {
  await patch({ statut: 'avis_laisse' });
}

function showDone() {
  var t = T[lang] || T.fr;
  setText('done-title', t.doneTitle);
  setText('done-body', t.doneBody);
  show('screen-done');
}

init();
</script>
</body>
</html>
