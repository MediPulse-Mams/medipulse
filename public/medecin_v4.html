<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediPulse — Mon Cabinet</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://unpkg.com/@tabler/icons-webfont@3.11.0/dist/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/shared.css">
<style>
body{background:#F5F7FF;color:#111827;font-family:'Plus Jakarta Sans',sans-serif}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px}
.kpi-card{background:#fff;border-radius:14px;border:1px solid #F3F4F6;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,0.05)}
.card{background:#fff;border-radius:14px;border:1px solid #F3F4F6;padding:18px;box-shadow:0 1px 4px rgba(0,0,0,0.05);margin-bottom:16px}
.charts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-bottom:16px}
.page-header{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:20px}
.page-title{font-size:20px;font-weight:700;color:#0F172A}
.page-bar{width:36px;height:3px;background:#2563EB;border-radius:2px;margin-top:5px}
.btn-google{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:9px;background:#2563EB;color:#fff;font-size:12px;font-weight:600;text-decoration:none}
.table-scroll{overflow-x:auto}
.avis-table{width:100%;border-collapse:collapse;min-width:400px}
.avis-table th{text-align:left;font-size:10px;font-weight:600;color:#9CA3AF;text-transform:uppercase;letter-spacing:0.05em;padding:0 8px 10px 0}
.avis-table td{padding:12px 8px 12px 0;border-top:1px solid #F9FAFB;font-size:12px;vertical-align:middle}
.avis-avatar{width:32px;height:32px;border-radius:50%;background:#EFF6FF;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#2563EB;flex-shrink:0}
/* Mobile cards */
.avis-card-mobile{background:#F9FAFB;border-radius:10px;padding:12px;margin-bottom:8px;border:1px solid #F3F4F6}
@media(max-width:768px){
  .kpi-grid{grid-template-columns:1fr 1fr}
  .table-desktop-wrap{display:none!important}
  .avis-mobile{display:block!important}
  .charts-grid{grid-template-columns:1fr}
}
@media(min-width:769px){
  .avis-mobile{display:none}
  .table-desktop-wrap{display:block}
}
</style>
</head>
<body>
<div class="layout">
  <div class="sidebar-overlay" id="mob-overlay" onclick="closeSidebar()"></div>
  <div class="sidebar sidebar-light" id="sidebar">
    <div class="sidebar-logo">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:5px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        <div style="font-size:18px;font-weight:800;letter-spacing:-0.5px;color:#1E3A5F">Medi<span style="color:#2563EB">Pulse</span></div>
      </div>
      <div style="font-size:10px;color:#94A3B8;padding-left:30px;font-style:italic">La réputation médicale, automatisée.</div>
    </div>
    <div class="sidebar-user">
      <div class="sidebar-avatar" id="sb-avatar" style="background:#EFF6FF;color:#2563EB"></div>
      <div>
        <div class="sidebar-username" id="sb-name"></div>
        <div class="sidebar-role" style="font-size:11px">Médecin</div>
      </div>
    </div>
    <div class="sidebar-nav">
      <div class="nav-section">Mon cabinet</div>
      <div class="nav-link active" id="nav-dashboard" onclick="showPage('dashboard')"><i class="ti ti-chart-bar"></i>Dashboard</div>
      <div class="nav-link" id="nav-avis" onclick="showPage('avis')"><i class="ti ti-messages"></i>Avis patients</div>
      <div class="nav-link" id="nav-stats" onclick="showPage('stats')"><i class="ti ti-trending-up"></i>Statistiques</div>
    </div>
    <div class="sidebar-footer">
      <button class="logout-btn logout-btn-blue" onclick="doLogout()">
        <i class="ti ti-logout" style="font-size:15px"></i> Déconnexion
      </button>
    </div>
  </div>

  <div class="main">
    <div class="topbar topbar-light">
      <div style="display:flex;align-items:center;gap:10px">
        <button class="mobile-menu-btn" onclick="toggleSidebar()" style="color:#0F172A"><i class="ti ti-menu-2"></i></button>
        <div style="font-size:15px;font-weight:700;color:#0F172A" id="page-title">Dashboard</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <span style="padding:3px 12px;border-radius:99px;font-size:11px;font-weight:600;background:rgba(16,185,129,0.12);color:#10B981;border:1px solid rgba(16,185,129,0.2)">Médecin</span>
        <span style="font-size:11px;color:#94A3B8" id="topbar-date"></span>
      </div>
    </div>
    <div class="content content-light" id="main-content">
      <div style="text-align:center;padding:60px;color:#94A3B8">Chargement...</div>
    </div>
  </div>
</div>

<div id="toast"></div>
<script src="/js/supabase.js"></script>
<script>
let currentUser=null, userRecord=null, cabinetData=null;

(async()=>{
  const auth=await requireAuth('medecin');
  if(!auth)return;
  currentUser=auth.session.user;
  userRecord=auth.user;
  document.getElementById('sb-avatar').textContent=(userRecord.nom||currentUser.email).substring(0,2).toUpperCase();
  document.getElementById('sb-name').textContent=userRecord.nom||currentUser.email.split('@')[0];
  document.getElementById('topbar-date').textContent=new Date().toLocaleDateString('fr-FR',{day:'numeric',month:'long'});

  // Charger cabinet via email_medecin
  const{data:cab}=await sb.from('cabinets').select('*').eq('email_medecin',currentUser.email).single();
  cabinetData=cab;
  showPage('dashboard');
})();

function showPage(page){
  closeSidebar();
  document.querySelectorAll('.nav-link').forEach(l=>l.classList.remove('active'));
  const el=document.getElementById('nav-'+page);
  if(el)el.classList.add('active');
  document.getElementById('page-title').textContent={dashboard:'Mon Cabinet',avis:'Avis Patients',stats:'Statistiques'}[page]||'Dashboard';
  if(page==='dashboard') renderDashboard();
  else if(page==='avis') renderAvis();
  else if(page==='stats') renderStats();
}

function toggleSidebar(){
  var sb=document.getElementById('sidebar');
  var ov=document.getElementById('mob-overlay');
  sb.classList.toggle('open');
  if(ov)ov.classList.toggle('active',sb.classList.contains('open'));
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  var ov=document.getElementById('mob-overlay');
  if(ov)ov.classList.remove('active');
}

// ── DONNÉES RÉELLES ──
function getNote(){ return parseFloat(cabinetData?.note_google)||0; }
function getNbAvis(){ return parseInt(cabinetData?.nb_avis_depart)||0; }
function getNomCabinet(){ return cabinetData?.nom_cabinet||'Mon Cabinet'; }
function getLienGoogle(){ return cabinetData?.lien_google||cabinetData?.google_url||'#'; }

function getStarsHtml(note){
  const n=parseFloat(note)||0;
  const full=Math.floor(n);
  const half=n%1>=0.5?'½':'';
  return '⭐'.repeat(full)+(half?'✨':'');
}

function getStatutBadge(statut){
  if(statut==='avis_laisse') return '<span style="padding:3px 9px;border-radius:99px;font-size:10px;font-weight:600;background:#EFF6FF;color:#2563EB">⭐ Avis laissé</span>';
  if(statut==='positif') return '<span style="padding:3px 9px;border-radius:99px;font-size:10px;font-weight:600;background:#F0FDF4;color:#15803D">⭐ Positif</span>';
  if(statut==='negatif') return '<span style="padding:3px 9px;border-radius:99px;font-size:10px;font-weight:600;background:#FFF1F2;color:#BE123C">⚠ Négatif</span>';
  return '<span style="padding:3px 9px;border-radius:99px;font-size:10px;font-weight:600;background:#FFF7ED;color:#EA580C">En attente</span>';
}

// ── DASHBOARD ──
async function renderDashboard(){
  const note=getNote();
  const nbAvis=getNbAvis();
  const noteStr=note>0?note.toFixed(1):'—';
  const lienGoogle=getLienGoogle();
  const nomCabinet=getNomCabinet();

  // Charger envois réels
  const today=new Date().toISOString().split('T')[0];
  const{data:envoisJour}=await sb.from('envois_whatsapp')
    .select('*')
    .eq('cabinet_id',cabinetData?.id||'')
    .gte('created_at',today+'T00:00:00')
    .order('created_at',{ascending:false});

  const{data:envoisAll}=await sb.from('envois_whatsapp')
    .select('*')
    .eq('cabinet_id',cabinetData?.id||'')
    .in('statut',['positif','avis_laisse','negatif'])
    .order('created_at',{ascending:false})
    .limit(5);

  const nbEnvoisJour=(envoisJour||[]).length;
  const avisReels=envoisAll||[];

  document.getElementById('main-content').innerHTML=`
    <div class="page-header">
      <div><div class="page-title">Tableau de bord</div><div class="page-bar"></div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <a href="${lienGoogle}" target="_blank" class="btn-google">
          <i class="ti ti-search" style="font-size:13px"></i> Ma fiche Google
        </a>
      </div>
    </div>

    <div class="kpi-grid">
      <div class="kpi-card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
          <span style="font-size:12px;color:#6B7280;font-weight:500">Avis collectés</span>
          <div style="width:32px;height:32px;border-radius:9px;background:#EFF6FF;display:flex;align-items:center;justify-content:center">
            <i class="ti ti-message" style="font-size:15px;color:#2563EB"></i>
          </div>
        </div>
        <div style="font-size:28px;font-weight:700;color:#111827;line-height:1">${nbAvis}</div>
        <div style="font-size:11px;color:#6B7280;margin-top:4px">Depuis le début</div>
      </div>
      <div class="kpi-card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
          <span style="font-size:12px;color:#6B7280;font-weight:500">Note Google</span>
          <div style="width:32px;height:32px;border-radius:9px;background:#FFF7ED;display:flex;align-items:center;justify-content:center">
            <i class="ti ti-star" style="font-size:15px;color:#F59E0B"></i>
          </div>
        </div>
        <div style="display:flex;align-items:baseline;gap:5px">
          <div style="font-size:28px;font-weight:700;color:#111827;line-height:1">${noteStr}</div>
          ${note>0?`<span style="color:#F59E0B;font-size:13px">${getStarsHtml(note)}</span>`:''}
        </div>
        <div style="font-size:11px;color:#6B7280;margin-top:4px">sur 5.0</div>
      </div>
      <div class="kpi-card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
          <span style="font-size:12px;color:#6B7280;font-weight:500">Envois aujourd'hui</span>
          <div style="width:32px;height:32px;border-radius:9px;background:#F0FDF4;display:flex;align-items:center;justify-content:center">
            <i class="ti ti-send" style="font-size:15px;color:#10B981"></i>
          </div>
        </div>
        <div style="font-size:28px;font-weight:700;color:#111827;line-height:1">${nbEnvoisJour}</div>
        <div style="font-size:11px;color:#6B7280;margin-top:4px">Formulaires envoyés</div>
      </div>
      <div class="kpi-card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
          <span style="font-size:12px;color:#6B7280;font-weight:500">Score</span>
          <div style="width:32px;height:32px;border-radius:9px;background:#F0FDF4;display:flex;align-items:center;justify-content:center">
            <i class="ti ti-target" style="font-size:15px;color:#10B981"></i>
          </div>
        </div>
        <div style="font-size:28px;font-weight:700;color:${note>=4?'#10B981':note>=3?'#F59E0B':'#EF4444'};line-height:1">${note>0?Math.round((note/5)*100)+'%':'—'}</div>
        <div style="font-size:11px;color:${note>=4?'#10B981':note>=3?'#F59E0B':'#BE123C'};margin-top:4px;font-weight:600">${note>=4?'Excellent':note>=3?'À améliorer':'Critique'}</div>
      </div>
    </div>

    <div class="charts-grid">
      <div class="card">
        <div style="font-size:14px;font-weight:700;color:#111827;margin-bottom:14px">Informations cabinet</div>
        ${cabinetData?`
          <div style="display:flex;flex-direction:column;gap:10px">
            <div style="display:flex;align-items:center;gap:8px">
              <div style="width:28px;height:28px;border-radius:7px;background:#EFF6FF;display:flex;align-items:center;justify-content:center;flex-shrink:0">
                <i class="ti ti-building-hospital" style="font-size:14px;color:#2563EB"></i>
              </div>
              <div>
                <div style="font-size:12px;font-weight:600;color:#111827">${cabinetData.nom_cabinet||'—'}</div>
                <div style="font-size:10px;color:#9CA3AF">${cabinetData.specialite||''} · ${cabinetData.ville||''}</div>
              </div>
            </div>
            <div style="display:flex;align-items:center;gap:8px">
              <div style="width:28px;height:28px;border-radius:7px;background:#F0FDF4;display:flex;align-items:center;justify-content:center;flex-shrink:0">
                <i class="ti ti-star" style="font-size:14px;color:#10B981"></i>
              </div>
              <div>
                <div style="font-size:12px;font-weight:600;color:#111827">Note de départ : ${cabinetData.note_google||'—'}/5</div>
                <div style="font-size:10px;color:#9CA3AF">${cabinetData.nb_avis_depart||0} avis Google</div>
              </div>
            </div>
            <div style="display:flex;align-items:center;gap:8px">
              <div style="width:28px;height:28px;border-radius:7px;background:#FFF7ED;display:flex;align-items:center;justify-content:center;flex-shrink:0">
                <i class="ti ti-crown" style="font-size:14px;color:#F59E0B"></i>
              </div>
              <div>
                <div style="font-size:12px;font-weight:600;color:#111827">Plan ${cabinetData.plan||'pro'}</div>
                <div style="font-size:10px;color:#9CA3AF">Statut : ${cabinetData.statut||'actif'}</div>
              </div>
            </div>
          </div>
        `:'<div style="text-align:center;padding:20px;color:#9CA3AF">Aucun cabinet configuré</div>'}
      </div>

      <div class="card">
        <div style="font-size:14px;font-weight:700;color:#111827;margin-bottom:14px">Derniers retours patients</div>
        ${avisReels.length?`
          <div style="display:flex;flex-direction:column;gap:10px">
            ${avisReels.map(e=>`
              <div style="display:flex;align-items:center;justify-content:space-between;padding:10px;background:#F9FAFB;border-radius:10px;border:1px solid #F3F4F6">
                <div>
                  <div style="font-size:13px;font-weight:600;color:#111827">${e.nom_patient||'Patient'}</div>
                  <div style="font-size:11px;color:#9CA3AF">${new Date(e.created_at).toLocaleDateString('fr-FR')}</div>
                </div>
                ${getStatutBadge(e.statut)}
              </div>
            `).join('')}
          </div>
        `:`<div style="text-align:center;padding:20px;color:#9CA3AF;font-size:13px">Aucun retour patient pour l'instant</div>`}
      </div>
    </div>
  `;
}

// ── AVIS PAGE ──
async function renderAvis(){
  const{data:envois}=await sb.from('envois_whatsapp')
    .select('*')
    .eq('cabinet_id',cabinetData?.id||'')
    .order('created_at',{ascending:false})
    .limit(50);

  const liste=envois||[];

  document.getElementById('main-content').innerHTML=`
    <div class="page-header">
      <div><div class="page-title">Avis Patients</div><div class="page-bar"></div></div>
      <button onclick="renderAvis()" style="background:none;border:none;cursor:pointer;font-size:13px;color:#2563EB;font-weight:600;font-family:'Plus Jakarta Sans',sans-serif">↻ Actualiser</button>
    </div>
    <div class="card">
      ${liste.length?`
        <div class="table-desktop-wrap">
          <table class="avis-table">
            <thead><tr>
              <th>Patient</th><th>Date</th><th>Langue</th><th>Statut</th>
            </tr></thead>
            <tbody>${liste.map(e=>`
              <tr>
                <td><div style="display:flex;align-items:center;gap:8px">
                  <div class="avis-avatar">${(e.nom_patient||'P').substring(0,2).toUpperCase()}</div>
                  <span style="font-weight:600;color:#111827">${e.nom_patient||'—'}</span>
                </div></td>
                <td style="color:#6B7280">${new Date(e.created_at).toLocaleDateString('fr-FR')}</td>
                <td><span style="padding:3px 9px;border-radius:99px;font-size:10px;font-weight:600;background:#EFF6FF;color:#2563EB">${e.langue==='ar'?'Arabe':'Français'}</span></td>
                <td>${getStatutBadge(e.statut)}</td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>
        <div class="avis-mobile">
          ${liste.map(e=>`
            <div class="avis-card-mobile">
              <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
                <div style="display:flex;align-items:center;gap:8px">
                  <div class="avis-avatar">${(e.nom_patient||'P').substring(0,2).toUpperCase()}</div>
                  <div>
                    <div style="font-size:13px;font-weight:600;color:#111827">${e.nom_patient||'—'}</div>
                    <div style="font-size:10px;color:#9CA3AF">${new Date(e.created_at).toLocaleDateString('fr-FR')}</div>
                  </div>
                </div>
                ${getStatutBadge(e.statut)}
              </div>
            </div>`).join('')}
        </div>
      `:`<div style="text-align:center;padding:48px;color:#9CA3AF">
          <i class="ti ti-inbox" style="font-size:40px;display:block;margin-bottom:12px;color:#E5E7EB"></i>
          Aucun patient enregistré
        </div>`}
    </div>
  `;
}

// ── STATS PAGE ──
async function renderStats(){
  const{data:envois}=await sb.from('envois_whatsapp')
    .select('*')
    .eq('cabinet_id',cabinetData?.id||'');

  const tous=envois||[];
  const positifs=tous.filter(e=>e.statut==='positif'||e.statut==='avis_laisse').length;
  const negatifs=tous.filter(e=>e.statut==='negatif').length;
  const enAttente=tous.filter(e=>e.statut==='envoye').length;
  const avisLaisses=tous.filter(e=>e.statut==='avis_laisse').length;
  const tauxConversion=tous.length>0?Math.round((avisLaisses/tous.length)*100):0;
  const note=getNote();

  document.getElementById('main-content').innerHTML=`
    <div class="page-header">
      <div><div class="page-title">Statistiques</div><div class="page-bar"></div></div>
    </div>
    <div class="kpi-grid" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr))">
      ${[
        {val:tous.length,lbl:'Total envois',color:'#2563EB',bg:'#EFF6FF',icon:'ti-send'},
        {val:positifs,lbl:'Réponses positives',color:'#10B981',bg:'#F0FDF4',icon:'ti-thumb-up'},
        {val:avisLaisses,lbl:'Avis Google laissés',color:'#2563EB',bg:'#EFF6FF',icon:'ti-star'},
        {val:negatifs,lbl:'Retours négatifs',color:'#EF4444',bg:'#FFF1F2',icon:'ti-thumb-down'},
        {val:tauxConversion+'%',lbl:'Taux conversion',color:'#F59E0B',bg:'#FFF7ED',icon:'ti-chart-pie'},
        {val:note>0?note.toFixed(1):'—',lbl:'Note Google',color:'#F59E0B',bg:'#FFF7ED',icon:'ti-star-filled'},
      ].map(k=>`
        <div class="kpi-card">
          <div style="width:32px;height:32px;border-radius:9px;background:${k.bg};display:flex;align-items:center;justify-content:center;margin-bottom:10px">
            <i class="ti ${k.icon}" style="font-size:15px;color:${k.color}"></i>
          </div>
          <div style="font-size:24px;font-weight:700;color:${k.color};line-height:1">${k.val}</div>
          <div style="font-size:11px;color:#6B7280;margin-top:5px">${k.lbl}</div>
        </div>`).join('')}
    </div>
  `;
}
</script>
</body>
</html>
