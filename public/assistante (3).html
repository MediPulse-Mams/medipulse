<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediPulse - Espace Assistante</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://unpkg.com/@tabler/icons-webfont@3.11.0/dist/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/shared.css">
<style>
body{background:#F5F7FF;color:#111827;font-family:'Plus Jakarta Sans',sans-serif}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px}
.kpi-mini{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{background:#fff;border-radius:14px;border:1px solid #F3F4F6;padding:18px;box-shadow:0 1px 4px rgba(0,0,0,0.05)}
.hist-table{width:100%;border-collapse:collapse;min-width:500px}
.hist-table th{text-align:left;font-size:10px;font-weight:600;color:#9CA3AF;text-transform:uppercase;letter-spacing:0.05em;padding:0 8px 10px 0;white-space:nowrap}
.hist-table td{padding:11px 8px 11px 0;border-top:1px solid #F9FAFB;font-size:12px;vertical-align:middle}
.btn-wa{display:inline-flex;align-items:center;gap:5px;padding:6px 14px;border-radius:10px;border:none;background:#25D366;color:#fff;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:'Plus Jakarta Sans',sans-serif;transition:all 0.15s}
.btn-wa:hover{background:#20B858}
.btn-wa:active{transform:scale(0.97)}
.relance-card{background:#FFFBEB;border:1.5px solid #FDE68A;border-radius:16px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
.relance-btn{padding:8px 16px;border-radius:10px;background:#0A1628;color:#fff;font-size:12px;font-weight:700;border:none;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;text-decoration:none;transition:all 0.15s;flex-shrink:0}
.relance-btn:active{transform:scale(0.97)}
.notif-badge{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:#EF4444;color:#fff;font-size:10px;font-weight:700;margin-left:6px;flex-shrink:0}
@media(max-width:768px){
  .form-grid{grid-template-columns:1fr;gap:14px}
  .kpi-mini{grid-template-columns:1fr 1fr;gap:10px}
  .card{padding:14px}
  input,select,textarea{width:100%!important;font-size:16px!important}
  .table-desktop-wrap{display:none!important}
  .cards-mobile{display:flex!important;flex-direction:column;gap:10px}
}
@media(min-width:769px){
  .cards-mobile{display:none}
  .table-desktop-wrap{display:block;overflow-x:auto}
}
</style>
</head>
<body>
<div class="layout">
  <div class="sidebar-overlay" id="mob-overlay" onclick="closeSidebar()"></div>
  <div class="sidebar sidebar-light" id="sidebar">
    <div class="sidebar-logo">
      <div style="display:flex;align-items:center;gap:9px;margin-bottom:6px">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        <div style="font-size:19px;font-weight:800;letter-spacing:-0.5px;color:#1E3A5F">Medi<span style="color:#2563EB">Pulse</span></div>
      </div>
      <div style="font-size:10px;color:#94A3B8;padding-left:33px;font-style:italic">La reputation medicale, automatisee.</div>
    </div>
    <div class="sidebar-user">
      <div class="sidebar-avatar" id="sb-avatar" style="background:#F3E8FF;color:#8B5CF6"></div>
      <div>
        <div class="sidebar-username" id="sb-name"></div>
        <div class="sidebar-role" style="font-size:11px">Assistante</div>
      </div>
    </div>
    <div class="sidebar-nav">
      <div class="nav-section">Outils</div>
      <div class="nav-link active" id="nav-accueil" onclick="showPage('accueil')"><i class="ti ti-home"></i>Accueil</div>
      <div class="nav-link" id="nav-relances" onclick="showPage('relances')" style="display:flex;align-items:center;justify-content:space-between">
        <span style="display:flex;align-items:center;gap:8px"><i class="ti ti-bell"></i>A relancer</span>
        <span class="notif-badge" id="relance-badge" style="display:none">0</span>
      </div>
      <div class="nav-link" id="nav-historique" onclick="showPage('historique')"><i class="ti ti-history"></i>Historique</div>
    </div>
    <div class="sidebar-footer">
      <button class="logout-btn logout-btn-blue" onclick="doLogout()">
        <i class="ti ti-logout" style="font-size:16px"></i> Deconnexion
      </button>
    </div>
  </div>

  <div class="main">
    <div class="topbar topbar-light">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="mobile-menu-btn" onclick="toggleSidebar()" style="color:#0F172A"><i class="ti ti-menu-2"></i></button>
        <div style="font-size:16px;font-weight:700;color:#0F172A" id="page-title">Espace Assistante</div>
      </div>
      <div style="display:flex;align-items:center;gap:12px">
        <span style="padding:4px 14px;border-radius:99px;font-size:11px;font-weight:600;background:rgba(139,92,246,0.15);color:#8B5CF6;border:1px solid rgba(139,92,246,0.25)">Assistante</span>
        <span style="font-size:13px;color:#64748B" id="topbar-date"></span>
      </div>
    </div>
    <div class="content content-light" id="main-content">
      <div style="text-align:center;padding:60px;color:#94A3B8">Chargement...</div>
    </div>
  </div>
</div>

<div id="toast"></div>
<script src="/js/supabase.js"></script>
<script>
var currentUser = null, userRecord = null, cabinetData = null;

(async function() {
  var auth = await requireAuth('assistante');
  if (!auth) return;
  currentUser = auth.session.user;
  userRecord = auth.user;
  document.getElementById('sb-avatar').textContent = (userRecord.nom || currentUser.email).substring(0, 2).toUpperCase();
  document.getElementById('sb-name').textContent = userRecord.nom || currentUser.email.split('@')[0];
  document.getElementById('topbar-date').textContent = new Date().toLocaleDateString('fr-FR', {day:'numeric', month:'long'});
  var res = await sb.from('cabinets').select('*').eq('email_assistante', currentUser.email).single();
  cabinetData = res.data;
  await checkRelances();
  showPage('accueil');
})();

async function checkRelances() {
  var deuxJoursAvant = new Date(Date.now() - 2 * 24 * 60 * 60 * 1000).toISOString();
  var res = await sb.from('envois_whatsapp')
    .select('id')
    .eq('assistante_email', currentUser.email)
    .eq('statut', 'envoye')
    .lt('created_at', deuxJoursAvant);
  var count = (res.data || []).length;
  var badge = document.getElementById('relance-badge');
  if (badge) {
    if (count > 0) {
      badge.textContent = count;
      badge.style.display = 'inline-flex';
    } else {
      badge.style.display = 'none';
    }
  }
  return count;
}

function showPage(page) {
  closeSidebar();
  document.querySelectorAll('.nav-link').forEach(function(l) { l.classList.remove('active'); });
  var el = document.getElementById('nav-' + page);
  if (el) el.classList.add('active');
  var titles = {accueil:'Espace Assistante', relances:'A relancer', historique:'Historique des envois'};
  document.getElementById('page-title').textContent = titles[page] || 'Espace Assistante';
  if (page === 'accueil') renderAccueil();
  else if (page === 'relances') renderRelances();
  else renderHistorique();
}

function toggleSidebar() {
  var sb = document.getElementById('sidebar');
  var ov = document.getElementById('mob-overlay');
  sb.classList.toggle('open');
  if (ov) ov.classList.toggle('active', sb.classList.contains('open'));
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  var ov = document.getElementById('mob-overlay');
  if (ov) ov.classList.remove('active');
}

async function renderAccueil() {
  var today = new Date().toISOString().split('T')[0];
  var res = await sb.from('envois_whatsapp')
    .select('*')
    .eq('assistante_email', currentUser.email)
    .gte('created_at', today + 'T00:00:00')
    .order('created_at', {ascending: false});

  var envois = res.data || [];
  var total = envois.length;
  var positifs = envois.filter(function(e) { return e.statut === 'positif' || e.statut === 'avis_laisse'; }).length;
  var negatifs = envois.filter(function(e) { return e.statut === 'negatif'; }).length;
  var nomCabinet = cabinetData ? cabinetData.nom_cabinet : 'votre cabinet';
  var nbRelances = parseInt(document.getElementById('relance-badge')?.textContent || '0') || 0;

  document.getElementById('main-content').innerHTML =
    '<div style="margin-bottom:24px">' +
      '<div style="font-size:22px;font-weight:800;color:#0F172A;letter-spacing:-0.4px">Bonjour ' + (userRecord.nom || '').split(' ')[0] + ' !</div>' +
      '<div style="font-size:13px;color:#6B7280;margin-top:4px">' + new Date().toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'}) + '</div>' +
      (cabinetData ? '<div style="font-size:12px;color:#94A3B8;margin-top:2px">' + nomCabinet + '</div>' : '<div style="font-size:12px;color:#EA580C;margin-top:4px">Cabinet non configure</div>') +
    '</div>' +

    (nbRelances > 0 ?
      '<div onclick="showPage(\'relances\')" style="background:#FFFBEB;border:1.5px solid #FDE68A;border-radius:16px;padding:14px 18px;margin-bottom:20px;display:flex;align-items:center;gap:12px;cursor:pointer">' +
        '<div style="width:40px;height:40px;border-radius:12px;background:#FEF3C7;display:flex;align-items:center;justify-content:center;flex-shrink:0"><i class="ti ti-bell" style="font-size:18px;color:#F59E0B"></i></div>' +
        '<div style="flex:1">' +
          '<div style="font-size:14px;font-weight:700;color:#92400E">' + nbRelances + ' patient' + (nbRelances > 1 ? 's' : '') + ' a relancer</div>' +
          '<div style="font-size:12px;color:#B45309;margin-top:2px">Sans reponse depuis plus de 2 jours - Cliquez pour voir</div>' +
        '</div>' +
        '<i class="ti ti-chevron-right" style="color:#F59E0B;font-size:18px;flex-shrink:0"></i>' +
      '</div>' : ''
    ) +

    '<div class="form-grid">' +
      '<div class="card">' +
        '<div style="font-size:15px;font-weight:700;color:#111827;margin-bottom:5px">Envoyer un lien patient</div>' +
        '<div style="font-size:13px;color:#6B7280;margin-bottom:18px">Renseignez les informations du patient</div>' +
        '<div style="margin-bottom:14px">' +
          '<label style="font-size:11px;font-weight:600;color:#374151;text-transform:uppercase;letter-spacing:0.05em;display:block;margin-bottom:6px">Nom du patient</label>' +
          '<input id="ass-nom" type="text" placeholder="Prenom Nom" style="width:100%;padding:11px 14px;border-radius:10px;border:1px solid #E5E7EB;font-size:14px;color:#111827;font-family:inherit;outline:none;background:#F9FAFB;box-sizing:border-box">' +
        '</div>' +
        '<div style="margin-bottom:20px">' +
          '<label style="font-size:11px;font-weight:600;color:#374151;text-transform:uppercase;letter-spacing:0.05em;display:block;margin-bottom:6px">Telephone WhatsApp</label>' +
          '<input id="ass-tel" type="tel" placeholder="06 XX XX XX XX" style="width:100%;padding:11px 14px;border-radius:10px;border:1px solid #E5E7EB;font-size:14px;color:#111827;font-family:inherit;outline:none;background:#F9FAFB;box-sizing:border-box">' +
        '</div>' +
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">' +
          '<button onclick="envoyerFormulaire(\'ar\')" style="padding:14px;border-radius:12px;border:none;background:linear-gradient(135deg,#1E3A8A,#2563EB);color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit">Arabe</button>' +
          '<button onclick="envoyerFormulaire(\'fr\')" style="padding:14px;border-radius:12px;border:none;background:linear-gradient(135deg,#0369A1,#06B6D4);color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit">Francais</button>' +
        '</div>' +
      '</div>' +

      '<div class="kpi-mini">' +
        '<div class="card">' +
          '<div style="width:34px;height:34px;border-radius:10px;background:#EFF6FF;display:flex;align-items:center;justify-content:center;margin-bottom:12px"><i class="ti ti-send" style="font-size:16px;color:#2563EB"></i></div>' +
          '<div style="font-size:26px;font-weight:800;color:#111827;line-height:1">' + total + '</div>' +
          '<div style="font-size:12px;color:#6B7280;margin-top:5px">Envoyes aujourd\'hui</div>' +
        '</div>' +
        '<div class="card">' +
          '<div style="width:34px;height:34px;border-radius:10px;background:#F0FDF4;display:flex;align-items:center;justify-content:center;margin-bottom:12px"><i class="ti ti-message-check" style="font-size:16px;color:#10B981"></i></div>' +
          '<div style="font-size:26px;font-weight:800;color:#111827;line-height:1">' + envois.filter(function(e){return e.statut !== 'envoye';}).length + '</div>' +
          '<div style="font-size:12px;color:#6B7280;margin-top:5px">Reponses recues</div>' +
        '</div>' +
        '<div class="card">' +
          '<div style="width:34px;height:34px;border-radius:10px;background:#F0FDF4;display:flex;align-items:center;justify-content:center;margin-bottom:12px"><i class="ti ti-thumb-up" style="font-size:16px;color:#10B981"></i></div>' +
          '<div style="font-size:26px;font-weight:800;color:#10B981;line-height:1">' + positifs + '</div>' +
          '<div style="font-size:12px;color:#6B7280;margin-top:5px">Avis positifs</div>' +
        '</div>' +
        '<div class="card" style="cursor:pointer" onclick="showPage(\'relances\')">' +
          '<div style="width:34px;height:34px;border-radius:10px;background:' + (nbRelances > 0 ? '#FFF7ED' : '#F0FDF4') + ';display:flex;align-items:center;justify-content:center;margin-bottom:12px"><i class="ti ti-bell" style="font-size:16px;color:' + (nbRelances > 0 ? '#F59E0B' : '#10B981') + '"></i></div>' +
          '<div style="font-size:26px;font-weight:800;color:' + (nbRelances > 0 ? '#F59E0B' : '#10B981') + ';line-height:1">' + nbRelances + '</div>' +
          '<div style="font-size:12px;color:#6B7280;margin-top:5px">A relancer</div>' +
        '</div>' +
      '</div>' +
    '</div>' +

    '<div class="card">' +
      '<div style="font-size:15px;font-weight:700;color:#111827;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between">' +
        '<span><i class="ti ti-history" style="color:#6B7280;margin-right:6px"></i>Historique du jour</span>' +
        '<button onclick="renderAccueil()" style="background:none;border:none;cursor:pointer;font-size:12px;color:#2563EB;font-weight:600;font-family:inherit">Actualiser</button>' +
      '</div>' +
      (envois.length ? buildTable(envois) : '<div style="text-align:center;padding:40px;color:#9CA3AF"><i class="ti ti-phone" style="font-size:40px;display:block;margin-bottom:12px;color:#E5E7EB"></i><div style="font-size:14px">Aucun envoi aujourd\'hui</div></div>') +
    '</div>';
}

async function renderRelances() {
  var deuxJoursAvant = new Date(Date.now() - 2 * 24 * 60 * 60 * 1000).toISOString();
  var res = await sb.from('envois_whatsapp')
    .select('*')
    .eq('assistante_email', currentUser.email)
    .eq('statut', 'envoye')
    .lt('created_at', deuxJoursAvant)
    .order('created_at', {ascending: true});

  var liste = res.data || [];
  var nomCab = (cabinetData && cabinetData.nom_cabinet) || 'notre cabinet';

  function joursDepuis(dateStr) {
    return Math.floor((Date.now() - new Date(dateStr).getTime()) / (1000 * 60 * 60 * 24));
  }

  document.getElementById('main-content').innerHTML =
    '<div style="margin-bottom:24px">' +
      '<div style="font-size:22px;font-weight:800;color:#0F172A;letter-spacing:-0.4px">A relancer</div>' +
      '<div style="font-size:13px;color:#64748B;margin-top:4px">' + liste.length + ' patient' + (liste.length > 1 ? 's' : '') + ' sans reponse depuis plus de 2 jours</div>' +
    '</div>' +

    (liste.length ?
      liste.map(function(e) {
        var jours = joursDepuis(e.created_at);
        var tel = (e.tel_patient || '').replace(/\s/g, '').replace(/^0/, '212');
        var msgFR = 'Bonjour ' + (e.nom_patient || '') + ',\n\nNous esperons que votre visite au ' + nomCab + ' s\'est bien passee.\n\nPourriez-vous nous donner votre avis en 1 minute ?\n\n' + (e.form_url || '');
        var msgAR = '\u0645\u0631\u062d\u0628\u0627 ' + (e.nom_patient || '') + '\n\n\u0646\u062a\u0645\u0646\u0649 \u0623\u0646 \u062a\u0643\u0648\u0646 \u0632\u064a\u0627\u0631\u062a\u0643\u0645 \u0642\u062f \u0633\u0627\u0631\u062a \u0628\u0634\u0643\u0644 \u062c\u064a\u062f.\n\n\u0647\u0644 \u064a\u0645\u0643\u0646\u0643\u0645 \u0625\u0639\u0637\u0627\u0624\u0646\u0627 \u0631\u0623\u064a\u0643\u0645 ?\n\n' + (e.form_url || '');
        var msg = encodeURIComponent(e.langue === 'ar' ? msgAR : msgFR);
        var waUrl = 'https://wa.me/' + tel + '?text=' + msg;
        return '<div class="relance-card">' +
          '<div style="flex:1;min-width:0">' +
            '<div style="font-size:14px;font-weight:700;color:#0A1628">' + (e.nom_patient || 'Patient') + '</div>' +
            '<div style="font-size:12px;color:#6B7280;margin-top:2px">' + (e.tel_patient || '') + ' - ' + (e.langue === 'ar' ? 'Arabe' : 'Francais') + '</div>' +
            '<div style="font-size:11px;color:#B45309;margin-top:3px">Sans reponse depuis ' + jours + ' jour' + (jours > 1 ? 's' : '') + ' - ' + new Date(e.created_at).toLocaleDateString('fr-FR') + '</div>' +
          '</div>' +
          '<a href="' + waUrl + '" target="_blank" class="relance-btn" onclick="marquerRelance(\'' + e.id + '\')"><i class="ti ti-brand-whatsapp" style="font-size:14px"></i> Relancer</a>' +
        '</div>';
      }).join('') :
      '<div class="card" style="text-align:center;padding:48px">' +
        '<div style="width:56px;height:56px;border-radius:16px;background:#F0FDF4;display:flex;align-items:center;justify-content:center;margin:0 auto 16px"><i class="ti ti-check" style="font-size:24px;color:#10B981"></i></div>' +
        '<div style="font-size:16px;font-weight:700;color:#0A1628;margin-bottom:6px">Tout est a jour !</div>' +
        '<div style="font-size:13px;color:#64748B">Aucun patient en attente de relance.</div>' +
      '</div>'
    );

  await checkRelances();
}

async function marquerRelance(id) {
  await sb.from('envois_whatsapp').update({statut: 'relance'}).eq('id', id);
  setTimeout(async function() {
    await checkRelances();
    renderRelances();
  }, 1000);
}

function buildTable(envois) {
  var rows = envois.map(function(e) {
    var badge = getStatutBadge(e.statut);
    var action = '';
    if (e.statut === 'positif' || e.statut === 'avis_laisse') {
      action = '<button class="btn-wa" onclick="envoyerLienGoogle(\'' + (e.tel_patient||'') + '\',\'' + (e.nom_patient||'') + '\',\'' + (e.langue||'fr') + '\')">Lien Google</button>';
    }
    return '<tr>' +
      '<td style="font-weight:600;color:#111827">' + (e.nom_patient||'-') + '</td>' +
      '<td style="color:#6B7280">' + (e.tel_patient||'-') + '</td>' +
      '<td><span style="padding:3px 9px;border-radius:99px;font-size:10px;font-weight:600;background:#EFF6FF;color:#2563EB">' + (e.langue==='ar'?'Arabe':'Francais') + '</span></td>' +
      '<td style="color:#6B7280;font-size:11px">' + new Date(e.created_at).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}) + '</td>' +
      '<td>' + badge + '</td>' +
      '<td>' + action + '</td>' +
    '</tr>';
  }).join('');

  var cards = envois.map(function(e) {
    var badge = getStatutBadge(e.statut);
    var action = '';
    if ((e.statut === 'positif' || e.statut === 'avis_laisse') && e.tel_patient) {
      action = '<button class="btn-wa" onclick="envoyerLienGoogle(\'' + e.tel_patient + '\',\'' + (e.nom_patient||'') + '\',\'' + (e.langue||'fr') + '\')">Google</button>';
    }
    return '<div style="background:#F9FAFB;border-radius:12px;padding:14px;border:1px solid #F3F4F6">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">' +
        '<div style="font-size:14px;font-weight:700;color:#111827">' + (e.nom_patient||'-') + '</div>' +
        badge +
      '</div>' +
      '<div style="font-size:12px;color:#6B7280;margin-bottom:6px">' + (e.tel_patient||'-') + ' - ' + (e.langue==='ar'?'Arabe':'Francais') + '</div>' +
      '<div style="display:flex;align-items:center;justify-content:space-between">' +
        '<div style="font-size:11px;color:#9CA3AF">' + new Date(e.created_at).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}) + '</div>' +
        action +
      '</div>' +
    '</div>';
  }).join('');

  return '<div class="table-desktop-wrap"><table class="hist-table"><thead><tr><th>Patient</th><th>Telephone</th><th>Langue</th><th>Heure</th><th>Statut</th><th>Action</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
    '<div class="cards-mobile">' + cards + '</div>';
}

function getStatutBadge(statut) {
  if (statut === 'avis_laisse') return '<span style="padding:3px 9px;border-radius:99px;font-size:10px;font-weight:600;background:#EFF6FF;color:#2563EB">Avis laisse</span>';
  if (statut === 'positif') return '<span style="padding:3px 9px;border-radius:99px;font-size:10px;font-weight:600;background:#F0FDF4;color:#15803D">Positif</span>';
  if (statut === 'negatif') return '<span style="padding:3px 9px;border-radius:99px;font-size:10px;font-weight:600;background:#FFF1F2;color:#BE123C">Negatif</span>';
  if (statut === 'relance') return '<span style="padding:3px 9px;border-radius:99px;font-size:10px;font-weight:600;background:#FFFBEB;color:#B45309">Relance</span>';
  return '<span style="padding:3px 9px;border-radius:99px;font-size:10px;font-weight:600;background:#FFF7ED;color:#EA580C">En attente</span>';
}

function envoyerLienGoogle(tel, nom, langue) {
  var lienGoogle = cabinetData ? (cabinetData.lien_google || cabinetData.google_url || '') : '';
  var nomCabinet = cabinetData ? cabinetData.nom_cabinet : 'notre cabinet';
  if (!lienGoogle) { showToast('Lien Google non configure', 'error'); return; }
  var msgFR = 'Bonjour ' + nom + ' !\n\nMerci pour votre retour positif\n\nPourriez-vous partager votre experience sur Google ? Cela prend 30 secondes\n\n' + lienGoogle + '\n\nMerci !\nL equipe ' + nomCabinet;
  var msgAR = '\u0645\u0631\u062d\u0628\u0627 ' + nom + '\n\n\u0634\u0643\u0631\u0627 \u0639\u0644\u0649 \u062a\u0642\u064a\u064a\u0645\u0643 \u0627\u0644\u0627\u064a\u062c\u0627\u0628\u064a\n\n\u0647\u0644 \u064a\u0645\u0643\u0646\u0643 \u062a\u0631\u0643 \u062a\u0642\u064a\u064a\u0645 \u0639\u0644\u0649 Google\n\n' + lienGoogle;
  var msg = encodeURIComponent(langue === 'ar' ? msgAR : msgFR);
  var telF = tel.replace(/\s/g, '').replace(/^0/, '212');
  window.open('https://wa.me/' + telF + '?text=' + msg, '_blank');
  showToast('Lien Google envoye !', 'success');
}

async function envoyerFormulaire(lang) {
  var nom = document.getElementById('ass-nom') ? document.getElementById('ass-nom').value.trim() : '';
  var tel = document.getElementById('ass-tel') ? document.getElementById('ass-tel').value.trim() : '';
  if (!tel) { showToast('Entrez le numero WhatsApp', 'error'); return; }
  if (!cabinetData) { showToast('Cabinet non configure', 'error'); return; }

  var token = crypto.randomUUID();
  var patientUrl = 'https://medipulse-gamma.vercel.app/patient.html?token=' + token + '&lang=' + lang;
  var nomCabinet = cabinetData.nom_cabinet || 'notre cabinet';

  var msgFR = 'Bonjour ' + nom + '\n\nMerci pour votre visite au ' + nomCabinet + ' !\n\nPourriez-vous nous donner votre avis ? Cela prend 1 minute\n\n' + patientUrl + '\n\nMerci !';
  var msgAR = '\u0645\u0631\u062d\u0628\u0627 ' + nom + '\n\n\u0634\u0643\u0631\u0627 \u0639\u0644\u0649 \u0632\u064a\u0627\u0631\u062a\u0643\u0645\n\n\u0647\u0644 \u064a\u0645\u0643\u0646\u0643\u0645 \u062a\u0642\u064a\u064a\u0645 \u062a\u062c\u0631\u0628\u062a\u0643\u0645\n\n' + patientUrl;

  var msg = encodeURIComponent(lang === 'ar' ? msgAR : msgFR);
  var telF = tel.replace(/\s/g, '').replace(/^0/, '212');
  window.open('https://wa.me/' + telF + '?text=' + msg, '_blank');

  var res = await sb.from('envois_whatsapp').insert([{
    assistante_email: currentUser.email,
    cabinet_id: cabinetData.id,
    nom_patient: nom,
    tel_patient: tel,
    langue: lang,
    statut: 'envoye',
    form_url: patientUrl,
    feedback_token: token,
    feedback_completed: false
  }]);

  if (res.error) { showToast('Erreur sauvegarde', 'error'); return; }
  showToast('Lien patient ' + (lang === 'ar' ? 'Arabe' : 'Francais') + ' envoye !', 'success');
  document.getElementById('ass-nom').value = '';
  document.getElementById('ass-tel').value = '';
  setTimeout(function() { renderAccueil(); }, 800);
}

async function renderHistorique() {
  document.getElementById('main-content').innerHTML =
    '<div style="margin-bottom:20px;display:flex;align-items:center;justify-content:space-between">' +
      '<div><div style="font-size:22px;font-weight:800;color:#0F172A;letter-spacing:-0.4px">Historique des envois</div></div>' +
      '<button onclick="renderHistorique()" style="background:none;border:none;cursor:pointer;font-size:13px;color:#2563EB;font-weight:600;font-family:inherit">Actualiser</button>' +
    '</div>' +
    '<div class="card" id="hist-content"><div style="text-align:center;padding:40px;color:#94A3B8">Chargement...</div></div>';

  var res = await sb.from('envois_whatsapp')
    .select('*')
    .eq('assistante_email', currentUser.email)
    .order('created_at', {ascending: false})
    .limit(100);

  var liste = res.data || [];
  var panel = document.getElementById('hist-content');
  if (!panel) return;

  if (liste.length) {
    var rows = liste.map(function(e) {
      var badge = getStatutBadge(e.statut);
      var action = '';
      if ((e.statut === 'positif' || e.statut === 'avis_laisse') && e.tel_patient) {
        action = '<button class="btn-wa" onclick="envoyerLienGoogle(\'' + e.tel_patient + '\',\'' + (e.nom_patient||'') + '\',\'' + (e.langue||'fr') + '\')">Lien Google</button>';
      }
      return '<tr>' +
        '<td style="font-weight:600;color:#111827">' + (e.nom_patient||'-') + '</td>' +
        '<td style="color:#6B7280">' + (e.tel_patient||'-') + '</td>' +
        '<td><span style="padding:3px 9px;border-radius:99px;font-size:10px;font-weight:600;background:#EFF6FF;color:#2563EB">' + (e.langue==='ar'?'Arabe':'Francais') + '</span></td>' +
        '<td style="color:#6B7280;font-size:11px">' + new Date(e.created_at).toLocaleDateString('fr-FR') + '</td>' +
        '<td style="color:#6B7280;font-size:11px">' + new Date(e.created_at).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}) + '</td>' +
        '<td>' + badge + '</td>' +
        '<td>' + action + '</td>' +
      '</tr>';
    }).join('');
    panel.innerHTML = '<div class="table-desktop-wrap"><table class="hist-table"><thead><tr><th>Patient</th><th>Telephone</th><th>Langue</th><th>Date</th><th>Heure</th><th>Statut</th><th>Action</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '<div class="cards-mobile">' + liste.map(function(e) {
        return '<div style="background:#F9FAFB;border-radius:12px;padding:14px;border:1px solid #F3F4F6">' +
          '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">' +
            '<div style="font-size:13px;font-weight:700;color:#111827">' + (e.nom_patient||'-') + '</div>' +
            getStatutBadge(e.statut) +
          '</div>' +
          '<div style="font-size:11px;color:#9CA3AF">' + new Date(e.created_at).toLocaleDateString('fr-FR') + ' - ' + (e.langue==='ar'?'Arabe':'Francais') + '</div>' +
        '</div>';
      }).join('') + '</div>';
  } else {
    panel.innerHTML = '<div style="text-align:center;padding:48px;color:#9CA3AF"><i class="ti ti-inbox" style="font-size:40px;display:block;margin-bottom:12px;color:#E5E7EB"></i>Aucun envoi enregistre</div>';
  }
}
</script>
