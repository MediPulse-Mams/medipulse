<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediPulse — Dashboard Commercial</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://unpkg.com/@tabler/icons-webfont@3.11.0/dist/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/shared.css">
<style>
body{background:#F5F7FF;color:#111827;font-family:'Plus Jakarta Sans',sans-serif}
.topbar-title{font-family:'Plus Jakarta Sans',sans-serif;font-size:16px;font-weight:700;color:#0F172A}
/* Hero commercial */
.hero{background:linear-gradient(135deg,#0A2540 0%,#0D3B5E 60%,#083352 100%);border-radius:16px;padding:24px 28px;margin-bottom:20px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;width:300px;height:300px;border-radius:50%;border:1px solid rgba(56,189,248,0.08);bottom:-100px;right:-100px}
.hero::after{content:'';position:absolute;width:500px;height:500px;border-radius:50%;border:1px solid rgba(56,189,248,0.05);bottom:-200px;right:-200px}
/* KPI cards */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.kpi{background:#fff;border-radius:14px;border:1px solid #F3F4F6;padding:18px;box-shadow:0 1px 4px rgba(0,0,0,0.04)}
.kpi-label{font-size:10px;font-weight:700;color:#94A3B8;text-transform:uppercase;letter-spacing:0.07em;margin-bottom:8px}
.kpi-val{font-size:26px;font-weight:800;line-height:1;margin-bottom:4px;font-family:'Plus Jakarta Sans',sans-serif}
.kpi-sub{font-size:11px;color:#94A3B8}
/* Progress bar */
.prog-track{height:6px;background:rgba(255,255,255,0.1);border-radius:99px;overflow:hidden;margin-bottom:10px;position:relative}
.prog-fill{height:100%;background:linear-gradient(90deg,#38BDF8,#06B6D4);border-radius:99px;transition:width 1s ease}
/* Palier markers */
.palier-marker{position:absolute;top:50%;transform:translateY(-50%);width:2px;height:14px;background:rgba(255,255,255,0.25)}
/* Prospect cards */
.prospect-card{background:#fff;border-radius:12px;border:1px solid #F3F4F6;padding:14px 16px;margin-bottom:8px;display:flex;align-items:center;gap:12px;transition:border-color 0.15s}
.prospect-card:hover{border-color:#BFDBFE}
.p-action{width:32px;height:32px;border-radius:8px;border:1px solid #E5E7EB;background:#F9FAFB;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.15s;flex-shrink:0;font-size:15px;color:#64748B}
.p-action:hover{background:#EFF6FF;border-color:#2563EB;color:#2563EB}
.p-action.wa:hover{background:#F0FDF4;border-color:#16A34A;color:#16A34A}
/* Filter chips */
.chip{padding:6px 14px;border-radius:99px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid;transition:all 0.15s;font-family:'Plus Jakarta Sans',sans-serif}
.chip-on{background:#EFF6FF;color:#2563EB;border-color:#BFDBFE}
.chip-off{background:#fff;color:#64748B;border-color:#E5E7EB}
/* Simulateur */
input[type=range]{accent-color:#0D7490;width:100%}
/* Commissions */
.comm-card{border-radius:12px;padding:18px;text-align:center}
/* Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:16px;border:1px solid #E5E7EB;width:100%;max-width:500px;max-height:90vh;overflow-y:auto}
.modal-hd{padding:18px 22px 14px;border-bottom:1px solid #F3F4F6;display:flex;align-items:center;justify-content:space-between}
.modal-body{padding:18px 22px 22px}
.st-opt{padding:10px 12px;border-radius:10px;border:2px solid #E5E7EB;cursor:pointer;transition:all 0.15s;margin-bottom:8px}
.finput{width:100%;padding:11px 14px;border-radius:10px;border:1.5px solid #E5E7EB;font-size:14px;color:#0A2540;font-family:'Plus Jakarta Sans',sans-serif;outline:none;margin-bottom:12px;background:#F8FAFC;transition:border-color 0.2s}
.finput:focus{border-color:#0D7490;background:#fff}
.save-btn{width:100%;padding:13px;border-radius:11px;background:linear-gradient(135deg,#0A2540,#0D7490);color:#fff;font-size:14px;font-weight:700;border:none;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif}
#toast{position:fixed;bottom:24px;right:24px;z-index:300;opacity:0;pointer-events:none;transition:opacity 0.3s}
</style>
</head>
<body>
<div class="layout">

  <!-- SIDEBAR -->
  <div class="sidebar sidebar-light" id="sidebar">
    <div class="sidebar-logo">
      <div style="display:flex;align-items:center;gap:9px;margin-bottom:6px">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        <div style="font-family:'Plus Jakarta Sans',sans-serif;font-size:19px;font-weight:800;letter-spacing:-0.5px;color:#1E3A5F">Medi<span style="color:#2563EB">Pulse</span></div>
      </div>
      <div style="font-size:10px;color:#94A3B8;padding-left:33px;font-style:italic">La réputation médicale, automatisée.</div>
    </div>
    <div class="sidebar-user">
      <div class="sidebar-avatar" id="sb-avatar" style="background:#EFF6FF;color:#2563EB"></div>
      <div>
        <div class="sidebar-username" id="sb-name"></div>
        <div class="sidebar-role" id="sb-role" style="font-size:11px"></div>
      </div>
    </div>
    <div class="sidebar-nav">
      <div class="nav-section">Mon espace</div>
      <div class="nav-link active" id="nav-dashboard" onclick="showPage('dashboard')"><i class="ti ti-chart-bar"></i>Dashboard</div>
      <div class="nav-link" id="nav-simulateur" onclick="showPage('simulateur')"><i class="ti ti-currency-dollar"></i>Simulateur</div>
      <div class="nav-link" id="nav-prospects" onclick="showPage('prospects')"><i class="ti ti-users"></i>Prospects</div>
      <div class="nav-link" id="nav-commissions" onclick="showPage('commissions')"><i class="ti ti-receipt"></i>Commissions</div>
      <div class="nav-link" id="nav-valider" onclick="showPage('valider')"><i class="ti ti-circle-plus"></i>Valider cabinet</div>
    </div>
    <div class="sidebar-footer">
      <button class="logout-btn logout-btn-red" onclick="doLogout()">
        <i class="ti ti-logout" style="font-size:16px"></i> Déconnexion
      </button>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar topbar-light">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="mobile-menu-btn" onclick="toggleSidebar()" style="color:#0F172A"><i class="ti ti-menu-2"></i></button>
        <div class="topbar-title" id="page-title">Dashboard</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <span id="role-pill" style="padding:4px 14px;border-radius:99px;font-size:11px;font-weight:600;background:rgba(6,182,212,0.1);color:#0D7490;border:1px solid rgba(13,116,144,0.2)"></span>
        <span style="font-size:12px;color:#94A3B8" id="topbar-date"></span>
      </div>
    </div>

    <div class="content content-light" id="main-content">
      <div style="text-align:center;padding:60px;color:#94A3B8">Chargement...</div>
    </div>
  </div>
</div>

<!-- MODAL MODIFIER -->
<div class="overlay" id="edit-overlay" onclick="if(event.target===this)this.classList.remove('open')">
  <div class="modal">
    <div class="modal-hd">
      <div>
        <div style="font-size:16px;font-weight:700;color:#0A2540;font-family:'Plus Jakarta Sans',sans-serif" id="edit-name"></div>
        <div style="font-size:12px;color:#64748B;margin-top:2px" id="edit-meta"></div>
      </div>
      <button onclick="document.getElementById('edit-overlay').classList.remove('open')" style="background:none;border:none;cursor:pointer;font-size:20px;color:#94A3B8"><i class="ti ti-x"></i></button>
    </div>
    <div class="modal-body">
      <div style="font-size:10px;font-weight:700;color:#0A2540;text-transform:uppercase;letter-spacing:0.07em;margin-bottom:8px">Statut</div>
      <div id="status-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px"></div>
      <div style="font-size:10px;font-weight:700;color:#0A2540;text-transform:uppercase;letter-spacing:0.07em;margin-bottom:6px">Mobile WhatsApp</div>
      <input class="finput" type="tel" id="edit-mobile" placeholder="06 XX XX XX XX">
      <div style="font-size:10px;font-weight:700;color:#0A2540;text-transform:uppercase;letter-spacing:0.07em;margin-bottom:6px">Note rapide</div>
      <textarea class="finput" id="edit-note" rows="2" placeholder="Résultat de l'appel..." style="resize:none"></textarea>
      <div style="font-size:10px;font-weight:700;color:#0A2540;text-transform:uppercase;letter-spacing:0.07em;margin-bottom:6px">Date de rappel</div>
      <input class="finput" type="date" id="edit-rappel">
      <button class="save-btn" onclick="saveEdit()"><i class="ti ti-device-floppy"></i> Enregistrer</button>
    </div>
  </div>
</div>

<!-- MODAL AJOUTER -->
<div class="overlay" id="add-overlay" onclick="if(event.target===this)this.classList.remove('open')">
  <div class="modal">
    <div class="modal-hd">
      <div style="font-size:16px;font-weight:700;color:#0A2540;font-family:'Plus Jakarta Sans',sans-serif">Nouveau prospect</div>
      <button onclick="document.getElementById('add-overlay').classList.remove('open')" style="background:none;border:none;cursor:pointer;font-size:20px;color:#94A3B8"><i class="ti ti-x"></i></button>
    </div>
    <div class="modal-body">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div>
          <div style="font-size:10px;font-weight:700;color:#0A2540;text-transform:uppercase;letter-spacing:0.07em;margin-bottom:6px">Nom *</div>
          <input class="finput" id="add-nom" placeholder="Dr Nom Prénom">
        </div>
        <div>
          <div style="font-size:10px;font-weight:700;color:#0A2540;text-transform:uppercase;letter-spacing:0.07em;margin-bottom:6px">Spécialité *</div>
          <input class="finput" id="add-spec" placeholder="Dermatologue...">
        </div>
        <div>
          <div style="font-size:10px;font-weight:700;color:#0A2540;text-transform:uppercase;letter-spacing:0.07em;margin-bottom:6px">Quartier</div>
          <input class="finput" id="add-quartier" placeholder="Bd Abdelmoumen...">
        </div>
        <div>
          <div style="font-size:10px;font-weight:700;color:#0A2540;text-transform:uppercase;letter-spacing:0.07em;margin-bottom:6px">Tél mobile</div>
          <input class="finput" type="tel" id="add-mobile" placeholder="06 XX XX XX XX">
        </div>
      </div>
      <button class="save-btn" onclick="saveAdd()"><i class="ti ti-user-plus"></i> Ajouter</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="/js/supabase.js"></script>
<script>
let currentUser=null,userRecord=null,prospects=[],crmFilter='Tous',editId=null;

(async()=>{
  const auth=await requireAuth('commercial');
  if(!auth)return;
  currentUser=auth.session.user;
  userRecord=auth.user;
  const isTer=userRecord.type==='terrain';
  const initials=(userRecord.nom||currentUser.email).substring(0,2).toUpperCase();
  document.getElementById('sb-avatar').textContent=initials;
  document.getElementById('sb-name').textContent=userRecord.nom||currentUser.email.split('@')[0];
  document.getElementById('sb-role').textContent=isTer?'Commercial Terrain':'Commercial Téléphone';
  document.getElementById('role-pill').textContent=isTer?'Terrain':'Téléphone';
  document.getElementById('topbar-date').textContent=new Date().toLocaleDateString('fr-FR',{day:'numeric',month:'long'});
  showPage('dashboard');
})();

function showPage(page){if(window.innerWidth<768){var sb=document.getElementById('sidebar');if(sb)sb.classList.remove('open');}
  document.querySelectorAll('.nav-link').forEach(l=>l.classList.remove('active'));
  const navEl=document.getElementById('nav-'+page);
  if(navEl)navEl.classList.add('active');
  const titles={dashboard:'Mon Dashboard',simulateur:'Simulateur revenus',prospects:'Mes Prospects',commissions:'Mes commissions',valider:'Valider un cabinet'};
  document.getElementById('page-title').textContent=titles[page]||'Dashboard';
  if(page==='dashboard')renderDashboard();
  else if(page==='simulateur')renderSimulateur();
  else if(page==='prospects')renderProspects();
  else if(page==='commissions')renderCommissions();
  else if(page==='valider')renderValider();
}

function toggleSidebar(){var sb=document.getElementById('sidebar');sb.classList.toggle('open');}

// ── DASHBOARD ──
async function renderDashboard(){
  const now=new Date();
  const firstDay=new Date(now.getFullYear(),now.getMonth(),1).toISOString().split('T')[0];
  const{data}=await sb.from('prospection').select('*').order('id');
  prospects=data||[];
  const isTer=userRecord.type==='terrain';
  const paliers=isTer?PAL_TER:PAL_TEL;
  const pSig=isTer?P_SIG_TER:P_SIG_TEL;
  const pRec=isTer?P_REC_TER:P_REC_TEL;
  const signes=prospects.filter(p=>p.statut==='Signé'&&p.date_appel&&p.date_appel>=firstDay);
  const totalSignes=signes.length;
  const primeSig=totalSignes*Math.round(TD*pSig);
  const bonus=([...paliers].reverse().find(p=>totalSignes>=p.s)||{b:0}).b;
  const total=primeSig+bonus;
  const next=paliers.find(p=>totalSignes<p.s);
  const prev=[...paliers].reverse().find(p=>totalSignes>=p.s);
  let pct=next?Math.round(((totalSignes-(prev?prev.s:0))/(next.s-(prev?prev.s:0)))*100):100;
  const daysLeft=Math.ceil((new Date(now.getFullYear(),now.getMonth()+1,0)-now)/(1000*60*60*24));
  const nom=(userRecord.nom||currentUser.email.split('@')[0]).split(' ')[0];

  document.getElementById('main-content').innerHTML=`
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px">
      <div>
        <div style="font-size:20px;font-weight:800;color:#0A2540;font-family:'Plus Jakarta Sans',sans-serif">Bonjour ${nom} 👋</div>
        <div style="font-size:13px;color:#64748B;margin-top:2px">${new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}</div>
      </div>
      <button onclick="showPage('valider')" style="padding:10px 18px;border-radius:10px;background:linear-gradient(135deg,#0A2540,#0D7490);color:#fff;border:none;font-size:13px;font-weight:600;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;display:flex;align-items:center;gap:6px">
        <i class="ti ti-plus" style="font-size:15px"></i> Nouveau cabinet
      </button>
    </div>

    <!-- HERO MOTIVATION -->
    <div class="hero" style="margin-bottom:20px">
      <div style="position:absolute;top:0;right:0;background:#B45309;color:#fff;padding:8px 14px;border-radius:0 16px 0 14px;text-align:center;z-index:2">
        <div style="font-size:22px;font-weight:800;font-family:'Plus Jakarta Sans',sans-serif">${daysLeft}</div>
        <div style="font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:0.07em">JOURS RESTANTS</div>
      </div>
      <div style="position:relative;z-index:2">
        <div style="font-size:20px;font-weight:800;color:#F0F9FF;margin-bottom:4px;font-family:'Plus Jakarta Sans',sans-serif;letter-spacing:-0.3px">
          ${totalSignes===0?'Lance-toi — signe ton premier cabinet ! 🚀':'Excellent travail — continue ! 💪'}
        </div>
        <div style="font-size:12px;color:rgba(186,230,253,0.55);margin-bottom:18px">
          Chaque cabinet signé = ${Math.round(TD*pSig)} MAD + ${Math.round(TD*pRec)} MAD/mois à vie
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
          <div style="font-size:12px;font-weight:600;color:rgba(186,230,253,0.8)">Progression vers l'objectif (${paliers[paliers.length-1].s} cabinets)</div>
          <div style="font-size:12px;font-weight:700;color:#38BDF8">${pct}%</div>
        </div>
        <div class="prog-track">
          <div class="prog-fill" style="width:${pct}%"></div>
          ${paliers.map(p=>`<div class="palier-marker" style="left:${Math.round((p.s/paliers[paliers.length-1].s)*100)}%"></div>`).join('')}
        </div>
        <div style="display:flex;gap:14px;font-size:11px;color:rgba(186,230,253,0.5)">
          ${paliers.map(p=>`<span>🏆 ${p.s} → <span style="color:#FBBF24;font-weight:600">+${p.b} MAD</span></span>`).join(' · ')}
        </div>
        ${totalSignes<paliers[0].s?`
        <div style="margin-top:14px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:12px 14px;font-size:12px;color:rgba(186,230,253,0.75)">
          💡 Signe <strong style="color:#F0F9FF">${paliers[0].s} cabinets</strong> pour débloquer <span style="color:#FBBF24;font-weight:600">+${paliers[0].b} MAD</span> de bonus
        </div>`:''}
      </div>
    </div>

    <!-- KPI CARDS -->
    <div class="kpi-grid">
      <div class="kpi">
        <div class="kpi-label">Prochain bonus</div>
        <div class="kpi-val" style="color:#EA580C">+${next?next.b:paliers[paliers.length-1].b} MAD</div>
        <div class="kpi-sub">→ Signe ${next?next.s:paliers[paliers.length-1].s} cabinets</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">Revenus ce mois</div>
        <div class="kpi-val" style="color:#0D7490">${total.toLocaleString('fr-FR')} MAD</div>
        <div class="kpi-sub">${totalSignes===0?'→ Signe ton 1er cabinet !':'→ '+totalSignes+' signé'+(totalSignes>1?'s':'')}</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">Cabinets signés</div>
        <div class="kpi-val" style="color:#059669">${totalSignes} / ${paliers[paliers.length-1].s}</div>
        <div class="kpi-sub">→ Objectif : ${paliers[paliers.length-1].s} cabinets</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">Récurrent garanti</div>
        <div class="kpi-val" style="color:#2563EB">${(totalSignes*Math.round(TD*pRec)).toLocaleString('fr-FR')} MAD</div>
        <div class="kpi-sub">↑ +${Math.round(TD*pRec)} MAD/cabinet/mois</div>
      </div>
    </div>

    <!-- DERNIERS PROSPECTS -->
    <div style="background:#fff;border-radius:14px;border:1px solid #F3F4F6;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,0.04)">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
        <div style="font-size:15px;font-weight:700;color:#0A2540">Derniers prospects</div>
        <span onclick="showPage('prospects')" style="font-size:12px;color:#0D7490;font-weight:600;cursor:pointer">Voir tout →</span>
      </div>
      ${prospects.slice(0,5).map(p=>{
        const st=ST.find(s=>s.key===p.statut)||ST[0];
        return`<div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #F9FAFB">
          <div style="flex:1">
            <div style="font-size:13px;font-weight:600;color:#0A2540">${p.nom}</div>
            <div style="font-size:11px;color:#94A3B8;margin-top:1px">${p.specialite} · ${p.quartier||p.ville||''}</div>
          </div>
          <span style="padding:3px 10px;border-radius:99px;font-size:10px;font-weight:600;background:${st.bg};color:${st.color};white-space:nowrap">${st.label}</span>
        </div>`;
      }).join('')}
      ${prospects.length===0?'<div style="text-align:center;padding:24px;color:#94A3B8;font-size:13px">Aucun prospect</div>':''}
    </div>
  `;
}

// ── SIMULATEUR ──
function renderSimulateur(){
  const isTer=userRecord.type==='terrain';
  const pSig=isTer?P_SIG_TER:P_SIG_TEL;
  const pRec=isTer?P_REC_TER:P_REC_TEL;

  document.getElementById('main-content').innerHTML=`
    <div style="background:#fff;border-radius:14px;border:1px solid #F3F4F6;padding:24px;box-shadow:0 1px 4px rgba(0,0,0,0.04)">
      <div style="font-size:15px;font-weight:700;color:#0A2540;margin-bottom:4px">💰 Simulateur de revenus</div>
      <div style="font-size:13px;color:#64748B;margin-bottom:24px">Combien peux-tu gagner selon tes efforts ?</div>

      <div style="background:#F8FAFC;border-radius:12px;padding:16px 18px;margin-bottom:24px;border:1px solid #E2E8F0">
        <div style="font-size:13px;font-weight:600;color:#0A2540;margin-bottom:3px">🎯 Si je signe X cabinets ce mois...</div>
        <div style="font-size:11px;color:#64748B">Paliers : 5 cab → +${isTer?250:200} MAD · 10 cab → +${isTer?500:400} MAD · 15 cab → +${isTer?750:600} MAD</div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px">
        <div>
          <div style="margin-bottom:22px">
            <div style="font-size:10px;font-weight:700;color:#94A3B8;text-transform:uppercase;letter-spacing:0.07em;margin-bottom:10px">NOUVEAUX CABINETS — CE MOIS</div>
            <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px">
              <input type="range" id="sim-new" min="0" max="20" value="5" oninput="updateSim()" style="flex:1">
              <span id="sim-new-val" style="font-size:22px;font-weight:800;color:#0D7490;min-width:28px;text-align:right;font-family:'Plus Jakarta Sans',sans-serif">5</span>
            </div>
            <div style="display:flex;justify-content:space-between;font-size:10px;color:#CBD5E1"><span>0</span><span>20</span></div>
          </div>
          <div>
            <div style="font-size:10px;font-weight:700;color:#94A3B8;text-transform:uppercase;letter-spacing:0.07em;margin-bottom:10px">PORTEFEUILLE ACTIF TOTAL</div>
            <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px">
              <input type="range" id="sim-total" min="0" max="30" value="0" oninput="updateSim()" style="flex:1;accent-color:#2563EB">
              <span id="sim-total-val" style="font-size:22px;font-weight:800;color:#2563EB;min-width:28px;text-align:right;font-family:'Plus Jakarta Sans',sans-serif">0</span>
            </div>
            <div style="display:flex;justify-content:space-between;font-size:10px;color:#CBD5E1"><span>0</span><span>30</span></div>
          </div>
        </div>
        <div id="sim-result" style="background:#F8FAFC;border-radius:12px;padding:20px;border:1px solid #E2E8F0"></div>
      </div>
    </div>
  `;
  updateSim();
}

function updateSim(){
  const isTer=userRecord.type==='terrain';
  const pSig=isTer?P_SIG_TER:P_SIG_TEL;
  const pRec=isTer?P_REC_TER:P_REC_TEL;
  const paliers=isTer?PAL_TER:PAL_TEL;
  const nNew=parseInt(document.getElementById('sim-new')?.value||5);
  const nTot=parseInt(document.getElementById('sim-total')?.value||0);
  const snv=document.getElementById('sim-new-val');if(snv)snv.textContent=nNew;
  const stv=document.getElementById('sim-total-val');if(stv)stv.textContent=nTot;
  const commNew=nNew*Math.round(TD*pSig);
  const commRec=nTot*Math.round(TD*pRec);
  const bonus=([...paliers].reverse().find(p=>nNew>=p.s)||{b:0}).b;
  const total=commNew+commRec+bonus;
  const panel=document.getElementById('sim-result');
  if(!panel)return;
  panel.innerHTML=`
    <div style="margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid #E2E8F0">
      <div style="font-size:10px;font-weight:700;color:#94A3B8;text-transform:uppercase;letter-spacing:0.07em;margin-bottom:6px">COMMISSION NOUVEAUX (${Math.round(pSig*100)}%)</div>
      <div style="font-size:26px;font-weight:800;color:#EA580C;font-family:'Plus Jakarta Sans',sans-serif">${commNew.toLocaleString('fr-FR')} MAD</div>
      <div style="font-size:11px;color:#94A3B8">${nNew} × ${TD} × ${Math.round(pSig*100)}%</div>
    </div>
    <div style="margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid #E2E8F0">
      <div style="font-size:10px;font-weight:700;color:#94A3B8;text-transform:uppercase;letter-spacing:0.07em;margin-bottom:6px">RÉCURRENT (${Math.round(pRec*100)}%/MOIS)</div>
      <div style="font-size:26px;font-weight:800;color:#059669;font-family:'Plus Jakarta Sans',sans-serif">${commRec.toLocaleString('fr-FR')} MAD</div>
      <div style="font-size:11px;color:#94A3B8">${nTot} × ${TD} × ${Math.round(pRec*100)}%</div>
    </div>
    <div>
      <div style="font-size:10px;font-weight:700;color:#94A3B8;text-transform:uppercase;letter-spacing:0.07em;margin-bottom:6px">TOTAL CE MOIS</div>
      <div style="font-size:34px;font-weight:800;color:#0D7490;font-family:'Plus Jakarta Sans',sans-serif">${total.toLocaleString('fr-FR')} MAD</div>
      ${bonus>0?`<div style="margin-top:8px;background:#FFF7ED;border:1px solid #FED7AA;border-radius:8px;padding:8px 12px;font-size:12px;color:#EA580C;font-weight:600">🏆 Palier atteint ! +${bonus} MAD de bonus</div>`:''}
    </div>
  `;
}

// ── PROSPECTS ──
async function renderProspects(){
  if(!prospects.length){const{data}=await sb.from('prospection').select('*').order('id');prospects=data||[];}

}

      </div>
      <button onclick="document.getElementById('add-overlay').classList.add('open')" style="padding:10px 16px;border-radius:10px;background:linear-gradient(135deg,#0A2540,#0D7490);color:#fff;font-size:13px;font-weight:600;border:none;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;display:flex;align-items:center;gap:6px">

        <div onclick="setCrmFilter('${f}')" class="chip ${crmFilter===f?'chip-on':'chip-off'}">${f}</div>
      `).join('')}

      ${filtered.length?filtered.map(p=>{
        const st=ST.find(s=>s.key===p.statut)||ST[0];
        return`<div class="prospect-card">
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:600;color:#0A2540">${p.nom}</div>
            <div style="font-size:11px;color:#94A3B8;margin-top:2px">${p.specialite} · ${p.quartier||p.ville||''}${p.telephone_fixe?' · '+p.telephone_fixe:''}</div>

function setCrmFilter(f){crmFilter=f;renderProspectsList();}
function callProspect(id){const p=prospects.find(x=>x.id===id);if(!p)return;const tel=(p.telephone_fixe||p.telephone_mobile||'').replace(/\s/g,'');if(tel)window.location.href='tel:'+tel;else showToast('Aucun numéro','error');}
function waProspect(id){const p=prospects.find(x=>x.id===id);if(!p)return;const tel=(p.telephone_mobile||p.telephone_fixe||'').replace(/\s/g,'').replace(/^0/,'212');if(tel)window.open('https://wa.me/'+tel,'_blank');else showToast('Ajouter le mobile','error');}

function editProspect(id){
  const p=prospects.find(x=>x.id===id);if(!p)return;
  editId=id;
  document.getElementById('edit-name').textContent=p.nom;
  document.getElementById('edit-meta').textContent=p.specialite+(p.telephone_fixe?' · '+p.telephone_fixe:'');
  document.getElementById('edit-mobile').value=p.telephone_mobile||'';
  document.getElementById('edit-note').value=p.note||'';
  document.getElementById('edit-rappel').value=p.date_rappel||'';
  document.getElementById('status-grid').innerHTML=ST.map(s=>`
    <div onclick="selectSt('${s.key}',this)" class="st-opt" data-key="${s.key}" style="border-color:${p.statut===s.key?s.border:'#E5E7EB'};background:${p.statut===s.key?s.bg:'#fff'}">
      <div style="font-size:12px;font-weight:600;color:${s.color}">${s.label}</div>
      <div style="font-size:10px;color:#94A3B8;margin-top:2px">${s.desc}</div>
    </div>
  `).join('');
  document.getElementById('edit-overlay').classList.add('open');
}

function selectSt(key,el){
  document.querySelectorAll('#status-grid .st-opt').forEach(d=>{d.style.borderColor='#E5E7EB';d.style.background='#fff';});
  const s=ST.find(x=>x.key===key);
  el.style.borderColor=s.border;el.style.background=s.bg;
}

async function saveEdit(){
  var allOpts=document.querySelectorAll('#status-grid .st-opt');
  var statut='Nouveau';
  for(var i=0;i<allOpts.length;i++){if(allOpts[i].classList.contains('selected')){statut=allOpts[i].dataset.key;break;}}
  const{error}=await sb.from('prospection').update({
    statut,telephone_mobile:document.getElementById('edit-mobile').value,
    note:document.getElementById('edit-note').value,
    date_rappel:document.getElementById('edit-rappel').value||null,
    date_appel:new Date().toISOString().split('T')[0],
    commercial_id:currentUser.email,
  }).eq('id',editId);
  if(error){showToast('Erreur','error');return;}
  showToast('Enregistré ✓','success');
  document.getElementById('edit-overlay').classList.remove('open');
  renderProspects();
}

async function saveAdd(){
  const nom=document.getElementById('add-nom')?.value.trim();
  const spec=document.getElementById('add-spec')?.value.trim();
  if(!nom||!spec){showToast('Nom et spécialité requis','error');return;}
  const{error}=await sb.from('prospection').insert([{
    nom,specialite:spec,
    quartier:document.getElementById('add-quartier').value,
    ville:'Casablanca',
    telephone_mobile:document.getElementById('add-mobile').value,
    statut:'Nouveau',commercial_id:currentUser.email,
  }]);
  if(error){showToast('Erreur ajout','error');return;}
  showToast('Prospect ajouté ✓','success');
  document.getElementById('add-overlay').classList.remove('open');
  ['add-nom','add-spec','add-quartier','add-mobile'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
  renderProspects();
}

async function validerCabinet(){
  const nom=document.getElementById('cab-nom')?.value.trim();
  const med=document.getElementById('cab-medecin')?.value.trim();
  const spec=document.getElementById('cab-spec')?.value.trim();
  const ville=document.getElementById('cab-ville')?.value.trim();
  const emailMed=document.getElementById('cab-email-med')?.value.trim();
  const ass=document.getElementById('cab-assistante')?.value.trim();
  const emailAss=document.getElementById('cab-email-ass')?.value.trim();
  const plan=document.getElementById('cab-plan')?.value;
  const googleUrl=document.getElementById('cab-google')?.value.trim();
  const whatsapp=document.getElementById('cab-whatsapp')?.value.trim();
  if(!nom||!med||!spec||!emailMed||!ass||!emailAss){showToast('Tous les champs requis','error');return;}
  const today=new Date();
  const trialEnd=new Date(today);trialEnd.setDate(trialEnd.getDate()+7);
  const renewDate=new Date(today);renewDate.setMonth(renewDate.getMonth()+1);
  const{error}=await sb.from('cabinets').insert([{
    nom_cabinet:nom,nom_medecin:med,specialite:spec,ville,
    email_medecin:emailMed,email_assistante:emailAss,nom_assistante:ass,
    plan,statut:'trial',
    date_signature:today.toISOString().split('T')[0],
    date_debut:today.toISOString().split('T')[0],
    date_fin_trial:trialEnd.toISOString().split('T')[0],
    date_renouvellement:renewDate.toISOString().split('T')[0],
    statut_paiement:'trial',commercial_id:currentUser.email,
    google_url:googleUrl,whatsapp_cabinet:whatsapp,
  }]);
  if(error){showToast('Erreur — '+error.message,'error');return;}
  await sb.from('users').insert([
    {email:emailMed,nom:med,role:'medecin',type:'',statut:'actif',commercial_id:currentUser.email,date_creation:today.toISOString().split('T')[0]},
    {email:emailAss,nom:ass,role:'assistante',type:'',statut:'actif',commercial_id:currentUser.email,date_creation:today.toISOString().split('T')[0]},
  ]);
  showToast('Cabinet validé ! Trial 7 jours activé ✓','success');
  setTimeout(()=>showPage('dashboard'),1500);
}
</script>
