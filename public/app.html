<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediPulse</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#070E1C;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:#111E33;border-radius:24px;border:1px solid rgba(255,255,255,0.07);padding:40px 32px;width:100%;max-width:400px}
.logo{text-align:center;margin-bottom:32px}
.logo-mark{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:8px}
.logo-text{font-family:'Syne',sans-serif;font-size:28px;font-weight:800;color:#fff}
.logo-text span{color:#06B6D4}
.slogan{font-size:13px;color:#6B7FA8;font-style:italic}
label{font-size:11px;font-weight:600;color:#6B7FA8;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:8px;display:block}
input{width:100%;padding:13px 16px;border-radius:12px;border:1px solid rgba(255,255,255,0.07);background:#0D1929;font-size:14px;color:#F0F4FF;outline:none;margin-bottom:16px;font-family:'Plus Jakarta Sans',sans-serif}
input:focus{border-color:#06B6D4}
input::placeholder{color:#6B7FA8}
.btn{width:100%;padding:14px;border-radius:12px;background:linear-gradient(135deg,#2563EB,#06B6D4);color:#fff;font-size:15px;font-weight:600;border:none;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:disabled{opacity:0.4;cursor:not-allowed}
.error{font-size:13px;color:#F43F5E;text-align:center;margin-top:12px;min-height:18px}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,0.3);border-top-color:white;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-mark">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#06B6D4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      <div class="logo-text">Medi<span>Pulse</span></div>
    </div>
    <div class="slogan">La reputation medicale, automatisee.</div>
  </div>
  <label>Email</label>
  <input type="email" id="email" placeholder="votre@email.com" autocomplete="email">
  <label>Mot de passe</label>
  <input type="password" id="pwd" placeholder="..." onkeydown="if(event.key==='Enter')login()">
  <button class="btn" id="btn" onclick="login()">Acceder</button>
  <div class="error" id="error"></div>
</div>
<script>
const sb = supabase.createClient('https://czttvnvcetgmjfqishig.supabase.co','sb_publishable_mRTR9POOteWe_D2YgpucRQ_hMMxNP1m');
const REDIRECTS = {owner:'/owner.html',commercial:'/commercial.html',medecin:'/medecin.html',assistante:'/assistante.html'};
(async()=>{
  const{data:{session}}=await sb.auth.getSession();
  if(session){
    const{data:user}=await sb.from('users').select('role').eq('email',session.user.email).single();
    if(user&&REDIRECTS[user.role])window.location.href=REDIRECTS[user.role];
  }
})();
async function login(){
  const email=document.getElementById('email').value.trim();
  const pwd=document.getElementById('pwd').value;
  const btn=document.getElementById('btn');
  const err=document.getElementById('error');
  if(!email||!pwd){err.textContent='Email et mot de passe requis';return}
  btn.disabled=true;btn.innerHTML='<div class="spinner"></div> Connexion...';err.textContent='';
  const{data,error}=await sb.auth.signInWithPassword({email,password:pwd});
  if(error){err.textContent='Email ou mot de passe incorrect';btn.disabled=false;btn.innerHTML='Acceder';return}
  const{data:user}=await sb.from('users').select('*').eq('email',data.user.email).single();
  if(!user){err.textContent='Compte non configure';return}
  if(user.statut==='suspendu'){err.textContent='Compte suspendu';return}
  window.location.href=REDIRECTS[user.role]||'/app.html';
}
</script>
</body>
</html>
