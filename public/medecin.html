<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediPulse — Mon Cabinet</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://unpkg.com/@tabler/icons-webfont@3.11.0/dist/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/shared.css">
<style>
body{background:#F5F7FF;color:#111827;font-family:'Plus Jakarta Sans',sans-serif}

/* ── KPI GRID ── */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.kpi-card{background:#fff;border-radius:16px;border:1px solid #F3F4F6;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,0.05)}
.kpi-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.kpi-label{font-size:13px;color:#6B7280;font-weight:500}
.kpi-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.kpi-value{font-size:32px;font-weight:700;color:#111827;line-height:1;margin-bottom:6px}
.kpi-sub{font-size:12px;font-weight:600}

/* ── CHARTS ROW ── */
.charts-row{display:grid;grid-template-columns:3fr 2fr;gap:20px;margin-bottom:24px}

/* ── PAGE HEADER ── */
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:12px}
.page-title{font-size:22px;font-weight:700;color:#0F172A}
.page-title-bar{width:40px;height:3px;background:#2563EB;border-radius:2px;margin-top:6px}
.header-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* ── PERIOD BTN ── */
.period-btn{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;border:1px solid #E5E7EB;background:#fff;font-size:13px;color:#374151;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;user-select:none;white-space:nowrap}
.period-dropdown{display:none;position:absolute;right:0;top:44px;background:#fff;border:1px solid #E5E7EB;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,0.1);min-width:180px;z-index:100;overflow:hidden}
.period-option{padding:11px 16px;font-size:13px;color:#374151;cursor:pointer}
.period-option:hover{background:#F9FAFB}

/* ── GOOGLE BTN ── */
.google-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:10px;background:#2563EB;color:#fff;font-size:13px;font-weight:600;text-decoration:none;white-space:nowrap}

/* ── AVIS TABLE ── */
.avis-table{width:100%;border-collapse:collapse}
.avis-table th{text-align:left;font-size:11px;font-weight:600;color:#9CA3AF;text-transform:uppercase;letter-spacing:0.05em;padding:0 0 10px}
.avis-table td{padding:12px 0;border-top:1px solid #F9FAFB;vertical-align:middle;font-size:13px}
.avis-table td:not(:first-child){padding-left:12px}
.patient-avatar{width:34px;height:34px;border-radius:50%;background:#EFF6FF;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#2563EB;flex-shrink:0}

/* ── STAT BARS ── */
.stat-bar-row{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.stat-bar-track{flex:1;height:8px;background:#F3F4F6;border-radius:99px;overflow:hidden}
.stat-bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#2563EB,#38BDF8)}

/* ── RESPONSIVE ── */
@media(max-width:768px){
  .kpi-grid{grid-template-columns:1fr 1fr!important;gap:10px!important}
  .charts-row{grid-template-columns:1fr!important}
  .kpi-value{font-size:22px!important}
  .page-header{flex-direction:column!important;align-items:flex-start!important}
  .header-actions{width:100%!important;justify-content:flex-start!important}
  
  .kpi-grid{grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
  .kpi-value{font-size:24px}
  .kpi-label{font-size:12px}
  .charts-row{grid-template-columns:1fr}
  .page-header{flex-direction:column;align-items:flex-start;margin-bottom:20px}
  .page-title{font-size:18px}
  .header-actions{width:100%}
  .google-btn{font-size:12px;padding:7px 12px}
  .period-btn{font-size:12px;padding:7px 12px}
  .avis-table{font-size:12px}
  .avis-table th{font-size:10px}
  /* Hide less important columns on mobile */
  .avis-table .col-date{display:none}
  .avis-table .col-comment{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .stat-bars-grid{grid-template-columns:1fr!important}
}
</style>
</head>
<body>
<div class="layout">

  <!-- SIDEBAR -->
  <div class="sidebar sidebar-light" id="sidebar">
    <div class="sidebar-logo">
      <div style="display:flex;align-items:center;gap:9px;margin-bottom:6px">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        <div style="font-size:19px;font-weight:800;letter-spacing:-0.5px;color:#1E3A5F">Medi<span style="color:#2563EB">Pulse</span></div>
      </div>
      <div style="font-size:10px;color:#94A3B8;padding-left:33px;font-style:italic">La réputation médicale, automatisée.</div>
    </div>
    <div class="sidebar-user">
      <div class="sidebar-avatar" id="sb-avatar" style="background:#EFF6FF;color:#2563EB"></div>
      <div>
        <div class="sidebar-username" id="sb-name"></div>
        <div class="sidebar-role" style="font-size:11px">Médecin</div>
      </div>
    </div>
    <div class="sidebar-nav">
      <div class="nav-section">Mon cabinet</div>
      <div class="nav-link active" id="nav-dashboard" onclick="showPage('dashboard')"><i class="ti ti-chart-bar"></i>Dashboard</div>
      <div class="nav-link" id="nav-avis" onclick="showPage('avis')"><i class="ti ti-messages"></i>Avis patients</div>
      <div class="nav-link" id="nav-stats" onclick="showPage('stats')"><i class="ti ti-trending-up"></i>Statistiques</div>
    </div>
    <div class="sidebar-footer">
      <button class="logout-btn logout-btn-blue" onclick="doLogout()">
        <i class="ti ti-logout" style="font-size:16px"></i> Déconnexion
      </button>
    </div>
  </div>

  <!-- Mobile overlay -->
  <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar topbar-light">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="mobile-menu-btn" onclick="toggleSidebar()" style="color:#0F172A"><i class="ti ti-menu-2"></i></button>
        <div style="font-size:16px;font-weight:700;color:#0F172A" id="page-title">Dashboard</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <span style="padding:4px 14px;border-radius:99px;font-size:11px;font-weight:600;background:rgba(16,185,129,0.15);color:#10B981;border:1px solid rgba(16,185,129,0.25)">Médecin</span>
        <span style="font-size:12px;color:#64748B;display:none" id="topbar-date" class="hide-mobile"></span>
      </div>
    </div>

    <div class="content content-light" id="main-content">
      <div style="text-align:center;padding:60px;color:#94A3B8">Chargement...</div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="/js/supabase.js"></script>
<script>
let currentUser=null,userRecord=null;

(async()=>{
  const auth=await requireAuth('medecin');
  if(!auth)return;
  currentUser=auth.session.user;
  userRecord=auth.user;
  const initials=(userRecord.nom||currentUser.email).substring(0,2).toUpperCase();
  document.getElementById('sb-avatar').textContent=initials;
  document.getElementById('sb-name').textContent=userRecord.nom||currentUser.email.split('@')[0];
  const dateEl=document.getElementById('topbar-date');
  if(dateEl){dateEl.textContent=new Date().toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});dateEl.style.display='block';}
  showPage('dashboard');
})();

function showPage(page){
  closeSidebar();
  document.querySelectorAll('.nav-link').forEach(l=>l.classList.remove('active'));
  const navEl=document.getElementById('nav-'+page);
  if(navEl)navEl.classList.add('active');
  const titles={dashboard:'Mon Cabinet',avis:'Avis Patients',stats:'Statistiques'};
  document.getElementById('page-title').textContent=titles[page]||'Dashboard';
  if(page==='dashboard')renderDashboard();
  else if(page==='avis')renderAvis();
  else if(page==='stats')renderStats();
}

function toggleSidebar(){
  const sb=document.getElementById('sidebar');
  const ov=document.getElementById('sidebar-overlay');
  const open=sb.classList.toggle('open');
  ov.classList.toggle('active',open);
}

function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-overlay').classList.remove('active');
}

// ── DASHBOARD ──
function renderDashboard(){
  const nom=userRecord.nom||'Dr. Test';
  const googleUrl='https://www.google.com/search?q='+encodeURIComponent(nom+' médecin Casablanca avis');

  document.getElementById('main-content').innerHTML=`
    <div class="page-header">
      <div>
        <div class="page-title">Tableau de bord</div>
        <div class="page-title-bar"></div>
      </div>
      <div class="header-actions">
        <div style="position:relative">
          <div class="period-btn" onclick="togglePeriod()" id="period-btn">
            <i class="ti ti-calendar" style="font-size:15px;color:#6B7280"></i>
            <span id="period-label">30 derniers jours</span>
            <i class="ti ti-chevron-down" style="font-size:13px;color:#6B7280"></i>
          </div>
          <div class="period-dropdown" id="period-dropdown">
            ${['7 derniers jours','30 derniers jours','90 derniers jours','Cette année'].map(opt=>
              `<div class="period-option" onclick="selectPeriod('${opt}')">${opt}</div>`
            ).join('')}
          </div>
        </div>
        <a href="${googleUrl}" target="_blank" class="google-btn">
          <i class="ti ti-search" style="font-size:14px"></i> Ma fiche Google
        </a>
      </div>
    </div>

    <!-- KPI GRID v3 -->
    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-head">
          <div class="kpi-label">Avis collectés</div>
          <div class="kpi-icon" style="background:#EFF6FF"><i class="ti ti-message" style="font-size:18px;color:#2563EB"></i></div>
        </div>
        <div class="kpi-value">24</div>
        <div class="kpi-sub" style="color:#10B981">+42% <span style="color:#6B7280;font-weight:400">vs mois précédent</span></div>
      </div>
      <div class="kpi-card">
        <div class="kpi-head">
          <div class="kpi-label">Note moyenne</div>
          <div class="kpi-icon" style="background:#FFF7ED"><i class="ti ti-star" style="font-size:18px;color:#F59E0B"></i></div>
        </div>
        <div style="display:flex;align-items:baseline;gap:8px">
          <div class="kpi-value">3.7</div>
          <div style="font-size:16px;color:#F59E0B">⭐⭐⭐⭐</div>
        </div>
        <div class="kpi-sub" style="color:#6B7280;font-weight:400">sur 5.0 — 24 avis</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-head">
          <div class="kpi-label">Formulaires envoyés</div>
          <div class="kpi-icon" style="background:#F0FDF4"><i class="ti ti-send" style="font-size:18px;color:#10B981"></i></div>
        </div>
        <div class="kpi-value">12</div>
        <div class="kpi-sub" style="color:#10B981">+28% <span style="color:#6B7280;font-weight:400">vs mois précédent</span></div>
      </div>
      <div class="kpi-card">
        <div class="kpi-head">
          <div class="kpi-label">Taux de réponse</div>
          <div class="kpi-icon" style="background:#F0FDF4"><i class="ti ti-check" style="font-size:18px;color:#10B981"></i></div>
        </div>
        <div style="position:relative;width:64px;height:64px;margin:-4px 0 4px">
          <svg width="64" height="64" viewBox="0 0 64 64">
            <circle cx="32" cy="32" r="26" fill="none" stroke="#F3F4F6" stroke-width="6"/>
            <circle cx="32" cy="32" r="26" fill="none" stroke="#10B981" stroke-width="6" stroke-dasharray="100 163" stroke-dashoffset="41" stroke-linecap="round" transform="rotate(-90 32 32)"/>
          </svg>
          <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#10B981">67%</div>
        </div>
        <div class="kpi-sub" style="color:#10B981">Excellent</div>
      </div>
    </div>

    <!-- CHARTS -->
    <div class="charts-row">
      <!-- LINE CHART -->
      <div class="kpi-card">
        <div style="font-size:15px;font-weight:700;color:#111827;margin-bottom:20px">Évolution des avis</div>
        <svg width="100%" height="160" viewBox="0 0 500 160" preserveAspectRatio="none">
          <defs>
            <linearGradient id="grad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#2563EB" stop-opacity="0.15"/>
              <stop offset="100%" stop-color="#2563EB" stop-opacity="0.01"/>
            </linearGradient>
          </defs>
          <line x1="0" y1="20" x2="500" y2="20" stroke="#F3F4F6" stroke-width="1"/>
          <line x1="0" y1="60" x2="500" y2="60" stroke="#F3F4F6" stroke-width="1"/>
          <line x1="0" y1="100" x2="500" y2="100" stroke="#F3F4F6" stroke-width="1"/>
          <line x1="0" y1="140" x2="500" y2="140" stroke="#F3F4F6" stroke-width="1"/>
          <path d="M20 110 C80 100 100 90 140 80 C180 70 200 85 240 65 C280 45 300 35 340 25 C380 15 420 20 470 10 L470 155 L20 155 Z" fill="url(#grad)"/>
          <path d="M20 110 C80 100 100 90 140 80 C180 70 200 85 240 65 C280 45 300 35 340 25 C380 15 420 20 470 10" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="20" cy="110" r="4" fill="#fff" stroke="#2563EB" stroke-width="2"/>
          <circle cx="140" cy="80" r="4" fill="#fff" stroke="#2563EB" stroke-width="2"/>
          <circle cx="240" cy="65" r="4" fill="#fff" stroke="#2563EB" stroke-width="2"/>
          <circle cx="340" cy="25" r="4" fill="#fff" stroke="#2563EB" stroke-width="2"/>
          <circle cx="470" cy="10" r="5" fill="#2563EB" stroke="#fff" stroke-width="2"/>
          <text x="10" y="158" fill="#9CA3AF" font-size="10" font-family="Plus Jakarta Sans">Jan</text>
          <text x="88" y="158" fill="#9CA3AF" font-size="10" font-family="Plus Jakarta Sans">Fév</text>
          <text x="168" y="158" fill="#9CA3AF" font-size="10" font-family="Plus Jakarta Sans">Mar</text>
          <text x="248" y="158" fill="#9CA3AF" font-size="10" font-family="Plus Jakarta Sans">Avr</text>
          <text x="328" y="158" fill="#9CA3AF" font-size="10" font-family="Plus Jakarta Sans">Mai</text>
          <text x="452" y="158" fill="#2563EB" font-size="10" font-family="Plus Jakarta Sans" font-weight="600">Juin</text>
        </svg>
      </div>

      <!-- DONUT -->
      <div class="kpi-card">
        <div style="font-size:15px;font-weight:700;color:#111827;margin-bottom:16px">Répartition des avis</div>
        <div style="display:flex;justify-content:center;margin-bottom:12px">
          <svg width="120" height="120" viewBox="0 0 140 140">
            <circle cx="70" cy="70" r="52" fill="none" stroke="#F3F4F6" stroke-width="16"/>
            <circle cx="70" cy="70" r="52" fill="none" stroke="#10B981" stroke-width="16" stroke-dasharray="163 163" stroke-dashoffset="82" transform="rotate(-90 70 70)"/>
            <circle cx="70" cy="70" r="52" fill="none" stroke="#34D399" stroke-width="16" stroke-dasharray="98 228" stroke-dashoffset="-81" transform="rotate(-90 70 70)"/>
            <circle cx="70" cy="70" r="52" fill="none" stroke="#FCD34D" stroke-width="16" stroke-dasharray="39 287" stroke-dashoffset="-179" transform="rotate(-90 70 70)"/>
            <circle cx="70" cy="70" r="52" fill="none" stroke="#F87171" stroke-width="16" stroke-dasharray="26 300" stroke-dashoffset="-218" transform="rotate(-90 70 70)"/>
            <text x="70" y="64" text-anchor="middle" fill="#111827" font-size="18" font-weight="700" font-family="Plus Jakarta Sans">80%</text>
            <text x="70" y="80" text-anchor="middle" fill="#10B981" font-size="10" font-weight="600" font-family="Plus Jakarta Sans">Positifs</text>
          </svg>
        </div>
        <div style="font-size:11px;color:#6B7280;text-align:center;margin-bottom:10px">Sur 24 avis collectés</div>
        ${[
          {color:'#10B981',label:'5 étoiles',count:'12 (50%)',emoji:'😊'},
          {color:'#34D399',label:'4 étoiles',count:'7 (29%)',emoji:'😊'},
          {color:'#FCD34D',label:'3 étoiles',count:'3 (13%)',emoji:'😐'},
          {color:'#F87171',label:'1-2 étoiles',count:'2 (8%)',emoji:'😞'},
        ].map(r=>`
          <div style="display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-top:1px solid #F9FAFB">
            <div style="display:flex;align-items:center;gap:6px">
              <span style="font-size:12px">${r.emoji}</span>
              <div style="width:8px;height:8px;border-radius:50%;background:${r.color}"></div>
              <span style="font-size:11px;color:#374151">${r.label}</span>
            </div>
            <span style="font-size:11px;font-weight:600;color:#111827">${r.count}</span>
          </div>`).join('')}
      </div>
    </div>

    <!-- AVIS TABLE -->
    <div class="kpi-card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px">
        <div style="font-size:15px;font-weight:700;color:#111827">Derniers avis patients</div>
        <span onclick="showPage('avis')" style="font-size:13px;color:#2563EB;font-weight:600;cursor:pointer">Voir tout →</span>
      </div>
      ${renderAvisTable(4)}
    </div>
  `;

  document.addEventListener('click',function(e){
    const dd=document.getElementById('period-dropdown');
    const btn=document.getElementById('period-btn');
    if(dd&&btn&&!btn.contains(e.target)&&!dd.contains(e.target))dd.style.display='none';
  });
}

function togglePeriod(){
  const dd=document.getElementById('period-dropdown');
  if(dd)dd.style.display=dd.style.display==='none'||!dd.style.display?'block':'none';
}
function selectPeriod(opt){
  const lbl=document.getElementById('period-label');
  if(lbl)lbl.textContent=opt;
  const dd=document.getElementById('period-dropdown');
  if(dd)dd.style.display='none';
  showToast('Période : '+opt,'info');
}

function renderAvisTable(limit){
  const avis=[
    {init:'AK',nom:'Ahmed K.',date:"Aujourd'hui",stars:5,text:"Excellent cabinet, très à l'écoute.",positive:true},
    {init:'FB',nom:'Fatima B.',date:'Hier',stars:5,text:'Très bonne expérience, personnel accueillant.',positive:true},
    {init:'MR',nom:'Mohamed R.',date:'Il y a 2 jours',stars:3,text:'Attente longue mais médecin compétent.',positive:true},
    {init:'SS',nom:'Sara S.',date:'Il y a 3 jours',stars:2,text:'Rendez-vous annulé sans prévenir.',positive:false},
    {init:'YA',nom:'Youssef A.',date:'Il y a 4 jours',stars:5,text:'Cabinet moderne et très professionnel.',positive:true},
  ].slice(0,limit||10);

  return`<div style="overflow-x:auto;-webkit-overflow-scrolling:touch">
    <table class="avis-table" style="min-width:500px">
      <thead><tr>
        <th>Patient</th>
        <th>Note</th>
        <th class="col-comment">Commentaire</th>
        <th class="col-date">Date</th>
        <th>Statut</th>
      </tr></thead>
      <tbody>${avis.map(a=>`
        <tr>
          <td>
            <div style="display:flex;align-items:center;gap:10px">
              <div class="patient-avatar">${a.init}</div>
              <span style="font-weight:600;color:#111827;white-space:nowrap">${a.nom}</span>
            </div>
          </td>
          <td style="white-space:nowrap">${'⭐'.repeat(a.stars)}</td>
          <td class="col-comment" style="color:#6B7280;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${a.text}</td>
          <td class="col-date" style="color:#9CA3AF;white-space:nowrap">${a.date}</td>
          <td>
            <span style="padding:3px 10px;border-radius:99px;font-size:11px;font-weight:600;background:${a.positive?'#F0FDF4':'#FFF1F2'};color:${a.positive?'#15803D':'#BE123C'};white-space:nowrap">
              ${a.positive?'Positif':'⚠ Négatif'}
            </span>
          </td>
        </tr>`).join('')}
      </tbody>
    </table>
  </div>`;
}

function renderAvis(){
  document.getElementById('main-content').innerHTML=`
    <div class="page-header">
      <div><div class="page-title">Avis Patients</div><div class="page-title-bar"></div></div>
    </div>
    <div class="kpi-card">${renderAvisTable(10)}</div>
  `;
}

function renderStats(){
  document.getElementById('main-content').innerHTML=`
    <div class="page-header">
      <div>
        <div class="page-title">Statistiques</div>
        <div class="page-title-bar"></div>
        <div style="font-size:14px;color:#6B7280;margin-top:8px">Évolution de votre réputation en ligne</div>
      </div>
    </div>

    <div class="kpi-grid" style="margin-bottom:20px">
      ${[
        {val:'3.7',lbl:'Note actuelle',sub:'sur 5.0',icon:'⭐'},
        {val:'+0.3',lbl:'Évolution',sub:'30 derniers jours',icon:'📈'},
        {val:'24',lbl:'Total avis',sub:'depuis le début',icon:'💬'},
        {val:'67%',lbl:'Taux réponse',sub:'Excellent',icon:'✅'},
      ].map(k=>`
        <div class="kpi-card">
          <div style="font-size:22px;margin-bottom:10px">${k.icon}</div>
          <div class="kpi-value" style="font-size:28px">${k.val}</div>
          <div style="font-size:13px;font-weight:600;color:#374151;margin-top:4px">${k.lbl}</div>
          <div style="font-size:12px;color:#9CA3AF;margin-top:2px">${k.sub}</div>
        </div>`).join('')}
    </div>

    <div class="kpi-card">
      <div style="font-size:15px;font-weight:700;color:#111827;margin-bottom:20px">Progression mensuelle</div>
      <div id="chart-bars" style="display:flex;align-items:flex-end;justify-content:space-around;height:140px;border-bottom:1px solid #F3F4F6;padding-bottom:10px;margin-bottom:10px"></div>
      <div style="display:flex;justify-content:space-around">
        ${['Jan','Fév','Mar','Avr','Mai'].map(m=>`<div style="font-size:12px;color:#9CA3AF;text-align:center;flex:1">${m}</div>`).join('')}
      </div>
    </div>
  `;

  setTimeout(()=>{
    const chart=document.getElementById('chart-bars');
    if(!chart)return;
    const vals=[2.8,3.0,3.2,3.5,3.7];
    const bgs=['linear-gradient(180deg,#BFDBFE,#DBEAFE)','linear-gradient(180deg,#93C5FD,#BFDBFE)','linear-gradient(180deg,#60A5FA,#93C5FD)','linear-gradient(180deg,#3B82F6,#60A5FA)','linear-gradient(180deg,#1D4ED8,#2563EB)'];
    chart.innerHTML=vals.map((v,i)=>{
      const h=Math.round((v/5)*130);
      return`<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;padding:0 6px">
        <div style="font-size:11px;font-weight:700;color:${i===4?'#1D4ED8':'#6B7280'}">${v}</div>
        <div style="width:100%;border-radius:6px 6px 0 0;height:${h}px;background:${bgs[i]}"></div>
      </div>`;
    }).join('');
  },100);
}
</script>

<script>
function applyResponsive(){
  var isMobile = window.innerWidth <= 768;
  // KPI grid
  var kpiGrid = document.querySelector('.kpi-grid');
  if(kpiGrid) kpiGrid.style.gridTemplateColumns = isMobile ? '1fr 1fr' : 'repeat(4,1fr)';
  // Charts row
  var chartsRow = document.querySelector('.charts-row');
  if(chartsRow) chartsRow.style.gridTemplateColumns = isMobile ? '1fr' : '3fr 2fr';
  // Page header
  var pageHeader = document.querySelector('.page-header');
  if(pageHeader) pageHeader.style.flexDirection = isMobile ? 'column' : 'row';
}
document.addEventListener('DOMContentLoaded', applyResponsive);
window.addEventListener('resize', applyResponsive);
// Also run after page render
setTimeout(applyResponsive, 100);
setTimeout(applyResponsive, 500);
</script>
</body>
</html>
