<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediPulse — Mon Cabinet</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://unpkg.com/@tabler/icons-webfont@3.11.0/dist/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/shared.css">
<style>
body { background: #F5F7FF; color: #111827; }
.topbar-title { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 16px; font-weight: 700; color: #0F172A; }
</style>
</head>
<body>
<div class="layout">

  <!-- SIDEBAR -->
  <div class="sidebar sidebar-light" id="sidebar">
    <div class="sidebar-logo">
      <div style="display:flex;align-items:center;gap:9px;margin-bottom:6px">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        <div style="font-family:'Syne',sans-serif;font-size:19px;font-weight:800;letter-spacing:-0.5px;color:#1E3A5F">Medi<span style="color:#2563EB">Pulse</span></div>
      </div>
      <div style="font-size:10px;color:#94A3B8;padding-left:33px;font-style:italic">La réputation médicale, automatisée.</div>
    </div>
    <div class="sidebar-user">
      <div class="sidebar-avatar" id="sb-avatar" style="background:#EFF6FF;color:#2563EB"></div>
      <div>
        <div class="sidebar-username" id="sb-name"></div>
        <div class="sidebar-role" style="font-size:11px">Médecin</div>
      </div>
    </div>
    <div class="sidebar-nav">
      <div class="nav-section">Mon cabinet</div>
      <div class="nav-link active" id="nav-dashboard" onclick="showPage('dashboard')"><i class="ti ti-chart-bar"></i>Dashboard</div>
      <div class="nav-link" id="nav-avis" onclick="showPage('avis')"><i class="ti ti-messages"></i>Avis patients</div>
      <div class="nav-link" id="nav-stats" onclick="showPage('stats')"><i class="ti ti-trending-up"></i>Statistiques</div>
    </div>
    <div class="sidebar-footer">
      <button class="logout-btn logout-btn-blue" onclick="doLogout()">
        <i class="ti ti-logout" style="font-size:16px"></i> Déconnexion
      </button>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar topbar-light">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="mobile-menu-btn" onclick="toggleSidebar()" style="color:#0F172A"><i class="ti ti-menu-2"></i></button>
        <div class="topbar-title" id="page-title">Dashboard</div>
      </div>
      <div style="display:flex;align-items:center;gap:12px">
        <span style="padding:4px 14px;border-radius:99px;font-size:11px;font-weight:600;background:rgba(16,185,129,0.15);color:#10B981;border:1px solid rgba(16,185,129,0.25)">Médecin</span>
        <span style="font-size:13px;color:#64748B" id="topbar-date"></span>
      </div>
    </div>

    <div class="content content-light" id="main-content">
      <div style="text-align:center;padding:60px;color:#94A3B8">Chargement...</div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="/js/supabase.js"></script>
<script src="/js/auth.js"></script>
<script>
let currentUser = null;
let userRecord = null;

// ── INIT ──
(async () => {
  const auth = await requireAuth('medecin');
  if (!auth) return;
  currentUser = auth.session.user;
  userRecord = auth.user;

  const initials = (userRecord.nom || currentUser.email).substring(0, 2).toUpperCase();
  document.getElementById('sb-avatar').textContent = initials;
  document.getElementById('sb-name').textContent = userRecord.nom || currentUser.email.split('@')[0];
  document.getElementById('topbar-date').textContent = new Date().toLocaleDateString('fr-FR', {day:'numeric',month:'long',year:'numeric'});

  showPage('dashboard');
})();

// ── NAVIGATION ──
function showPage(page) {
  document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
  const navEl = document.getElementById('nav-' + page);
  if (navEl) navEl.classList.add('active');
  const titles = { dashboard: 'Mon Cabinet', avis: 'Avis Patients', stats: 'Statistiques' };
  document.getElementById('page-title').textContent = titles[page] || 'Dashboard';

  if (page === 'dashboard') renderDashboard();
  else if (page === 'avis') renderAvis();
  else if (page === 'stats') renderStats();
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

// ── DASHBOARD ──
function renderDashboard() {
  const nom = userRecord.nom || 'Dr. Test';
  const googleUrl = 'https://www.google.com/search?q=' + encodeURIComponent(nom + ' médecin Casablanca avis');

  document.getElementById('main-content').innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:28px">
      <div>
        
        <div style="width:40px;height:3px;background:#2563EB;border-radius:2px;margin-top:6px"></div>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <div style="position:relative">
          <div onclick="togglePeriod()" id="period-btn" style="display:flex;align-items:center;gap:6px;padding:8px 16px;border-radius:10px;border:1px solid #E5E7EB;background:#fff;font-size:13px;color:#374151;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;user-select:none">
            <i class="ti ti-calendar" style="font-size:15px;color:#6B7280"></i>
            <span id="period-label">30 derniers jours</span>
            <i class="ti ti-chevron-down" style="font-size:13px;color:#6B7280"></i>
          </div>
          <div id="period-dropdown" style="display:none;position:absolute;right:0;top:44px;background:#fff;border:1px solid #E5E7EB;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,0.1);min-width:180px;z-index:100;overflow:hidden">
            ${['7 derniers jours','30 derniers jours','90 derniers jours','Cette année'].map(opt =>
              `<div onclick="selectPeriod('${opt}')" style="padding:11px 16px;font-size:13px;color:#374151;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif" onmouseover="this.style.background='#F9FAFB'" onmouseout="this.style.background='#fff'">${opt}</div>`
            ).join('')}
          </div>
        </div>
        <a href="${googleUrl}" target="_blank" style="display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:10px;background:#2563EB;color:#fff;font-size:13px;font-weight:600;text-decoration:none;font-family:'Plus Jakarta Sans',sans-serif">
          <i class="ti ti-search" style="font-size:14px"></i> Ma fiche Google
        </a>
      </div>
    </div>

    <!-- 4 KPIs -->
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px">
      ${[
        {val:'24',lbl:'Avis collectés',sub:'+42% vs mois précédent',subColor:'#10B981',icon:'ti-message',iconBg:'#EFF6FF',iconColor:'#2563EB'},
        {val:'3.7',lbl:'Note moyenne',sub:'sur 5.0 — 24 avis',subColor:'#6B7280',icon:'ti-star',iconBg:'#FFF7ED',iconColor:'#F59E0B'},
        {val:'12',lbl:'Formulaires envoyés',sub:'+28% vs mois précédent',subColor:'#10B981',icon:'ti-send',iconBg:'#F0FDF4',iconColor:'#10B981'},
        {val:'67%',lbl:'Taux de réponse',sub:'Excellent',subColor:'#10B981',icon:'ti-check',iconBg:'#F0FDF4',iconColor:'#10B981'},
      ].map(k => `
        <div class="card-white">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
            <div style="font-size:13px;color:#6B7280;font-weight:500;font-family:'Plus Jakarta Sans',sans-serif">${k.lbl}</div>
            <div style="width:36px;height:36px;border-radius:10px;background:${k.iconBg};display:flex;align-items:center;justify-content:center">
              <i class="ti ${k.icon}" style="font-size:18px;color:${k.iconColor}"></i>
            </div>
          </div>
          <div style="font-size:32px;font-weight:700;color:#111827;line-height:1;font-family:'Plus Jakarta Sans',sans-serif">${k.val}</div>
          <div style="font-size:12px;color:${k.subColor};font-weight:600;margin-top:6px;font-family:'Plus Jakarta Sans',sans-serif">${k.sub}</div>
        </div>
      `).join('')}
    </div>

    <!-- CHARTS -->
    <div style="display:grid;grid-template-columns:3fr 2fr;gap:20px;margin-bottom:24px">
      <!-- LINE CHART -->
      <div class="card-white">
        <div style="font-size:15px;font-weight:700;color:#111827;margin-bottom:20px;font-family:'Plus Jakarta Sans',sans-serif">Évolution des avis</div>
        <svg width="100%" height="180" viewBox="0 0 500 180" preserveAspectRatio="none">
          <defs>
            <linearGradient id="grad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#2563EB" stop-opacity="0.15"/>
              <stop offset="100%" stop-color="#2563EB" stop-opacity="0.01"/>
            </linearGradient>
          </defs>
          <line x1="0" y1="30" x2="500" y2="30" stroke="#F3F4F6" stroke-width="1"/>
          <line x1="0" y1="70" x2="500" y2="70" stroke="#F3F4F6" stroke-width="1"/>
          <line x1="0" y1="110" x2="500" y2="110" stroke="#F3F4F6" stroke-width="1"/>
          <line x1="0" y1="150" x2="500" y2="150" stroke="#F3F4F6" stroke-width="1"/>
          <path d="M 20 120 C 80 110 100 100 140 90 C 180 80 200 95 240 75 C 280 55 300 45 340 35 C 380 25 420 30 470 20 L 470 170 L 20 170 Z" fill="url(#grad)"/>
          <path d="M 20 120 C 80 110 100 100 140 90 C 180 80 200 95 240 75 C 280 55 300 45 340 35 C 380 25 420 30 470 20" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="20" cy="120" r="4" fill="#fff" stroke="#2563EB" stroke-width="2"/>
          <circle cx="140" cy="90" r="4" fill="#fff" stroke="#2563EB" stroke-width="2"/>
          <circle cx="240" cy="75" r="4" fill="#fff" stroke="#2563EB" stroke-width="2"/>
          <circle cx="340" cy="35" r="4" fill="#fff" stroke="#2563EB" stroke-width="2"/>
          <circle cx="470" cy="20" r="5" fill="#2563EB" stroke="#fff" stroke-width="2"/>
          <text x="10" y="175" fill="#9CA3AF" font-size="10" font-family="Plus Jakarta Sans">Jan</text>
          <text x="88" y="175" fill="#9CA3AF" font-size="10" font-family="Plus Jakarta Sans">Fév</text>
          <text x="168" y="175" fill="#9CA3AF" font-size="10" font-family="Plus Jakarta Sans">Mar</text>
          <text x="248" y="175" fill="#9CA3AF" font-size="10" font-family="Plus Jakarta Sans">Avr</text>
          <text x="328" y="175" fill="#9CA3AF" font-size="10" font-family="Plus Jakarta Sans">Mai</text>
          <text x="455" y="175" fill="#2563EB" font-size="10" font-family="Plus Jakarta Sans" font-weight="600">Juin</text>
        </svg>
      </div>

      <!-- DONUT -->
      <div class="card-white">
        <div style="font-size:15px;font-weight:700;color:#111827;margin-bottom:20px;font-family:'Plus Jakarta Sans',sans-serif">Répartition des avis</div>
        <div style="display:flex;justify-content:center;margin-bottom:16px">
          <svg width="140" height="140" viewBox="0 0 140 140">
            <circle cx="70" cy="70" r="52" fill="none" stroke="#F3F4F6" stroke-width="16"/>
            <circle cx="70" cy="70" r="52" fill="none" stroke="#10B981" stroke-width="16" stroke-dasharray="163 163" stroke-dashoffset="82" transform="rotate(-90 70 70)"/>
            <circle cx="70" cy="70" r="52" fill="none" stroke="#34D399" stroke-width="16" stroke-dasharray="98 228" stroke-dashoffset="-81" transform="rotate(-90 70 70)"/>
            <circle cx="70" cy="70" r="52" fill="none" stroke="#FCD34D" stroke-width="16" stroke-dasharray="39 287" stroke-dashoffset="-179" transform="rotate(-90 70 70)"/>
            <circle cx="70" cy="70" r="52" fill="none" stroke="#F87171" stroke-width="16" stroke-dasharray="26 300" stroke-dashoffset="-218" transform="rotate(-90 70 70)"/>
            <text x="70" y="64" text-anchor="middle" fill="#111827" font-size="20" font-weight="700" font-family="Plus Jakarta Sans">80%</text>
            <text x="70" y="82" text-anchor="middle" fill="#10B981" font-size="11" font-weight="600" font-family="Plus Jakarta Sans">Positifs</text>
          </svg>
        </div>
        <div style="font-size:12px;color:#6B7280;text-align:center;margin-bottom:12px;font-family:'Plus Jakarta Sans',sans-serif">Sur 24 avis collectés</div>
        ${[
          {color:'#10B981',label:'5 étoiles',count:'12 (50%)',emoji:'😊'},
          {color:'#34D399',label:'4 étoiles',count:'7 (29%)',emoji:'😊'},
          {color:'#FCD34D',label:'3 étoiles',count:'3 (13%)',emoji:'😐'},
          {color:'#F87171',label:'1-2 étoiles',count:'2 (8%)',emoji:'😞'},
        ].map(r => `
          <div style="display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-top:1px solid #F9FAFB">
            <div style="display:flex;align-items:center;gap:7px">
              <span style="font-size:13px">${r.emoji}</span>
              <div style="width:8px;height:8px;border-radius:50%;background:${r.color}"></div>
              <span style="font-size:12px;color:#374151;font-family:'Plus Jakarta Sans',sans-serif">${r.label}</span>
            </div>
            <span style="font-size:12px;font-weight:600;color:#111827;font-family:'Plus Jakarta Sans',sans-serif">${r.count}</span>
          </div>
        `).join('')}
      </div>
    </div>

    <!-- AVIS TABLE -->
    <div class="card-white">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
        <div style="font-size:15px;font-weight:700;color:#111827;font-family:'Plus Jakarta Sans',sans-serif">Derniers avis patients</div>
        <span onclick="showPage('avis')" style="font-size:13px;color:#2563EB;font-weight:600;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif">Voir tout →</span>
      </div>
      ${renderAvisTable(4)}
    </div>
  `;

  // Calendar dropdown close on outside click
  document.addEventListener('click', function(e) {
    const dd = document.getElementById('period-dropdown');
    const btn = document.getElementById('period-btn');
    if (dd && btn && !btn.contains(e.target) && !dd.contains(e.target)) {
      dd.style.display = 'none';
    }
  });
}

function togglePeriod() {
  const dd = document.getElementById('period-dropdown');
  if (dd) dd.style.display = dd.style.display === 'none' ? 'block' : 'none';
}

function selectPeriod(opt) {
  const lbl = document.getElementById('period-label');
  if (lbl) lbl.textContent = opt;
  const dd = document.getElementById('period-dropdown');
  if (dd) dd.style.display = 'none';
  showToast('Période : ' + opt, 'info');
}

// ── AVIS TABLE ──
function renderAvisTable(limit = 10) {
  const avis = [
    {init:'AK',nom:'Ahmed K.',date:"Aujourd'hui",stars:5,text:"Excellent cabinet, très à l'écoute.",positive:true},
    {init:'FB',nom:'Fatima B.',date:'Hier',stars:5,text:'Très bonne expérience, personnel accueillant.',positive:true},
    {init:'MR',nom:'Mohamed R.',date:'Il y a 2 jours',stars:3,text:'Attente longue mais médecin compétent.',positive:true},
    {init:'SS',nom:'Sara S.',date:'Il y a 3 jours',stars:2,text:'Rendez-vous annulé sans prévenir.',positive:false},
    {init:'YA',nom:'Youssef A.',date:'Il y a 4 jours',stars:5,text:'Cabinet moderne et très professionnel.',positive:true},
  ].slice(0, limit);

  return `<table style="width:100%;border-collapse:collapse">
    <thead><tr>
      ${['Patient','Note','Commentaire','Date','Statut'].map(h =>
        `<th style="text-align:left;font-size:11px;font-weight:600;color:#9CA3AF;text-transform:uppercase;letter-spacing:0.05em;padding:0 0 10px;font-family:'Plus Jakarta Sans',sans-serif">${h}</th>`
      ).join('')}
    </tr></thead>
    <tbody>${avis.map(a => `
      <tr style="border-top:1px solid #F9FAFB">
        <td style="padding:12px 0;vertical-align:middle">
          <div style="display:flex;align-items:center;gap:10px">
            <div style="width:34px;height:34px;border-radius:50%;background:#EFF6FF;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#2563EB;font-family:'Plus Jakarta Sans',sans-serif">${a.init}</div>
            <span style="font-size:13px;font-weight:600;color:#111827;font-family:'Plus Jakarta Sans',sans-serif">${a.nom}</span>
          </div>
        </td>
        <td style="padding:12px;font-size:13px;vertical-align:middle">${'⭐'.repeat(a.stars)}</td>
        <td style="padding:12px;font-size:13px;color:#6B7280;max-width:260px;vertical-align:middle;font-family:'Plus Jakarta Sans',sans-serif">${a.text}</td>
        <td style="padding:12px;font-size:12px;color:#9CA3AF;white-space:nowrap;vertical-align:middle;font-family:'Plus Jakarta Sans',sans-serif">${a.date}</td>
        <td style="padding:12px 0;vertical-align:middle">
          <span style="padding:4px 10px;border-radius:99px;font-size:11px;font-weight:600;background:${a.positive?'#F0FDF4':'#FFF1F2'};color:${a.positive?'#15803D':'#BE123C'};font-family:'Plus Jakarta Sans',sans-serif">
            ${a.positive ? 'Positif' : '⚠ Négatif'}
          </span>
        </td>
      </tr>
    `).join('')}</tbody>
  </table>`;
}

// ── AVIS PAGE ──
function renderAvis() {
  document.getElementById('main-content').innerHTML = `
    <div style="margin-bottom:24px">
      
      <div style="width:40px;height:3px;background:#2563EB;border-radius:2px;margin-top:6px"></div>
    </div>
    <div class="card-white">${renderAvisTable(10)}</div>
  `;
}

// ── STATS PAGE ──
function renderStats() {
  document.getElementById('main-content').innerHTML = `
    <div style="margin-bottom:24px">
      
      <div style="width:40px;height:3px;background:#2563EB;border-radius:2px;margin-top:6px"></div>
      <div style="font-size:14px;color:#6B7280;margin-top:8px;font-family:'Plus Jakarta Sans',sans-serif">Évolution de votre réputation en ligne</div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px">
      ${[
        {val:'3.7',lbl:'Note actuelle',sub:'sur 5.0',icon:'⭐'},
        {val:'+0.3',lbl:'Évolution',sub:'30 derniers jours',icon:'📈'},
        {val:'24',lbl:'Total avis',sub:'depuis le début',icon:'💬'},
        {val:'67%',lbl:'Taux réponse',sub:'Excellent',icon:'✅'},
      ].map(k => `
        <div class="card-white">
          <div style="font-size:22px;margin-bottom:12px">${k.icon}</div>
          <div style="font-size:30px;font-weight:700;color:#111827;font-family:'Plus Jakarta Sans',sans-serif;line-height:1;margin-bottom:6px">${k.val}</div>
          <div style="font-size:13px;font-weight:600;color:#374151;font-family:'Plus Jakarta Sans',sans-serif">${k.lbl}</div>
          <div style="font-size:12px;color:#9CA3AF;font-family:'Plus Jakarta Sans',sans-serif;margin-top:2px">${k.sub}</div>
        </div>
      `).join('')}
    </div>
    <div class="card-white">
      <div style="font-size:15px;font-weight:700;color:#111827;margin-bottom:24px;font-family:'Plus Jakarta Sans',sans-serif">Progression mensuelle</div>
      <div style="display:flex;align-items:flex-end;justify-content:space-around;height:160px;border-bottom:1px solid #F3F4F6;padding-bottom:12px;margin-bottom:12px" id="chart-bars"></div>
      <div style="display:flex;justify-content:space-around">
        ${['Jan','Fév','Mar','Avr','Mai'].map(m =>
          `<div style="font-size:12px;color:#9CA3AF;font-family:'Plus Jakarta Sans',sans-serif;text-align:center;flex:1">${m}</div>`
        ).join('')}
      </div>
    </div>
  `;

  setTimeout(() => {
    const chart = document.getElementById('chart-bars');
    if (!chart) return;
    const vals = [2.8, 3.0, 3.2, 3.5, 3.7];
    const bgs = [
      'linear-gradient(180deg,#BFDBFE,#DBEAFE)',
      'linear-gradient(180deg,#93C5FD,#BFDBFE)',
      'linear-gradient(180deg,#60A5FA,#93C5FD)',
      'linear-gradient(180deg,#3B82F6,#60A5FA)',
      'linear-gradient(180deg,#1D4ED8,#2563EB)',
    ];
    chart.innerHTML = vals.map((v, i) => {
      const h = Math.round((v / 5) * 140);
      return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;padding:0 8px">
        <div style="font-size:12px;font-weight:700;color:${i===4?'#1D4ED8':'#6B7280'};font-family:'Plus Jakarta Sans',sans-serif">${v}</div>
        <div style="width:100%;border-radius:8px 8px 0 0;height:${h}px;background:${bgs[i]}"></div>
      </div>`;
    }).join('');
  }, 100);
}
</script>
</body>
</html>
