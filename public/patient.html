<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MediPulse - Votre avis</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:#F7F8FC}
body{font-family:'Plus Jakarta Sans',sans-serif;padding:24px 20px 40px;max-width:480px;margin:0 auto}

.step-label{text-align:center;font-size:12px;font-weight:600;color:#94A3B8;letter-spacing:0.04em;margin-bottom:10px}
.progress-bar{height:4px;background:#E8EDF5;border-radius:99px;margin-bottom:28px;overflow:hidden}
.progress-fill{height:100%;background:#1E5FCC;border-radius:99px;transition:width 0.4s ease}

.cab-card{display:flex;align-items:center;gap:14px;background:#fff;border-radius:16px;padding:14px 16px;margin-bottom:32px;box-shadow:0 1px 3px rgba(15,23,42,0.06),0 0 0 1px rgba(15,23,42,0.04)}
.cab-icon-wrap{width:44px;height:44px;border-radius:12px;background:#EEF4FF;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cab-icon-wrap svg{color:#1E5FCC;width:22px;height:22px}
.cab-name{font-size:14px;font-weight:700;color:#0A1628;line-height:1.3}
.cab-spec{font-size:12px;color:#64748B;margin-top:3px}
.cab-dot{color:#94A3B8;margin:0 4px}

.q-title{font-size:28px;font-weight:800;color:#0A1628;line-height:1.2;letter-spacing:-0.6px;margin-bottom:10px}
.q-sub{font-size:15px;color:#64748B;line-height:1.6;margin-bottom:28px}

.choices{display:flex;flex-direction:column;gap:12px;margin-bottom:28px}
.choice-btn{display:flex;align-items:center;gap:16px;padding:18px 18px;border-radius:20px;border:1.5px solid transparent;cursor:pointer;transition:all 0.15s;background:#fff;box-shadow:0 1px 3px rgba(15,23,42,0.06),0 0 0 1px rgba(15,23,42,0.04);width:100%;text-align:left;font-family:'Plus Jakarta Sans',sans-serif}
.choice-btn:active{transform:scale(0.98)}
.choice-btn.pos{background:#F0FDF4;box-shadow:none;border-color:#BBF7D0}
.choice-btn.mid{background:#FFFBEB;box-shadow:none;border-color:#FDE68A}
.choice-btn.neg{background:#FFF1F2;box-shadow:none;border-color:#FECDD3}
.face-wrap{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.face-wrap.pos{background:#DCFCE7}
.face-wrap.mid{background:#FEF9C3}
.face-wrap.neg{background:#FFE4E6}
.face-wrap svg{width:26px;height:26px}
.choice-text{flex:1}
.choice-label{font-size:16px;font-weight:700;color:#0A1628}
.choice-desc{font-size:12px;color:#94A3B8;margin-top:3px}
.choice-arrow{font-size:20px;color:#CBD5E1;font-weight:300;flex-shrink:0}

.privacy-note{display:flex;align-items:flex-start;gap:12px;background:#EEF4FF;border-radius:14px;padding:14px 16px}
.privacy-icon{width:32px;height:32px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.privacy-icon svg{color:#1E5FCC;width:16px;height:16px}
.privacy-text{font-size:12px;color:#3B5BA0;line-height:1.6}

.result-wrap{padding-top:8px}
.result-icon-big{width:72px;height:72px;border-radius:22px;display:flex;align-items:center;justify-content:center;margin:0 0 24px}
.result-icon-big.pos{background:#F0FDF4;border:1.5px solid #BBF7D0}
.result-icon-big.pos svg{color:#16A34A;width:36px;height:36px}
.result-icon-big.neg{background:#FFF1F2;border:1.5px solid #FECDD3}
.result-icon-big.neg svg{color:#DC2626;width:36px;height:36px}
.result-icon-big.done{background:#F0F9FF;border:1.5px solid #BAE6FD}
.result-icon-big.done svg{color:#0284C7;width:36px;height:36px}
.result-title{font-size:26px;font-weight:800;color:#0A1628;line-height:1.2;letter-spacing:-0.5px;margin-bottom:10px}
.result-body{font-size:14px;color:#64748B;line-height:1.7;margin-bottom:28px}

.google-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:18px;border-radius:18px;background:#1A73E8;color:#fff;font-size:15px;font-weight:700;text-decoration:none;border:none;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;letter-spacing:-0.2px;margin-bottom:12px;transition:all 0.15s}
.google-btn:active{transform:scale(0.98);background:#1557B0}
.google-btn svg{width:20px;height:20px;flex-shrink:0}

.skip-btn{width:100%;padding:15px;border-radius:16px;background:transparent;border:1.5px solid #E2E8F0;color:#94A3B8;font-size:13px;font-weight:600;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;transition:all 0.15s}
.skip-btn:active{background:#F8FAFC}

.loading-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 0;gap:16px}
.spinner{width:32px;height:32px;border:3px solid #E8EDF5;border-top-color:#1E5FCC;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:14px;color:#94A3B8;font-weight:500}

.medipulse-footer{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:32px;font-size:11px;color:#CBD5E1;font-weight:500}
.medipulse-footer svg{color:#CBD5E1;width:13px;height:13px}

[dir="rtl"] .choice-btn{flex-direction:row-reverse;text-align:right}
[dir="rtl"] .choice-arrow{transform:rotate(180deg)}
[dir="rtl"] .cab-card{flex-direction:row-reverse;text-align:right}
[dir="rtl"] .privacy-note{flex-direction:row-reverse;text-align:right}
[dir="rtl"] .q-title,[dir="rtl"] .q-sub{text-align:right}
</style>
</head>
<body>

<div id="screen-loading" class="loading-wrap">
  <div class="spinner"></div>
  <div class="loading-text" id="loading-text">Chargement...</div>
</div>

<div id="screen-main" style="display:none">

  <div class="step-label" id="step-label">Etape 1 sur 2</div>
  <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:50%"></div></div>

  <div class="cab-card" id="cab-card" style="display:none">
    <div class="cab-icon-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/><line x1="12" y1="12" x2="12" y2="16"/><line x1="10" y1="14" x2="14" y2="14"/></svg>
    </div>
    <div>
      <div class="cab-name" id="cab-name"></div>
      <div class="cab-spec" id="cab-spec"></div>
    </div>
  </div>

  <div id="view-question">
    <div class="q-title" id="q-title"></div>
    <div class="q-sub" id="q-sub"></div>
    <div class="choices">
      <button class="choice-btn" id="btn-pos" onclick="repondre('positif')">
        <div class="face-wrap pos">
          <svg viewBox="0 0 24 24" fill="none" stroke="#16A34A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 13s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
        </div>
        <div class="choice-text">
          <div class="choice-label" id="lbl-pos"></div>
          <div class="choice-desc" id="desc-pos"></div>
        </div>
        <span class="choice-arrow">›</span>
      </button>
      <button class="choice-btn" id="btn-mid" onclick="repondre('neutre')">
        <div class="face-wrap mid">
          <svg viewBox="0 0 24 24" fill="none" stroke="#D97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
        </div>
        <div class="choice-text">
          <div class="choice-label" id="lbl-mid"></div>
          <div class="choice-desc" id="desc-mid"></div>
        </div>
        <span class="choice-arrow">›</span>
      </button>
      <button class="choice-btn" id="btn-neg" onclick="repondre('negatif')">
        <div class="face-wrap neg">
          <svg viewBox="0 0 24 24" fill="none" stroke="#DC2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M16 16s-1.5-2-4-2-4 2-4 2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
        </div>
        <div class="choice-text">
          <div class="choice-label" id="lbl-neg"></div>
          <div class="choice-desc" id="desc-neg"></div>
        </div>
        <span class="choice-arrow">›</span>
      </button>
    </div>
    <div class="privacy-note">
      <div class="privacy-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
      </div>
      <div class="privacy-text" id="privacy-text"></div>
    </div>
  </div>

  <div id="view-positif" style="display:none">
    <div class="result-wrap">
      <div class="result-icon-big pos">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      </div>
      <div class="result-title" id="pos-title"></div>
      <div class="result-body" id="pos-body"></div>
      <a href="#" id="google-link" class="google-btn" target="_blank" onclick="marquerAvisLaisse()">
        <svg viewBox="0 0 24 24" fill="white"><path d="M21.35 11.1H12.18V13.83H18.69C18.36 17.64 15.19 19.27 12.19 19.27C8.36 19.27 5 16.25 5 12C5 7.9 8.2 4.73 12.2 4.73C15.29 4.73 17.1 6.7 17.1 6.7L19 4.72C19 4.72 16.56 2 12.1 2C6.42 2 2.03 6.8 2.03 12C2.03 17.05 6.16 22 12.19 22C17.6 22 21.5 18.33 21.5 12.91C21.5 11.76 21.35 11.1 21.35 11.1Z"/></svg>
        <span id="google-btn-text"></span>
      </a>

    </div>
  </div>

  <div id="view-negatif" style="display:none">
    <div class="result-wrap">
      <div class="result-icon-big neg">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      </div>
      <div class="result-title" id="neg-title"></div>
      <div class="result-body" id="neg-body"></div>
    </div>
  </div>

  <div id="view-done" style="display:none">
    <div class="result-wrap">
      <div class="result-icon-big done">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <div class="result-title" id="done-title"></div>
      <div class="result-body" id="done-body"></div>
    </div>
  </div>

</div>

<div class="medipulse-footer">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
  Propulse par MediPulse
</div>

<script>
var SB_URL = 'https://czttvnvcetgmjfqishig.supabase.co';
var SB_KEY = 'sb_publishable_mRTR9POOteWe_D2YgpucRQ_hMMxNP1m';
var token = null, lang = 'fr', lienGoogle = '';

var T = {
  fr: {
    step1: 'Etape 1 sur 2', step2: 'Etape 2 sur 2',
    loading: 'Chargement...',
    question: 'Comment s\'est passee votre visite ?',
    sub: 'Votre avis nous aide a ameliorer votre experience au quotidien.',
    pos: 'Tres satisfait', posDesc: 'Excellente experience',
    mid: 'Correct', midDesc: 'Experience moyenne',
    neg: 'A ameliorer', negDesc: 'Experience a ameliorer',
    privacy: 'Vos reponses sont confidentielles et nous permettent de mieux vous soigner.',
    posTitle: 'Merci pour votre confiance !',
    posBody: 'Votre retour positif compte enormement pour nous. Pourriez-vous partager votre experience sur Google ? Cela aide d\'autres patients a trouver le bon medecin.',
    googleBtn: 'Laisser un avis Google',
    skip: 'Non merci, continuer sans laisser d\'avis',
    negTitle: 'Merci pour votre honnetete',
    negBody: 'Nous prenons votre retour tres au serieux. Le cabinet sera informe afin d\'ameliorer votre prochaine experience.',
    doneTitle: 'Merci !',
    doneBody: 'Votre avis a bien ete enregistre. Bonne journee !'
  },
  ar: {
    step1: 'الخطوة 1 من 2', step2: 'الخطوة 2 من 2',
    loading: 'جار التحميل...',
    question: 'كيف كانت زيارتكم ؟',
    sub: 'رأيكم يساعدنا على تحسين تجربتكم يوميا.',
    pos: 'راضٍ جداً', posDesc: 'تجربة ممتازة',
    mid: 'مقبول', midDesc: 'تجربة متوسطة',
    neg: 'غير راضٍ', negDesc: 'تجربة تحتاج تحسين',
    privacy: 'إجاباتكم سرية تماماً وتساعدنا على تقديم رعاية أفضل لكم.',
    posTitle: 'شكراً على ثقتكم !',
    posBody: 'رأيكم الإيجابي يعني لنا الكثير. هل يمكنكم مشاركة تجربتكم على Google ؟ سيساعد ذلك المرضى الآخرين في اختيار الطبيب المناسب.',
    googleBtn: 'ترك تقييم على Google',
    skip: 'لا شكراً، المتابعة بدون تقييم',
    negTitle: 'شكراً على صراحتكم',
    negBody: 'نأخذ ملاحظاتكم بجدية تامة. سيتم إبلاغ العيادة لتحسين تجربتكم القادمة.',
    doneTitle: 'شكراً !',
    doneBody: 'تم تسجيل رأيكم بنجاح. نتمنى لكم يوماً سعيداً !'
  }
};

function set(id, val) { var e = document.getElementById(id); if(e) e.textContent = val; }
function showView(id) {
  ['view-question','view-positif','view-negatif','view-done'].forEach(function(v) {
    var e = document.getElementById(v); if(e) e.style.display = 'none';
  });
  var e = document.getElementById(id); if(e) e.style.display = 'block';
}

async function init() {
  var params = new URLSearchParams(window.location.search);
  token = params.get('token');
  lang = params.get('lang') || 'fr';
  var t = T[lang] || T.fr;

  if (lang === 'ar') {
    document.body.setAttribute('dir', 'rtl');
    document.documentElement.lang = 'ar';
  }

  set('loading-text', t.loading);

  if (!token) {
    showResult('done', t);
    return;
  }

  try {
    var r = await fetch(SB_URL + '/rest/v1/envois_whatsapp?feedback_token=eq.' + token + '&select=*', {
      headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY }
    });
    var data = await r.json();

    if (!data || !data.length) { showResult('done', t); return; }
    var envoi = data[0];
    if (envoi.feedback_completed) { showResult('done', t); return; }

    if (envoi.cabinet_id) {
      var cr = await fetch(SB_URL + '/rest/v1/cabinets?id=eq.' + envoi.cabinet_id + '&select=*', {
        headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY }
      });
      var cab = await cr.json();
      if (cab && cab.length) {
        var c = cab[0];
        lienGoogle = c.lien_google || c.google_url || '';
        set('cab-name', c.nom_cabinet || '');
        set('cab-spec', (c.specialite || '') + (c.ville ? '  \u2022  ' + c.ville : ''));
        document.getElementById('cab-card').style.display = 'flex';
      }
    }

    set('step-label', t.step1);
    document.getElementById('progress-fill').style.width = '50%';
    set('q-title', t.question);
    set('q-sub', t.sub);
    set('lbl-pos', t.pos); set('desc-pos', t.posDesc);
    set('lbl-mid', t.mid); set('desc-mid', t.midDesc);
    set('lbl-neg', t.neg); set('desc-neg', t.negDesc);
    set('privacy-text', t.privacy);

    document.getElementById('screen-loading').style.display = 'none';
    document.getElementById('screen-main').style.display = 'block';
    showView('view-question');

  } catch(e) {
    console.error(e);
    showResult('done', T[lang] || T.fr);
  }
}

function showResult(type, t) {
  document.getElementById('screen-loading').style.display = 'none';
  document.getElementById('screen-main').style.display = 'block';
  set('step-label', t.step2);
  document.getElementById('progress-fill').style.width = '100%';
  set('done-title', t.doneTitle);
  set('done-body', t.doneBody);
  showView('view-' + type);
}

async function patch(body) {
  try {
    await fetch(SB_URL + '/rest/v1/envois_whatsapp?feedback_token=eq.' + token, {
      method: 'PATCH',
      headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
      body: JSON.stringify(body)
    });
  } catch(e) { console.error(e); }
}

async function repondre(sentiment) {
  var t = T[lang] || T.fr;
  var statut = sentiment === 'positif' ? 'positif' : 'negatif';
  await patch({ statut: statut, sentiment: sentiment, feedback_completed: true });

  set('step-label', t.step2);
  document.getElementById('progress-fill').style.width = '100%';

  if (sentiment === 'positif') {
    set('pos-title', t.posTitle);
    set('pos-body', t.posBody);
    set('google-btn-text', t.googleBtn);
    var gl = document.getElementById('google-link');
    if (lienGoogle && gl) {
      gl.href = lienGoogle;
      gl.style.display = 'flex';
    } else if (gl) {
      gl.style.display = 'none';
    }
    showView('view-positif');
  } else {
    set('neg-title', t.negTitle);
    set('neg-body', t.negBody);
    showView('view-negatif');
  }
}

async function marquerAvisLaisse() {
  await patch({ statut: 'google_redirect' });
}

function showDone() {
  var t = T[lang] || T.fr;
  set('done-title', t.doneTitle);
  set('done-body', t.doneBody);
  showView('view-done');
}

init();
</script>
</body>
</html>
