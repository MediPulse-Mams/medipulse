<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediPulse — Assistante</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#f8fafd;--surface:#fff;--surface2:#f1f5fb;--border:#e4ecf7;
  --text:#0a1628;--muted:#6b7fa3;--light:#b0bdd4;
  --primary:#0057ff;--primary-lt:#e6eeff;
  --success:#00c49a;--success-bg:#e6faf5;
  --warn:#f59e0b;--warn-bg:#fef8e7;
  --danger:#ef4444;--danger-bg:#fef2f2;
  --wa:#25D366;--wa-bg:#e8faf0;
}
html,body{min-height:100vh;background:var(--bg);font-family:'Inter',sans-serif;color:var(--text);font-size:14px;}

/* HEADER */
.app-header{background:linear-gradient(135deg,#0a1628,#0d2452);padding:20px 16px;position:relative;overflow:hidden;}
.app-header::before{content:'';position:absolute;right:-30px;top:-30px;width:150px;height:150px;background:radial-gradient(rgba(77,139,255,.2),transparent 70%);}
.app-header-inner{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;}
.logo{display:flex;align-items:center;gap:8px;}
.logo-icon{width:28px;height:28px;background:linear-gradient(135deg,#0057ff,#4d8bff);border-radius:8px;display:grid;place-items:center;}
.logo-icon svg{width:13px;height:13px;stroke:#fff;fill:none;}
.logo-text{font-weight:800;font-size:16px;color:#fff;}
.logo-text em{color:#4d8bff;font-style:normal;}
.cab-name{font-size:12px;color:rgba(255,255,255,.5);margin-top:2px;}
.logout-btn{color:rgba(255,255,255,.4);font-size:12px;cursor:pointer;}

/* STATS BAR */
.stats-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);}
.stat-item{background:var(--surface);padding:14px;text-align:center;}
.stat-val{font-weight:800;font-size:22px;letter-spacing:-1px;line-height:1;margin-bottom:3px;}
.stat-lbl{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;}

/* CONTENT */
.content{padding:16px;max-width:600px;margin:0 auto;}

/* SECTION TITLE */
.section-title{font-weight:800;font-size:15px;letter-spacing:-.3px;margin-bottom:12px;display:flex;align-items:center;gap:8px;}

/* ENVOYER FORM CARD */
.send-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:16px;}
.send-card-title{font-weight:700;font-size:14px;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.field-group{margin-bottom:12px;}
.field-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);display:block;margin-bottom:6px;}
.field-input{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:10px;font-size:14px;font-family:'Inter',sans-serif;outline:none;color:var(--text);background:#fff;}
.field-input:focus{border-color:var(--primary);}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;}
.btn-wa{padding:12px;border:none;border-radius:10px;font-family:'Inter',sans-serif;font-weight:700;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .2s;}
.btn-wa.fr{background:var(--primary);color:#fff;}
.btn-wa.fr:hover{background:#0046cc;}
.btn-wa.ar{background:var(--success);color:#fff;}
.btn-wa.ar:hover{background:#00a07e;}
.btn-wa:active{transform:scale(.97);}

/* PATIENTS LIST */
.patients-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:16px;}
.patients-head{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.patients-head-title{font-weight:700;font-size:13px;}
.filter-tabs{display:flex;gap:6px;}
.filter-tab{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--border);color:var(--muted);background:var(--surface2);}
.filter-tab.active{background:var(--primary);color:#fff;border-color:var(--primary);}

/* PATIENT ROW */
.patient-row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--border);transition:background .12s;}
.patient-row:last-child{border-bottom:none;}
.patient-row:hover{background:var(--surface2);}
.patient-av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff;flex-shrink:0;}
.patient-info{flex:1;min-width:0;}
.patient-name{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.patient-meta{font-size:11px;color:var(--muted);margin-top:2px;}
.patient-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;}
.patient-status{font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;}
.patient-status.sent{background:var(--primary-lt);color:var(--primary);}
.patient-status.replied{background:var(--success-bg);color:var(--success);}
.patient-status.pending{background:var(--warn-bg);color:var(--warn);}
.btn-wa-google{background:var(--wa);color:#fff;border:none;border-radius:8px;padding:5px 10px;font-family:'Inter',sans-serif;font-weight:700;font-size:11px;cursor:pointer;display:flex;align-items:center;gap:4px;white-space:nowrap;}
.btn-wa-google:hover{background:#1ea856;}
.patient-note{font-size:11px;color:var(--warn);font-weight:600;}

/* EMPTY STATE */
.empty-state{padding:32px;text-align:center;color:var(--muted);}
.empty-state-icon{font-size:36px;margin-bottom:10px;}
.empty-state-text{font-size:13px;}

/* NOTIF */
.notif{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0a1628;color:#fff;padding:10px 20px;border-radius:12px;font-size:13px;font-weight:600;z-index:999;box-shadow:0 8px 24px rgba(0,0,0,.2);white-space:nowrap;opacity:0;transition:opacity .3s;}
.notif.show{opacity:1;}

/* LOADING */
.loading{display:flex;align-items:center;justify-content:center;padding:40px;color:var(--muted);}
.spinner{width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite;margin-right:10px;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<!-- HEADER -->
<div class="app-header">
  <div class="app-header-inner">
    <div>
      <div class="logo">
        <div class="logo-icon"><svg viewBox="0 0 24 24" stroke-width="2.5"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg></div>
        <span class="logo-text">Medi<em>Pulse</em></span>
      </div>
      <div class="cab-name" id="cab-name">Chargement...</div>
    </div>
    <div class="logout-btn" onclick="window.location.href='/'">⏻ Déconnexion</div>
  </div>
</div>

<!-- STATS BAR -->
<div class="stats-bar">
  <div class="stat-item"><div class="stat-val" id="stat-envoyes" style="color:var(--primary)">0</div><div class="stat-lbl">Envoyés</div></div>
  <div class="stat-item"><div class="stat-val" id="stat-reponses" style="color:var(--success)">0</div><div class="stat-lbl">Réponses</div></div>
  <div class="stat-item"><div class="stat-val" id="stat-google" style="color:var(--wa)">0</div><div class="stat-lbl">Avis Google</div></div>
</div>

<!-- CONTENT -->
<div class="content">

  <!-- ENVOYER FORM -->
  <div class="send-card">
    <div class="send-card-title">📤 Envoyer un formulaire patient</div>
    <div class="field-group">
      <label class="field-label">Nom du patient</label>
      <input id="patient-nom" class="field-input" type="text" placeholder="Ex: Ahmed Benali">
    </div>
    <div class="field-group">
      <label class="field-label">Numéro WhatsApp</label>
      <input id="patient-tel" class="field-input" type="tel" placeholder="Ex: 0612345678">
    </div>
    <div class="btn-row">
      <button class="btn-wa fr" onclick="envoyerForm('FR')">
        🇫🇷 Envoyer FR
      </button>
      <button class="btn-wa ar" onclick="envoyerForm('AR')">
        🇲🇦 إرسال AR
      </button>
    </div>
  </div>

  <!-- LISTE PATIENTS -->
  <div class="section-title">
    👥 Mes patients aujourd'hui
    <span id="patients-count" style="font-size:12px;color:var(--muted);font-weight:500"></span>
  </div>

  <div class="patients-card">
    <div class="patients-head">
      <div class="patients-head-title">Suivi des formulaires</div>
      <div class="filter-tabs">
        <div class="filter-tab active" onclick="filterPatients('tous',this)">Tous</div>
        <div class="filter-tab" onclick="filterPatients('replied',this)">✅ Répondu</div>
        <div class="filter-tab" onclick="filterPatients('sent',this)">⏳ En attente</div>
      </div>
    </div>
    <div id="patients-list">
      <div class="loading"><div class="spinner"></div>Chargement...</div>
    </div>
  </div>

</div>

<!-- NOTIF -->
<div class="notif" id="notif"></div>

<script>
const GOOGLE_API_KEY = 'AIzaSyCy3jfMxuWxeQXE0L7rLm3AZbNwCQegneM';
const urlParams = new URLSearchParams(window.location.search);
const SHEET_ID = urlParams.get('sheet') || '';

let gConfig = {nomCabinet:'Mon Cabinet', formFR:'', formAR:'', lienGoogle:''};
let patients = [];
let currentFilter = 'tous';

// Couleurs avatars
const COLORS = ['#0057ff','#00c49a','#f59e0b','#7c3aed','#ec4899','#ef4444'];

// ── INIT ──
async function init() {
  if(!SHEET_ID) {
    document.getElementById('cab-name').textContent = '⚠️ Lien invalide';
    document.getElementById('patients-list').innerHTML = '<div class="empty-state"><div class="empty-state-icon">⚠️</div><div class="empty-state-text">Lien invalide — contactez votre responsable</div></div>';
    return;
  }
  await loadConfig();
  await loadPatients();
  // Refresh toutes les 30 secondes
  setInterval(loadPatients, 30000);
}

// ── CHARGER CONFIG ──
async function loadConfig() {
  try {
    const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/Config%20MediPulse!A1:B10?key=${GOOGLE_API_KEY}`;
    const res = await fetch(url);
    const data = await res.json();
    if(data.values) {
      data.values.forEach(row => {
        if(row[0]==='Nom Cabinet') gConfig.nomCabinet = row[1]||'Mon Cabinet';
        if(row[0]==='Form FR') gConfig.formFR = row[1]||'';
        if(row[0]==='Form AR') gConfig.formAR = row[1]||'';
        if(row[0]==='Lien Google') gConfig.lienGoogle = row[1]||'';
      });
    }
    document.getElementById('cab-name').textContent = '🏥 ' + gConfig.nomCabinet;
    document.title = 'MediPulse — ' + gConfig.nomCabinet;
  } catch(e) {
    document.getElementById('cab-name').textContent = 'Cabinet';
  }
}

// ── CHARGER PATIENTS DEPUIS SHEET ──
async function loadPatients() {
  try {
    // Charger toutes les feuilles sauf Config
    const sheetsUrl = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}?key=${GOOGLE_API_KEY}`;
    const sheetsRes = await fetch(sheetsUrl);
    const sheetsData = await sheetsRes.json();
    let allRows = [];

    if(sheetsData.sheets) {
      for(const sheet of sheetsData.sheets) {
        if(sheet.properties.title === 'Config MediPulse') continue;
        try {
          const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(sheet.properties.title)}!A:G?key=${GOOGLE_API_KEY}`;
          const res = await fetch(url);
          const data = await res.json();
          if(data.values && data.values.length > 1) {
            allRows = [...allRows, ...data.values.slice(1).map(r => ({
              horodateur: r[0]||'',
              nom: r[1]||'Patient',
              note: parseInt(r[2])||0,
              commentaire: r[3]||'',
              intention: r[4]||'',
              langue: r[5]||'FR',
              alerte: r[6]||''
            }))];
          }
        } catch(e) {}
      }
    }

    // Trier par date décroissante
    allRows.sort((a,b) => new Date(b.horodateur) - new Date(a.horodateur));

    // Patients envoyés aujourd'hui depuis localStorage
    const envoisAujourdhui = getEnvoisAujourdhui();

    // Fusionner envois + réponses
    patients = mergePatients(envoisAujourdhui, allRows);

    updateStats(allRows, envoisAujourdhui);
    renderPatients();

  } catch(e) {
    console.error('Erreur:', e);
  }
}

// ── FUSIONNER ENVOIS + REPONSES ──
function mergePatients(envois, reponses) {
  const list = [];

  // Ajouter les envois
  envois.forEach(e => {
    const reponse = reponses.find(r =>
      r.nom.toLowerCase().includes(e.nom.toLowerCase()) ||
      e.nom.toLowerCase().includes(r.nom.toLowerCase())
    );
    if(reponse) {
      list.push({...e, status: 'replied', note: reponse.note, intention: reponse.intention, commentaire: reponse.commentaire});
    } else {
      list.push({...e, status: 'sent'});
    }
  });

  return list;
}

// ── STATS ──
function updateStats(reponses, envois) {
  const aujourd = new Date();
  const debutJour = new Date(aujourd.getFullYear(), aujourd.getMonth(), aujourd.getDate());
  const repAujourd = reponses.filter(r => new Date(r.horodateur) >= debutJour);
  const google = reponses.filter(r => String(r.intention).includes('Oui'));

  document.getElementById('stat-envoyes').textContent = envois.length;
  document.getElementById('stat-reponses').textContent = repAujourd.length;
  document.getElementById('stat-google').textContent = google.length;
  document.getElementById('patients-count').textContent = `(${envois.length} aujourd'hui)`;
}

// ── RENDER PATIENTS ──
function renderPatients() {
  const container = document.getElementById('patients-list');
  let filtered = patients;
  if(currentFilter === 'replied') filtered = patients.filter(p => p.status === 'replied');
  if(currentFilter === 'sent') filtered = patients.filter(p => p.status === 'sent');

  if(!filtered.length) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">${currentFilter==='tous'?'📋':'🔍'}</div>
        <div class="empty-state-text">${currentFilter==='tous'?'Aucun patient envoyé aujourd\'hui':'Aucun patient dans cette catégorie'}</div>
      </div>`;
    return;
  }

  container.innerHTML = filtered.map((p, i) => {
    const color = COLORS[i % COLORS.length];
    const initials = p.nom.split(' ').map(w=>w[0]).join('').substring(0,2).toUpperCase();
    const stars = p.note ? '⭐'.repeat(Math.min(5,p.note)) : '';
    const veutGoogle = p.intention && String(p.intention).includes('Oui');

    let statusHtml = '';
    let actionHtml = '';

    if(p.status === 'replied') {
      statusHtml = `<span class="patient-status replied">✅ Répondu</span>`;
      if(veutGoogle && gConfig.lienGoogle) {
        const msg = `Bonjour ${p.nom} 😊\n\nMerci pour votre visite au ${gConfig.nomCabinet} !\n\nPourriez-vous nous laisser un avis Google ? Cela prend 30 secondes 🙏\n\n⭐ Cliquez ici :\n${gConfig.lienGoogle}\n\nMerci infiniment !`;
        const lienWA = `https://wa.me/${formatTel(p.tel)}?text=${encodeURIComponent(msg)}`;
        actionHtml = `<button class="btn-wa-google" onclick="window.open('${lienWA}','_blank')">📲 Avis Google</button>`;
      }
    } else {
      statusHtml = `<span class="patient-status sent">⏳ En attente</span>`;
    }

    return `
      <div class="patient-row" data-status="${p.status}">
        <div class="patient-av" style="background:${color}">${initials}</div>
        <div class="patient-info">
          <div class="patient-name">${p.nom}</div>
          <div class="patient-meta">${p.langue==='AR'?'🇲🇦 Arabe':'🇫🇷 Français'} · ${p.heure||'Aujourd\'hui'} ${stars?'· '+stars:''}</div>
          ${p.commentaire?`<div class="patient-meta" style="margin-top:2px;font-style:italic">"${p.commentaire.substring(0,40)}..."</div>`:''}
        </div>
        <div class="patient-right">
          ${statusHtml}
          ${actionHtml}
        </div>
      </div>`;
  }).join('');
}

// ── FILTER ──
function filterPatients(filter, el) {
  currentFilter = filter;
  document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderPatients();
}

// ── ENVOYER FORM ──
function envoyerForm(langue) {
  const nom = document.getElementById('patient-nom').value.trim();
  const tel = document.getElementById('patient-tel').value.trim();

  if(!nom || !tel) {
    showNotif('❌ Remplissez le nom et le numéro !');
    return;
  }

  const lienForm = langue === 'FR' ? gConfig.formFR : gConfig.formAR;
  if(!lienForm) {
    showNotif('❌ Lien formulaire non configuré !');
    return;
  }

  const msgFR = `Bonjour ${nom} 😊\n\nMerci pour votre visite au ${gConfig.nomCabinet} !\n\nPourriez-vous prendre 30 secondes pour donner votre avis sur votre consultation ? Cela nous aide beaucoup 🙏\n\n${lienForm}`;
  const msgAR = `مرحباً ${nom} 😊\n\nشكراً على زيارتكم لـ ${gConfig.nomCabinet} !\n\nهل يمكنكم تخصيص 30 ثانية لتقييم تجربتكم ؟ رأيكم يساعدنا كثيراً 🙏\n\n${lienForm}`;
  const msg = langue === 'FR' ? msgFR : msgAR;
  const lienWA = `https://wa.me/${formatTel(tel)}?text=${encodeURIComponent(msg)}`;

  // Sauvegarder dans localStorage
  saveEnvoi({nom, tel, langue, heure: getHeure()});

  // Ouvrir WhatsApp
  window.open(lienWA, '_blank');

  // Reset form
  document.getElementById('patient-nom').value = '';
  document.getElementById('patient-tel').value = '';

  showNotif('✅ WhatsApp ouvert pour ' + nom + ' !');

  // Refresh liste
  setTimeout(loadPatients, 1000);
}

// ── LOCALSTORAGE ENVOIS ──
function saveEnvoi(envoi) {
  const key = 'envois_' + SHEET_ID + '_' + getDateKey();
  const envois = JSON.parse(localStorage.getItem(key) || '[]');
  envois.unshift(envoi);
  localStorage.setItem(key, JSON.stringify(envois));
}

function getEnvoisAujourdhui() {
  const key = 'envois_' + SHEET_ID + '_' + getDateKey();
  return JSON.parse(localStorage.getItem(key) || '[]');
}

function getDateKey() {
  const d = new Date();
  return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
}

function getHeure() {
  const d = new Date();
  return d.getHours()+'h'+String(d.getMinutes()).padStart(2,'0');
}

// ── FORMAT TEL ──
function formatTel(tel) {
  if(!tel) return '';
  tel = tel.replace(/\s/g,'').replace(/-/g,'');
  if(tel.startsWith('0')) tel = '212' + tel.substring(1);
  if(tel.startsWith('+')) tel = tel.substring(1);
  return tel;
}

// ── NOTIF ──
function showNotif(msg) {
  const el = document.getElementById('notif');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3000);
}

init();
</script>
</body>
</html>
