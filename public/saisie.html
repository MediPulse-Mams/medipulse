<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediPulse — Assistante</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#f8fafd;--surface:#fff;--surface2:#f1f5fb;--border:#e4ecf7;
  --text:#0a1628;--muted:#6b7fa3;--light:#b0bdd4;
  --primary:#0057ff;--primary-lt:#e6eeff;
  --success:#00c49a;--success-bg:#e6faf5;
  --warn:#f59e0b;--warn-bg:#fef8e7;
  --danger:#ef4444;--danger-bg:#fef2f2;
  --wa:#25D366;--wa-bg:#e8faf0;
}
html,body{min-height:100vh;background:var(--bg);font-family:'Inter',sans-serif;color:var(--text);font-size:14px;}
.app-header{background:linear-gradient(135deg,#0a1628,#0d2452);padding:16px;position:relative;overflow:hidden;}
.app-header::before{content:'';position:absolute;right:-30px;top:-30px;width:150px;height:150px;background:radial-gradient(rgba(77,139,255,.2),transparent 70%);}
.app-header-inner{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;}
.logo{display:flex;align-items:center;gap:8px;}
.logo-icon{width:28px;height:28px;background:linear-gradient(135deg,#0057ff,#4d8bff);border-radius:8px;display:grid;place-items:center;}
.logo-icon svg{width:13px;height:13px;stroke:#fff;fill:none;}
.logo-text{font-weight:800;font-size:16px;color:#fff;}
.logo-text em{color:#4d8bff;font-style:normal;}
.cab-name{font-size:11px;color:rgba(255,255,255,.5);margin-top:2px;}
.logout-btn{color:rgba(255,255,255,.4);font-size:12px;cursor:pointer;}
.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);}
.stat-item{background:var(--surface);padding:12px 8px;text-align:center;}
.stat-val{font-weight:800;font-size:20px;letter-spacing:-1px;line-height:1;margin-bottom:3px;}
.stat-lbl{font-size:9.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;}
.content{padding:14px;max-width:600px;margin:0 auto;}
.section-title{font-weight:800;font-size:15px;letter-spacing:-.3px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;}
.alertes-box{background:var(--danger-bg);border:1px solid rgba(239,68,68,.2);border-radius:14px;padding:14px;margin-bottom:14px;display:none;}
.alertes-box.show{display:block;}
.alertes-box-title{font-weight:700;font-size:13px;color:var(--danger);margin-bottom:10px;}
.alerte-item{background:#fff;border:1px solid rgba(239,68,68,.15);border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;gap:10px;}
.alerte-item:last-child{margin-bottom:0;}
.alerte-item-info{flex:1;}
.alerte-item-name{font-weight:600;font-size:13px;}
.alerte-item-desc{font-size:11px;color:var(--muted);margin-top:2px;}
.send-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px;}
.send-card-title{font-weight:700;font-size:14px;margin-bottom:12px;}
.field-group{margin-bottom:10px;}
.field-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);display:block;margin-bottom:5px;}
.field-input{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:10px;font-size:14px;font-family:'Inter',sans-serif;outline:none;color:var(--text);background:#fff;}
.field-input:focus{border-color:var(--primary);}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
.btn-form{padding:12px;border:none;border-radius:10px;font-family:'Inter',sans-serif;font-weight:700;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .2s;}
.btn-form.fr{background:var(--primary);color:#fff;}
.btn-form.ar{background:var(--success);color:#fff;}
.btn-form:active{transform:scale(.97);}
.filter-tabs{display:flex;gap:6px;}
.filter-tab{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--border);color:var(--muted);background:var(--surface2);white-space:nowrap;}
.filter-tab.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.patients-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:14px;}
.patient-row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);transition:background .12s;}
.patient-row:last-child{border-bottom:none;}
.patient-row:hover{background:var(--surface2);}
.patient-av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff;flex-shrink:0;}
.patient-info{flex:1;min-width:0;}
.patient-name{font-weight:600;font-size:13px;}
.patient-meta{font-size:11px;color:var(--muted);margin-top:2px;}
.patient-comment{font-size:11px;color:var(--muted);margin-top:2px;font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.patient-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;}
.badge-status{font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap;}
.badge-status.sent{background:var(--primary-lt);color:var(--primary);}
.badge-status.replied-good{background:var(--success-bg);color:var(--success);}
.badge-status.replied-bad{background:var(--danger-bg);color:var(--danger);}
.badge-status.replied-neutral{background:var(--warn-bg);color:var(--warn);}
.btn-wa-google{background:var(--wa);color:#fff;border:none;border-radius:8px;padding:5px 10px;font-family:'Inter',sans-serif;font-weight:700;font-size:11px;cursor:pointer;display:flex;align-items:center;gap:4px;white-space:nowrap;transition:all .2s;}
.btn-wa-google:hover{background:#1ea856;}
.btn-rappel{background:var(--warn-bg);color:var(--warn);border:1px solid rgba(245,158,11,.3);border-radius:8px;padding:5px 10px;font-family:'Inter',sans-serif;font-weight:700;font-size:11px;cursor:pointer;white-space:nowrap;}
.empty-state{padding:28px;text-align:center;color:var(--muted);}
.empty-icon{font-size:32px;margin-bottom:8px;}
.notif{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0a1628;color:#fff;padding:10px 20px;border-radius:12px;font-size:13px;font-weight:600;z-index:999;box-shadow:0 8px 24px rgba(0,0,0,.2);white-space:nowrap;opacity:0;transition:opacity .3s;pointer-events:none;}
.notif.show{opacity:1;}
.loading{display:flex;align-items:center;justify-content:center;padding:32px;color:var(--muted);}
.spinner{width:22px;height:22px;border:2px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite;margin-right:10px;}
@keyframes spin{to{transform:rotate(360deg);}}
@media(max-width:400px){.stats-bar{grid-template-columns:repeat(2,1fr);}.btn-row{grid-template-columns:1fr;}}
</style>
</head>
<body>

<div class="app-header">
  <div class="app-header-inner">
    <div>
      <div class="logo">
        <div class="logo-icon"><svg viewBox="0 0 24 24" stroke-width="2.5"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg></div>
        <span class="logo-text">Medi<em>Pulse</em></span>
      </div>
      <div class="cab-name" id="cab-name">Chargement...</div>
    </div>
    <div class="logout-btn" onclick="window.location.href='/'">⏻</div>
  </div>
</div>

<div class="stats-bar">
  <div class="stat-item"><div class="stat-val" id="stat-envoyes" style="color:var(--primary)">0</div><div class="stat-lbl">Envoyés</div></div>
  <div class="stat-item"><div class="stat-val" id="stat-reponses" style="color:var(--success)">0</div><div class="stat-lbl">Réponses</div></div>
  <div class="stat-item"><div class="stat-val" id="stat-google" style="color:var(--wa)">0</div><div class="stat-lbl">✅ Google</div></div>
  <div class="stat-item"><div class="stat-val" id="stat-alertes" style="color:var(--danger)">0</div><div class="stat-lbl">⚠️ Alertes</div></div>
</div>

<div class="content">

  <div class="alertes-box" id="alertes-box">
    <div class="alertes-box-title">🚨 Patients à rappeler</div>
    <div id="alertes-list"></div>
  </div>

  <div class="send-card">
    <div class="send-card-title">📤 Envoyer un formulaire</div>
    <div class="field-group">
      <label class="field-label">Nom du patient *</label>
      <input id="patient-nom" class="field-input" type="text" placeholder="Ex: Ahmed Benali">
    </div>
    <div class="field-group">
      <label class="field-label">Numéro WhatsApp *</label>
      <input id="patient-tel" class="field-input" type="tel" placeholder="Ex: 0612345678">
    </div>
    <div class="btn-row">
      <button class="btn-form fr" onclick="envoyerForm('FR')">🇫🇷 Envoyer FR</button>
      <button class="btn-form ar" onclick="envoyerForm('AR')">🇲🇦 إرسال AR</button>
    </div>
  </div>

  <div class="section-title">
    👥 Patients aujourd'hui
    <div class="filter-tabs">
      <div class="filter-tab active" onclick="filterPatients('tous',this)">Tous</div>
      <div class="filter-tab" onclick="filterPatients('replied',this)">✅</div>
      <div class="filter-tab" onclick="filterPatients('sent',this)">⏳</div>
      <div class="filter-tab" onclick="filterPatients('alerte',this)">🚨</div>
    </div>
  </div>

  <div class="patients-card">
    <div id="patients-list">
      <div class="loading"><div class="spinner"></div>Chargement...</div>
    </div>
  </div>

</div>

<div class="notif" id="notif"></div>

<script>
const GOOGLE_API_KEY = 'AIzaSyCy3jfMxuWxeQXE0L7rLm3AZbNwCQegneM';
const urlParams = new URLSearchParams(window.location.search);
const SHEET_ID = urlParams.get('sheet') || '';

let gConfig = {nomCabinet:'Mon Cabinet', formFR:'', formAR:'', lienGoogle:''};
let patients = [];
let currentFilter = 'tous';
const COLORS = ['#0057ff','#00c49a','#f59e0b','#7c3aed','#ec4899','#ef4444'];

async function init() {
  if(!SHEET_ID) {
    document.getElementById('cab-name').textContent = '⚠️ Lien invalide';
    document.getElementById('patients-list').innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div>Lien invalide</div>';
    return;
  }
  await loadConfig();
  await loadPatients();
  setInterval(loadPatients, 30000);
}

async function loadConfig() {
  try {
    const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/Config%20MediPulse!A1:B10?key=${GOOGLE_API_KEY}`;
    const res = await fetch(url);
    const data = await res.json();
    if(data.values) {
      data.values.forEach(row => {
        if(row[0]==='Nom Cabinet') gConfig.nomCabinet = row[1]||'Mon Cabinet';
        if(row[0]==='Form FR') gConfig.formFR = row[1]||'';
        if(row[0]==='Form AR') gConfig.formAR = row[1]||'';
        if(row[0]==='Lien Google') gConfig.lienGoogle = row[1]||'';
      });
    }
    document.getElementById('cab-name').textContent = '🏥 ' + gConfig.nomCabinet;
    document.title = 'MediPulse — ' + gConfig.nomCabinet;
  } catch(e) {}
}

async function loadPatients() {
  try {
    const sheetsUrl = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}?key=${GOOGLE_API_KEY}`;
    const sheetsRes = await fetch(sheetsUrl);
    const sheetsData = await sheetsRes.json();
    let reponses = [];

    if(sheetsData.sheets) {
      for(const sheet of sheetsData.sheets) {
        const name = sheet.properties.title;
        if(name === 'Config MediPulse') continue;
        if(name !== 'Réponses FR' && name !== 'Réponses AR' && name !== 'Fusion') continue;
        try {
          const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(name)}!A:G?key=${GOOGLE_API_KEY}`;
          const res = await fetch(url);
          const data = await res.json();
          if(data.values && data.values.length > 1) {
            const rows = data.values.slice(1).map(r => ({
              horodateur: r[0]||'',
              nom: (r[1]||'Patient').trim(),
              note: parseInt(r[2])||0,
              commentaire: r[3]||'',
              intention: r[4]||'',
              langue: r[5]||'FR',
              alerte: r[6]||''
            }));
            reponses = [...reponses, ...rows];
          }
        } catch(e) {}
      }
    }

    // Dédupliquer par nom + horodateur
    const seen = new Set();
    reponses = reponses.filter(r => {
      const key = r.nom.toLowerCase() + r.horodateur;
      if(seen.has(key)) return false;
      seen.add(key);
      return true;
    });

    reponses.sort((a,b) => new Date(b.horodateur) - new Date(a.horodateur));

    const envois = getEnvoisAujourdhui();
    patients = mergePatients(envois, reponses);
    updateStats(reponses, envois);
    renderPatients();
    renderAlertes();

  } catch(e) {
    console.error(e);
  }
}

function mergePatients(envois, reponses) {
  return envois.map(e => {
    const nomEnvoi = e.nom.toLowerCase().trim();
    const rep = reponses.find(r => {
      const nomRep = r.nom.toLowerCase().trim();
      return nomRep === nomEnvoi ||
             nomRep.includes(nomEnvoi) ||
             nomEnvoi.includes(nomRep) ||
             nomEnvoi.split(' ')[0] === nomRep.split(' ')[0];
    });
    if(rep) return {
      ...e,
      status: 'replied',
      note: rep.note,
      intention: rep.intention,
      commentaire: rep.commentaire,
      langue: rep.langue,
      tel: e.tel
    };
    return {...e, status:'sent'};
  });
}

function updateStats(reponses, envois) {
  const aujourd = new Date();
  const debutJour = new Date(aujourd.getFullYear(), aujourd.getMonth(), aujourd.getDate());
  const repAujourd = reponses.filter(r => new Date(r.horodateur) >= debutJour);
  const google = repAujourd.filter(r => String(r.intention).includes('Oui') || String(r.intention).includes('نعم'));
  const alertes = patients.filter(p => p.status === 'replied' && p.note > 0 && p.note <= 3);

  document.getElementById('stat-envoyes').textContent = envois.length;
  document.getElementById('stat-reponses').textContent = repAujourd.length;
  document.getElementById('stat-google').textContent = google.length;
  document.getElementById('stat-alertes').textContent = alertes.length;
}

function renderAlertes() {
  const alertes = patients.filter(p => p.status === 'replied' && p.note > 0 && p.note <= 3);
  const box = document.getElementById('alertes-box');
  const list = document.getElementById('alertes-list');
  if(!alertes.length) { box.classList.remove('show'); return; }
  box.classList.add('show');
  list.innerHTML = alertes.map(a => `
    <div class="alerte-item">
      <div style="font-size:20px">😔</div>
      <div class="alerte-item-info">
        <div class="alerte-item-name">${a.nom}</div>
        <div class="alerte-item-desc">Note : ${'⭐'.repeat(Math.max(1,a.note))} · ${a.commentaire||'Pas de commentaire'}</div>
      </div>
    </div>
  `).join('');
}

function renderPatients() {
  const container = document.getElementById('patients-list');
  let filtered = patients;
  if(currentFilter === 'replied') filtered = patients.filter(p => p.status === 'replied' && p.note >= 4);
  if(currentFilter === 'sent') filtered = patients.filter(p => p.status === 'sent');
  if(currentFilter === 'alerte') filtered = patients.filter(p => p.status === 'replied' && p.note > 0 && p.note <= 3);

  if(!filtered.length) {
    container.innerHTML = `<div class="empty-state"><div class="empty-icon">📋</div>${currentFilter==='tous'?'Aucun patient envoyé aujourd\'hui':'Aucun patient dans cette catégorie'}</div>`;
    return;
  }

  container.innerHTML = filtered.map((p, i) => {
    const color = COLORS[i % COLORS.length];
    const initials = p.nom.split(' ').map(w=>w[0]).join('').substring(0,2).toUpperCase();
    const stars = p.note ? '⭐'.repeat(Math.min(5, Math.max(1, p.note))) : '';
    const veutGoogle = String(p.intention).includes('Oui') || String(p.intention).includes('نعم');
    const pasContent = p.note > 0 && p.note <= 3;
    const refuseGoogle = String(p.intention).includes('pas') || String(p.intention).includes('ليس') || String(p.intention).includes('déjà') || String(p.intention).includes('مسبقاً');

    let statusHtml = '';
    let actionHtml = '';

    if(p.status === 'replied') {
      if(pasContent) {
        statusHtml = `<span class="badge-status replied-bad">😔 Mécontent</span>`;
        actionHtml = `<button class="btn-rappel" onclick="showNotif('📞 Contactez ${p.nom} !')">📞 Rappeler</button>`;
      } else if(veutGoogle && gConfig.lienGoogle) {
        statusHtml = `<span class="badge-status replied-good">✅ Satisfait</span>`;
        const msg = p.langue === 'AR'
          ? `مرحباً ${p.nom} 😊\n\nشكراً على زيارتكم لـ ${gConfig.nomCabinet} !\n\nهل يمكنكم ترك تقييم على Google ؟ لن يستغرق سوى 30 ثانية 🙏\n\n⭐ اضغط هنا :\n${gConfig.lienGoogle}\n\nشكراً !`
          : `Bonjour ${p.nom} 😊\n\nMerci pour votre visite au ${gConfig.nomCabinet} !\n\nPourriez-vous nous laisser un avis Google ? Cela prend 30 secondes 🙏\n\n⭐ Cliquez ici :\n${gConfig.lienGoogle}\n\nMerci !`;
        const lienWA = `https://wa.me/${formatTel(p.tel)}?text=${encodeURIComponent(msg)}`;
        actionHtml = `<button class="btn-wa-google" onclick="window.open('${lienWA}','_blank')">📲 Avis Google</button>`;
      } else if(refuseGoogle) {
        statusHtml = `<span class="badge-status replied-neutral">😊 Satisfait</span>`;
      } else {
        statusHtml = `<span class="badge-status replied-good">✅ Répondu</span>`;
      }
    } else {
      statusHtml = `<span class="badge-status sent">⏳ En attente</span>`;
    }

    return `
      <div class="patient-row">
        <div class="patient-av" style="background:${color}">${initials}</div>
        <div class="patient-info">
          <div class="patient-name">${p.nom}</div>
          <div class="patient-meta">${p.langue==='AR'?'🇲🇦':'🇫🇷'} · ${p.heure||''} ${stars?'· '+stars:''}</div>
          ${p.commentaire?`<div class="patient-comment">"${p.commentaire}"</div>`:''}
        </div>
        <div class="patient-right">
          ${statusHtml}
          ${actionHtml}
        </div>
      </div>`;
  }).join('');
}

function filterPatients(filter, el) {
  currentFilter = filter;
  document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderPatients();
}

function envoyerForm(langue) {
  const nom = document.getElementById('patient-nom').value.trim();
  const tel = document.getElementById('patient-tel').value.trim();
  if(!nom || !tel) { showNotif('❌ Remplissez le nom et le numéro !'); return; }
  const lienForm = langue === 'FR' ? gConfig.formFR : gConfig.formAR;
  if(!lienForm) { showNotif('❌ Lien formulaire non configuré !'); return; }
  const msgFR = `Bonjour ${nom} 😊\n\nMerci pour votre visite au ${gConfig.nomCabinet} !\n\nPourriez-vous prendre 30 secondes pour donner votre avis ? 🙏\n\n${lienForm}`;
  const msgAR = `مرحباً ${nom} 😊\n\nشكراً على زيارتكم لـ ${gConfig.nomCabinet} !\n\nهل يمكنكم تخصيص 30 ثانية لتقييم تجربتكم ؟ 🙏\n\n${lienForm}`;
  const msg = langue === 'FR' ? msgFR : msgAR;
  const lienWA = `https://wa.me/${formatTel(tel)}?text=${encodeURIComponent(msg)}`;
  saveEnvoi({nom, tel, langue, heure: getHeure()});
  window.open(lienWA, '_blank');
  document.getElementById('patient-nom').value = '';
  document.getElementById('patient-tel').value = '';
  showNotif('✅ WhatsApp ouvert pour ' + nom + ' !');
  setTimeout(loadPatients, 2000);
}

function saveEnvoi(envoi) {
  const key = 'envois_' + SHEET_ID + '_' + getDateKey();
  const envois = JSON.parse(localStorage.getItem(key) || '[]');
  envois.unshift(envoi);
  localStorage.setItem(key, JSON.stringify(envois));
}

function getEnvoisAujourdhui() {
  const key = 'envois_' + SHEET_ID + '_' + getDateKey();
  return JSON.parse(localStorage.getItem(key) || '[]');
}

function getDateKey() {
  const d = new Date();
  return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
}

function getHeure() {
  const d = new Date();
  return d.getHours()+'h'+String(d.getMinutes()).padStart(2,'0');
}

function formatTel(tel) {
  if(!tel) return '';
  tel = tel.replace(/\s/g,'').replace(/-/g,'');
  if(tel.startsWith('0')) tel = '212' + tel.substring(1);
  if(tel.startsWith('+')) tel = tel.substring(1);
  return tel;
}

function showNotif(msg) {
  const el = document.getElementById('notif');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3000);
}

init();
</script>
</body>
</html>
