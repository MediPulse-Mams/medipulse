<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediPulse — Mon Cabinet</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://unpkg.com/@tabler/icons-webfont@3.11.0/dist/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/shared.css">
<style>
body{background:#F5F7FF;color:#111827;font-family:'Plus Jakarta Sans',sans-serif}

.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:20px}
.charts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-bottom:20px}
.card{background:#fff;border-radius:14px;border:1px solid #F3F4F6;padding:18px;box-shadow:0 1px 4px rgba(0,0,0,0.05);min-width:0}
.kpi-card{background:#fff;border-radius:14px;border:1px solid #F3F4F6;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,0.05);min-width:0}
.chart-card{background:#fff;border-radius:14px;border:1px solid #F3F4F6;padding:18px;box-shadow:0 1px 4px rgba(0,0,0,0.05);min-width:0;overflow:hidden}
.kpi-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.kpi-label{font-size:12px;color:#6B7280;font-weight:500}
.kpi-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.kpi-value{font-size:28px;font-weight:700;color:#111827;line-height:1;margin-bottom:4px}
.kpi-sub{font-size:11px;font-weight:600}
.page-header{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:20px}
.page-title{font-size:20px;font-weight:700;color:#0F172A}
.page-bar{width:36px;height:3px;background:#2563EB;border-radius:2px;margin-top:5px}
.header-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn-period{display:flex;align-items:center;gap:5px;padding:7px 12px;border-radius:9px;border:1px solid #E5E7EB;background:#fff;font-size:12px;color:#374151;cursor:pointer;white-space:nowrap}
.btn-google{display:inline-flex;align-items:center;gap:5px;padding:7px 12px;border-radius:9px;background:#2563EB;color:#fff;font-size:12px;font-weight:600;text-decoration:none;white-space:nowrap}
.period-wrap{position:relative}
.period-dd{display:none;position:absolute;right:0;top:38px;background:#fff;border:1px solid #E5E7EB;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,0.1);min-width:170px;z-index:100;overflow:hidden}
.period-opt{padding:10px 14px;font-size:13px;color:#374151;cursor:pointer}
.period-opt:hover{background:#F9FAFB}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.avis-table{width:100%;border-collapse:collapse;min-width:400px}
.avis-table th{text-align:left;font-size:10px;font-weight:600;color:#9CA3AF;text-transform:uppercase;letter-spacing:0.05em;padding:0 8px 10px 0;white-space:nowrap}
.avis-table td{padding:11px 8px 11px 0;border-top:1px solid #F9FAFB;font-size:12px;vertical-align:middle}
.avis-avatar{width:32px;height:32px;border-radius:50%;background:#EFF6FF;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#2563EB;flex-shrink:0}
.avis-card-mobile{background:#F9FAFB;border-radius:10px;padding:12px;margin-bottom:8px;border:1px solid #F3F4F6}
.bar-chart{display:flex;align-items:flex-end;justify-content:space-around;height:120px;border-bottom:1px solid #F3F4F6;padding-bottom:10px;margin-bottom:10px}
.bar-months{display:flex;justify-content:space-around}
.bar-month{font-size:11px;color:#9CA3AF;text-align:center;flex:1}

@media(max-width:768px){
  .kpi-grid{grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .charts-grid{grid-template-columns:1fr;gap:12px;margin-bottom:14px}
  .kpi-value{font-size:22px}
  .page-title{font-size:18px}
  .table-wrap-desktop{display:none}
  .avis-mobile{display:block}
  .card,.kpi-card,.chart-card{padding:14px}
}
@media(min-width:769px){
  .table-wrap-desktop{display:block;overflow-x:auto}
  .avis-mobile{display:none}
}
</style>
</head>
<body>
<div class="layout">

  <div class="sidebar sidebar-light" id="sidebar">
    <div class="sidebar-logo">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:5px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        <div style="font-size:18px;font-weight:800;letter-spacing:-0.5px;color:#1E3A5F">Medi<span style="color:#2563EB">Pulse</span></div>
      </div>
      <div style="font-size:10px;color:#94A3B8;padding-left:30px;font-style:italic">La réputation médicale, automatisée.</div>
    </div>
    <div class="sidebar-user">
      <div class="sidebar-avatar" id="sb-avatar" style="background:#EFF6FF;color:#2563EB"></div>
      <div>
        <div class="sidebar-username" id="sb-name"></div>
        <div class="sidebar-role" style="font-size:11px">Médecin</div>
      </div>
    </div>
    <div class="sidebar-nav">
      <div class="nav-section">Mon cabinet</div>
      <div class="nav-link active" id="nav-dashboard" onclick="showPage('dashboard')"><i class="ti ti-chart-bar"></i>Dashboard</div>
      <div class="nav-link" id="nav-avis" onclick="showPage('avis')"><i class="ti ti-messages"></i>Avis patients</div>
      <div class="nav-link" id="nav-stats" onclick="showPage('stats')"><i class="ti ti-trending-up"></i>Statistiques</div>
    </div>
    <div class="sidebar-footer">
      <button class="logout-btn logout-btn-blue" onclick="doLogout()">
        <i class="ti ti-logout" style="font-size:15px"></i> Déconnexion
      </button>
    </div>
  </div>

  <div class="sidebar-overlay" id="mob-overlay" onclick="closeSidebar()"></div>

  <div class="main">
    <div class="topbar topbar-light">
      <div style="display:flex;align-items:center;gap:10px">
        <button class="mobile-menu-btn" onclick="toggleSidebar()" style="color:#0F172A"><i class="ti ti-menu-2"></i></button>
        <div style="font-size:15px;font-weight:700;color:#0F172A" id="page-title">Dashboard</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <span style="padding:3px 12px;border-radius:99px;font-size:11px;font-weight:600;background:rgba(16,185,129,0.12);color:#10B981;border:1px solid rgba(16,185,129,0.2)">Médecin</span>
        <span style="font-size:11px;color:#94A3B8" id="topbar-date"></span>
      </div>
    </div>
    <div class="content content-light" id="main-content">
      <div style="text-align:center;padding:60px;color:#94A3B8">Chargement...</div>
    </div>
  </div>
</div>

<div id="toast"></div>
<script src="/js/supabase.js"></script>
<script>
let currentUser=null, userRecord=null, cabinetData=null;

(async()=>{
  const auth=await requireAuth('medecin');
  if(!auth)return;
  currentUser=auth.session.user;
  userRecord=auth.user;
  document.getElementById('sb-avatar').textContent=(userRecord.nom||currentUser.email).substring(0,2).toUpperCase();
  document.getElementById('sb-name').textContent=userRecord.nom||currentUser.email.split('@')[0];
  document.getElementById('topbar-date').textContent=new Date().toLocaleDateString('fr-FR',{day:'numeric',month:'long'});

  // Charger les données réelles du cabinet
  const{data:cab}=await sb.from('cabinets').select('*').eq('email_medecin',currentUser.email).single();
  cabinetData=cab;

  showPage('dashboard');
})();

function showPage(page){
  closeSidebar();
  document.querySelectorAll('.nav-link').forEach(l=>l.classList.remove('active'));
  const el=document.getElementById('nav-'+page);
  if(el)el.classList.add('active');
  document.getElementById('page-title').textContent={dashboard:'Mon Cabinet',avis:'Avis Patients',stats:'Statistiques'}[page]||'Dashboard';
  if(page==='dashboard')renderDashboard();
  else if(page==='avis')renderAvis();
  else if(page==='stats')renderStats();
}

function toggleSidebar(){
  var sb=document.getElementById('sidebar');
  var ov=document.getElementById('mob-overlay');
  var open=sb.classList.toggle('open');
  if(ov)ov.classList.toggle('active',open);
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  var ov=document.getElementById('mob-overlay');
  if(ov)ov.classList.remove('active');
}

// ── DONNÉES RÉELLES ──
function getCabinetStats(){
  if(!cabinetData) return {note:0,nbAvis:0,nomCabinet:'Mon Cabinet',googleUrl:'#',specialite:''};
  return {
    note: cabinetData.note_google||0,
    nbAvis: cabinetData.nb_avis_depart||0,
    nomCabinet: cabinetData.nom_cabinet||'Mon Cabinet',
    googleUrl: cabinetData.google_url||'https://www.google.com/maps/search/'+encodeURIComponent(cabinetData.nom_cabinet||''),
    specialite: cabinetData.specialite||'',
    ville: cabinetData.ville||''
  };
}

function getStarsHtml(note){
  const full=Math.floor(note);
  const half=note%1>=0.5?1:0;
  const empty=5-full-half;
  return '⭐'.repeat(full)+(half?'✨':'')+'☆'.repeat(empty);
}

function renderDashboard(){
  const {note,nbAvis,nomCabinet,googleUrl,specialite} = getCabinetStats();
  const noteStr = note>0?note.toFixed(1):'—';

  document.getElementById('main-content').innerHTML=`
    <div class="page-header">
      <div><div class="page-title">Tableau de bord</div><div class="page-bar"></div></div>
      <div class="header-actions">
        <div class="period-wrap">
          <div class="btn-period" onclick="togglePeriod()">
            <i class="ti ti-calendar" style="font-size:13px;color:#6B7280"></i>
            <span id="period-label">30 derniers jours</span>
            <i class="ti ti-chevron-down" style="font-size:12px;color:#6B7280"></i>
          </div>
          <div class="period-dd" id="period-dd">
            ${['7 derniers jours','30 derniers jours','90 derniers jours','Cette année'].map(o=>`<div class="period-opt" onclick="selectPeriod('${o}')">${o}</div>`).join('')}
          </div>
        </div>
        <a href="${googleUrl}" target="_blank" class="btn-google">
          <i class="ti ti-search" style="font-size:13px"></i> Ma fiche Google
        </a>
      </div>
    </div>

    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-head"><span class="kpi-label">Avis collectés</span><div class="kpi-icon" style="background:#EFF6FF"><i class="ti ti-message" style="font-size:16px;color:#2563EB"></i></div></div>
        <div class="kpi-value">${nbAvis}</div>
        <div class="kpi-sub" style="color:#6B7280;font-weight:400">Depuis le début</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-head"><span class="kpi-label">Note Google</span><div class="kpi-icon" style="background:#FFF7ED"><i class="ti ti-star" style="font-size:16px;color:#F59E0B"></i></div></div>
        <div style="display:flex;align-items:baseline;gap:5px">
          <div class="kpi-value">${noteStr}</div>
          ${note>0?`<span style="color:#F59E0B;font-size:12px">${getStarsHtml(note)}</span>`:''}
        </div>
        <div class="kpi-sub" style="color:#6B7280;font-weight:400">sur 5.0 — ${nbAvis} avis</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-head"><span class="kpi-label">Formulaires envoyés</span><div class="kpi-icon" style="background:#F0FDF4"><i class="ti ti-send" style="font-size:16px;color:#10B981"></i></div></div>
        <div class="kpi-value" id="nb-envois">—</div>
        <div class="kpi-sub" style="color:#6B7280;font-weight:400">Ce mois</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-head"><span class="kpi-label">Objectif avis</span><div class="kpi-icon" style="background:#F0FDF4"><i class="ti ti-target" style="font-size:16px;color:#10B981"></i></div></div>
        <div style="position:relative;width:52px;height:52px;margin:-2px 0 3px">
          <svg width="52" height="52" viewBox="0 0 64 64">
            <circle cx="32" cy="32" r="26" fill="none" stroke="#F3F4F6" stroke-width="6"/>
            <circle cx="32" cy="32" r="26" fill="none" stroke="${note>=4?'#10B981':note>=3?'#F59E0B':'#F43F5E'}" stroke-width="6" 
              stroke-dasharray="${Math.round((note/5)*163)} 163" stroke-dashoffset="41" stroke-linecap="round" transform="rotate(-90 32 32)"/>
          </svg>
          <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:${note>=4?'#10B981':note>=3?'#F59E0B':'#F43F5E'}">${note>0?Math.round((note/5)*100)+'%':'—'}</div>
        </div>
        <div class="kpi-sub" style="color:${note>=4?'#10B981':note>=3?'#F59E0B':'#BE123C'}">${note>=4?'Excellent':note>=3?'À améliorer':'Critique'}</div>
      </div>
    </div>

    <div class="charts-grid">
      <div class="chart-card">
        <div style="font-size:14px;font-weight:700;color:#111827;margin-bottom:14px">Évolution des avis</div>
        <svg width="100%" height="130" viewBox="0 0 500 130" preserveAspectRatio="none">
          <defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2563EB" stop-opacity="0.12"/><stop offset="100%" stop-color="#2563EB" stop-opacity="0"/></linearGradient></defs>
          <line x1="0" y1="20" x2="500" y2="20" stroke="#F3F4F6" stroke-width="1"/>
          <line x1="0" y1="60" x2="500" y2="60" stroke="#F3F4F6" stroke-width="1"/>
          <line x1="0" y1="100" x2="500" y2="100" stroke="#F3F4F6" stroke-width="1"/>
          <path d="M20 100 C120 90 220 70 320 45 C380 30 440 15 475 8 L475 125 L20 125 Z" fill="url(#g1)"/>
          <path d="M20 100 C120 90 220 70 320 45 C380 30 440 15 475 8" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
          <circle cx="20" cy="100" r="3" fill="#fff" stroke="#2563EB" stroke-width="2"/>
          <circle cx="475" cy="8" r="4" fill="#2563EB" stroke="#fff" stroke-width="2"/>
          <text x="10" y="128" fill="#9CA3AF" font-size="9">Jan</text>
          <text x="452" y="128" fill="#2563EB" font-size="9" font-weight="600">Juin</text>
        </svg>
      </div>
      <div class="chart-card">
        <div style="font-size:14px;font-weight:700;color:#111827;margin-bottom:14px">Informations cabinet</div>
        ${cabinetData?`
          <div style="display:flex;flex-direction:column;gap:10px">
            <div style="display:flex;align-items:center;gap:8px">
              <div style="width:28px;height:28px;border-radius:7px;background:#EFF6FF;display:flex;align-items:center;justify-content:center;flex-shrink:0">
                <i class="ti ti-building-hospital" style="font-size:14px;color:#2563EB"></i>
              </div>
              <div>
                <div style="font-size:12px;font-weight:600;color:#111827">${cabinetData.nom_cabinet||'—'}</div>
                <div style="font-size:10px;color:#9CA3AF">${cabinetData.specialite||''} · ${cabinetData.ville||''}</div>
              </div>
            </div>
            <div style="display:flex;align-items:center;gap:8px">
              <div style="width:28px;height:28px;border-radius:7px;background:#F0FDF4;display:flex;align-items:center;justify-content:center;flex-shrink:0">
                <i class="ti ti-star" style="font-size:14px;color:#10B981"></i>
              </div>
              <div>
                <div style="font-size:12px;font-weight:600;color:#111827">Note de départ : ${cabinetData.note_google||'—'}/5</div>
                <div style="font-size:10px;color:#9CA3AF">${cabinetData.nb_avis_depart||0} avis Google</div>
              </div>
            </div>
            <div style="display:flex;align-items:center;gap:8px">
              <div style="width:28px;height:28px;border-radius:7px;background:#FFF7ED;display:flex;align-items:center;justify-content:center;flex-shrink:0">
                <i class="ti ti-crown" style="font-size:14px;color:#F59E0B"></i>
              </div>
              <div>
                <div style="font-size:12px;font-weight:600;color:#111827">Plan ${cabinetData.plan||'pro'}</div>
                <div style="font-size:10px;color:#9CA3AF">Statut : ${cabinetData.statut||'actif'}</div>
              </div>
            </div>
          </div>
        `:'<div style="text-align:center;padding:20px;color:#9CA3AF;font-size:13px">Aucun cabinet configuré</div>'}
      </div>
    </div>

    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px">
        <div style="font-size:14px;font-weight:700;color:#111827">Derniers avis patients</div>
        <span onclick="showPage('avis')" style="font-size:12px;color:#2563EB;font-weight:600;cursor:pointer">Voir tout →</span>
      </div>
      ${avisContent(4)}
    </div>
  `;

  // Charger nb envois
  loadNbEnvois();
}

async function loadNbEnvois(){
  try{
    const now=new Date();
    const firstDay=new Date(now.getFullYear(),now.getMonth(),1).toISOString();
    const{count}=await sb.from('envois').select('*',{count:'exact',head:true})
      .eq('user_id',currentUser.id)
      .gte('created_at',firstDay);
    const el=document.getElementById('nb-envois');
    if(el)el.textContent=count||0;
  }catch(e){
    const el=document.getElementById('nb-envois');
    if(el)el.textContent='0';
  }
}

function togglePeriod(){const dd=document.getElementById('period-dd');if(dd)dd.style.display=dd.style.display==='block'?'none':'block';}
function selectPeriod(o){const l=document.getElementById('period-label');if(l)l.textContent=o;const dd=document.getElementById('period-dd');if(dd)dd.style.display='none';}

const AVIS=[
  {init:'AK',nom:'Ahmed K.',date:"Aujourd'hui",stars:5,text:"Excellent cabinet, très à l'écoute.",pos:true},
  {init:'FB',nom:'Fatima B.',date:'Hier',stars:5,text:'Très bonne expérience, personnel accueillant.',pos:true},
  {init:'MR',nom:'Mohamed R.',date:'Il y a 2 jours',stars:3,text:'Attente longue mais médecin compétent.',pos:true},
  {init:'SS',nom:'Sara S.',date:'Il y a 3 jours',stars:2,text:'Rendez-vous annulé sans prévenir.',pos:false},
  {init:'YA',nom:'Youssef A.',date:'Il y a 4 jours',stars:5,text:'Cabinet moderne et très professionnel.',pos:true},
];

function avisContent(limit){
  const data=AVIS.slice(0,limit||10);
  return`
    <div class="table-wrap-desktop">
      <table class="avis-table">
        <thead><tr><th>Patient</th><th>Note</th><th>Commentaire</th><th>Date</th><th>Statut</th></tr></thead>
        <tbody>${data.map(a=>`<tr>
          <td><div style="display:flex;align-items:center;gap:8px"><div class="avis-avatar">${a.init}</div><span style="font-weight:600;color:#111827;white-space:nowrap">${a.nom}</span></div></td>
          <td style="white-space:nowrap">${'⭐'.repeat(a.stars)}</td>
          <td style="color:#6B7280;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${a.text}</td>
          <td style="color:#9CA3AF;white-space:nowrap;font-size:11px">${a.date}</td>
          <td><span style="padding:3px 9px;border-radius:99px;font-size:10px;font-weight:600;background:${a.pos?'#F0FDF4':'#FFF1F2'};color:${a.pos?'#15803D':'#BE123C'}">${a.pos?'Positif':'⚠ Négatif'}</span></td>
        </tr>`).join('')}</tbody>
      </table>
    </div>
    <div class="avis-mobile">
      ${data.map(a=>`
        <div class="avis-card-mobile">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
            <div style="display:flex;align-items:center;gap:8px">
              <div class="avis-avatar">${a.init}</div>
              <div><div style="font-size:13px;font-weight:600;color:#111827">${a.nom}</div><div style="font-size:10px;color:#9CA3AF">${a.date}</div></div>
            </div>
            <span style="padding:3px 9px;border-radius:99px;font-size:10px;font-weight:600;background:${a.pos?'#F0FDF4':'#FFF1F2'};color:${a.pos?'#15803D':'#BE123C'}">${a.pos?'Positif':'⚠ Négatif'}</span>
          </div>
          <div style="font-size:12px;color:#F59E0B;margin-bottom:4px">${'⭐'.repeat(a.stars)}</div>
          <div style="font-size:12px;color:#6B7280;line-height:1.5">${a.text}</div>
        </div>`).join('')}
    </div>`;
}

function renderAvis(){
  document.getElementById('main-content').innerHTML=`
    <div class="page-header"><div><div class="page-title">Avis Patients</div><div class="page-bar"></div></div></div>
    <div class="card">${avisContent(10)}</div>`;
}

function renderStats(){
  const {note,nbAvis} = getCabinetStats();
  const noteStr=note>0?note.toFixed(1):'—';
  const evolution=note>0?(note-3.0).toFixed(1):'—';

  document.getElementById('main-content').innerHTML=`
    <div class="page-header">
      <div><div class="page-title">Statistiques</div><div class="page-bar"></div>
      <div style="font-size:12px;color:#6B7280;margin-top:6px">Évolution de votre réputation en ligne</div></div>
    </div>
    <div class="kpi-grid" style="margin-bottom:16px">
      ${[
        {val:noteStr,lbl:'Note actuelle',sub:'sur 5.0',e:'⭐'},
        {val:note>0?'+'+evolution:'—',lbl:'Évolution',sub:'depuis le début',e:'📈'},
        {val:nbAvis,lbl:'Total avis',sub:'depuis le début',e:'💬'},
        {val:note>0?Math.round((note/5)*100)+'%':'—',lbl:'Score réputation',sub:note>=4?'Excellent':note>=3?'Bon':'À améliorer',e:'✅'},
      ].map(k=>`
        <div class="kpi-card">
          <div style="font-size:20px;margin-bottom:8px">${k.e}</div>
          <div class="kpi-value" style="font-size:24px">${k.val}</div>
          <div style="font-size:12px;font-weight:600;color:#374151;margin-top:3px">${k.lbl}</div>
          <div style="font-size:11px;color:#9CA3AF;margin-top:2px">${k.sub}</div>
        </div>`).join('')}
    </div>
    <div class="card">
      <div style="font-size:14px;font-weight:700;color:#111827;margin-bottom:16px">Progression mensuelle</div>
      <div class="bar-chart" id="bar-chart"></div>
      <div class="bar-months">${['Jan','Fév','Mar','Avr','Mai','Juin'].map(m=>`<div class="bar-month">${m}</div>`).join('')}</div>
    </div>`;

  setTimeout(()=>{
    const chart=document.getElementById('bar-chart');if(!chart)return;
    const base=Math.max(note-0.9,2.5);
    const vals=[
      parseFloat((base).toFixed(1)),
      parseFloat((base+0.1).toFixed(1)),
      parseFloat((base+0.2).toFixed(1)),
      parseFloat((base+0.4).toFixed(1)),
      parseFloat((base+0.6).toFixed(1)),
      parseFloat(note.toFixed(1)),
    ];
    const bgs=['linear-gradient(180deg,#BFDBFE,#DBEAFE)','linear-gradient(180deg,#93C5FD,#BFDBFE)','linear-gradient(180deg,#60A5FA,#93C5FD)','linear-gradient(180deg,#3B82F6,#60A5FA)','linear-gradient(180deg,#2563EB,#3B82F6)','linear-gradient(180deg,#1D4ED8,#2563EB)'];
    chart.innerHTML=vals.map((v,i)=>{
      const h=Math.round((v/5)*110);
      return`<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;padding:0 4px">
        <div style="font-size:10px;font-weight:700;color:${i===5?'#1D4ED8':'#6B7280'}">${v}</div>
        <div style="width:100%;border-radius:5px 5px 0 0;height:${h}px;background:${bgs[i]}"></div>
      </div>`;
    }).join('');
  },100);
}
</script>
</body>
</html>
