<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediPulse — Espace Assistante</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://unpkg.com/@tabler/icons-webfont@3.11.0/dist/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/shared.css">
<style>
body{background:#F5F7FF;color:#111827;font-family:'Plus Jakarta Sans',sans-serif}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px}
.kpi-mini{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{background:#fff;border-radius:14px;border:1px solid #F3F4F6;padding:18px;box-shadow:0 1px 4px rgba(0,0,0,0.05)}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.hist-table{width:100%;border-collapse:collapse;min-width:500px}
.hist-table th{text-align:left;font-size:10px;font-weight:600;color:#9CA3AF;text-transform:uppercase;letter-spacing:0.05em;padding:0 8px 10px 0;white-space:nowrap}
.hist-table td{padding:11px 8px 11px 0;border-top:1px solid #F9FAFB;font-size:12px;vertical-align:middle}
.btn-wa{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:8px;border:none;background:#25D366;color:#fff;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:'Plus Jakarta Sans',sans-serif}
.btn-wa:hover{background:#20B858}
@media(max-width:768px){
  .form-grid{grid-template-columns:1fr}
  .kpi-mini{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="layout">
  <div class="sidebar-overlay" id="mob-overlay" onclick="closeSidebar()"></div>

  <div class="sidebar sidebar-light" id="sidebar">
    <div class="sidebar-logo">
      <div style="display:flex;align-items:center;gap:9px;margin-bottom:6px">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        <div style="font-size:19px;font-weight:800;letter-spacing:-0.5px;color:#1E3A5F">Medi<span style="color:#2563EB">Pulse</span></div>
      </div>
      <div style="font-size:10px;color:#94A3B8;padding-left:33px;font-style:italic">La réputation médicale, automatisée.</div>
    </div>
    <div class="sidebar-user">
      <div class="sidebar-avatar" id="sb-avatar" style="background:#F3E8FF;color:#8B5CF6"></div>
      <div>
        <div class="sidebar-username" id="sb-name"></div>
        <div class="sidebar-role" style="font-size:11px">Assistante</div>
      </div>
    </div>
    <div class="sidebar-nav">
      <div class="nav-section">Outils</div>
      <div class="nav-link active" id="nav-accueil" onclick="showPage('accueil')"><i class="ti ti-home"></i>Accueil</div>
      <div class="nav-link" id="nav-historique" onclick="showPage('historique')"><i class="ti ti-history"></i>Historique</div>
    </div>
    <div class="sidebar-footer">
      <button class="logout-btn logout-btn-blue" onclick="doLogout()">
        <i class="ti ti-logout" style="font-size:16px"></i> Déconnexion
      </button>
    </div>
  </div>

  <div class="main">
    <div class="topbar topbar-light">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="mobile-menu-btn" onclick="toggleSidebar()" style="color:#0F172A"><i class="ti ti-menu-2"></i></button>
        <div style="font-size:16px;font-weight:700;color:#0F172A" id="page-title">Espace Assistante</div>
      </div>
      <div style="display:flex;align-items:center;gap:12px">
        <span style="padding:4px 14px;border-radius:99px;font-size:11px;font-weight:600;background:rgba(139,92,246,0.15);color:#8B5CF6;border:1px solid rgba(139,92,246,0.25)">Assistante</span>
        <span style="font-size:13px;color:#64748B" id="topbar-date"></span>
      </div>
    </div>
    <div class="content content-light" id="main-content">
      <div style="text-align:center;padding:60px;color:#94A3B8">Chargement...</div>
    </div>
  </div>
</div>

<div id="toast"></div>
<script src="/js/supabase.js"></script>
<script>
let currentUser=null, userRecord=null, cabinetData=null;

(async()=>{
  const auth=await requireAuth('assistante');
  if(!auth)return;
  currentUser=auth.session.user;
  userRecord=auth.user;
  document.getElementById('sb-avatar').textContent=(userRecord.nom||currentUser.email).substring(0,2).toUpperCase();
  document.getElementById('sb-name').textContent=userRecord.nom||currentUser.email.split('@')[0];
  document.getElementById('topbar-date').textContent=new Date().toLocaleDateString('fr-FR',{day:'numeric',month:'long'});
  const{data:cab}=await sb.from('cabinets').select('*').eq('email_assistante',currentUser.email).single();
  cabinetData=cab;
  showPage('accueil');
})();

function showPage(page){
  closeSidebar();
  document.querySelectorAll('.nav-link').forEach(l=>l.classList.remove('active'));
  const el=document.getElementById('nav-'+page);
  if(el)el.classList.add('active');
  document.getElementById('page-title').textContent=page==='accueil'?'Espace Assistante':'Historique des envois';
  if(page==='accueil')renderAccueil();
  else renderHistorique();
}

function toggleSidebar(){
  var sb=document.getElementById('sidebar');
  var ov=document.getElementById('mob-overlay');
  sb.classList.toggle('open');
  if(ov)ov.classList.toggle('active',sb.classList.contains('open'));
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  var ov=document.getElementById('mob-overlay');
  if(ov)ov.classList.remove('active');
}

// ── ACCUEIL ──
async function renderAccueil(){
  const today=new Date().toISOString().split('T')[0];
  const{data:liste}=await sb.from('envois_whatsapp')
    .select('*')
    .eq('assistante_email',currentUser.email)
    .gte('created_at',today+'T00:00:00')

  const total=envois.length;

          <label style="font-size:11px;font-weight:600;color:#374151;text-transform:uppercase;letter-spacing:0.05em;display:block;margin-bottom:6px">Téléphone WhatsApp</label>

            <svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.123.554 4.117 1.528 5.843L.057 23.786c-.092.355.232.68.587.587l5.943-1.471A11.955 11.955 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0z"/></svg>
            عربية
          </button>
          <button onclick="envoyerFormulaire('fr')" style="padding:14px;border-radius:12px;border:none;background:linear-gradient(135deg,#0369A1,#06B6D4);color:#fff;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-family:'Plus Jakarta Sans',sans-serif">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.123.554 4.117 1.528 5.843L.057 23.786c-.092.355.232.68.587.587l5.943-1.471A11.955 11.955 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0z"/></svg>
            Français
          </button>
        </div>
      </div>

      <div class="kpi-mini">
        <div class="card">
          <div style="width:34px;height:34px;border-radius:10px;background:#EFF6FF;display:flex;align-items:center;justify-content:center;margin-bottom:12px">
            <i class="ti ti-send" style="font-size:16px;color:#2563EB"></i>
          </div>
          <div style="font-size:26px;font-weight:700;color:#111827;line-height:1">${total}</div>
          <div style="font-size:12px;color:#6B7280;margin-top:5px">Envoyés aujourd'hui</div>
        </div>
        <div class="card">
          <div style="width:34px;height:34px;border-radius:10px;background:#F0FDF4;display:flex;align-items:center;justify-content:center;margin-bottom:12px">
            <i class="ti ti-message-check" style="font-size:16px;color:#10B981"></i>
          </div>
          <div style="font-size:26px;font-weight:700;color:#111827;line-height:1">${envois.filter(e=>e.statut!=='envoye').length}</div>
          <div style="font-size:12px;color:#6B7280;margin-top:5px">Réponses reçues</div>
        </div>
        <div class="card">
          <div style="width:34px;height:34px;border-radius:10px;background:#F0FDF4;display:flex;align-items:center;justify-content:center;margin-bottom:12px">

          <div style="width:34px;height:34px;border-radius:10px;background:#FFF1F2;display:flex;align-items:center;justify-content:center;margin-bottom:12px">
            <i class="ti ti-alert-triangle" style="font-size:16px;color:#F43F5E"></i>

          <div style="font-size:12px;color:#6B7280;margin-top:5px">Alertes</div>
        </div>
      </div>
    </div>

    <!-- HISTORIQUE DU JOUR -->
    <div class="card">
      <div style="font-size:15px;font-weight:700;color:#111827;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between">
        <span><i class="ti ti-history" style="color:#6B7280;margin-right:6px"></i>Historique du jour</span>
        <button onclick="renderAccueil()" style="background:none;border:none;cursor:pointer;font-size:12px;color:#2563EB;font-weight:600;font-family:'Plus Jakarta Sans',sans-serif">↻ Actualiser</button>
      </div>
      ${envois.length?`
        <div class="table-scroll">
          <table class="hist-table">
            <thead><tr>
              <th>Patient</th><th>Téléphone</th><th>Langue</th><th>Heure</th><th>Statut</th><th>Action</th>
            </tr></thead>
            <tbody>${envois.map(e=>`
              <tr>
                <td style="font-weight:600;color:#111827">${e.nom_patient||'—'}</td>
                <td style="color:#6B7280">${e.tel_patient||'—'}</td>
                <td><span style="padding:3px 9px;border-radius:99px;font-size:10px;font-weight:600;background:#EFF6FF;color:#2563EB">${e.langue==='ar'?'Arabe':'Français'}</span></td>
                <td style="color:#6B7280;font-size:11px">${new Date(e.created_at).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</td>

        </div>
      `}
    </div>
  `;

function getStatutBadge(statut){
  if(statut==='positif') return '<span style="padding:3px 9px;border-radius:99px;font-size:10px;font-weight:600;background:#F0FDF4;color:#15803D">⭐ Positif</span>';
  if(statut==='negatif') return '<span style="padding:3px 9px;border-radius:99px;font-size:10px;font-weight:600;background:#FFF1F2;color:#BE123C">⚠ Négatif</span>';
  return '<span style="padding:3px 9px;border-radius:99px;font-size:10px;font-weight:600;background:#FFF7ED;color:#EA580C">En attente</span>';
}

function envoyerLienGoogle(tel, nom, langue){
  const lienGoogle=cabinetData?.lien_google||'';
  const nomCabinet=cabinetData?.nom_cabinet||'notre cabinet';
  if(!lienGoogle){showToast('Lien Google non configuré','error');return;}
  const msgFR='Bonjour '+nom+' !\n\nMerci pour votre retour positif \n\nPourriez-vous partager votre experience sur Google ? Cela prend 30 secondes\n\n'+lienGoogle+'\n\nMerci !\nL equipe '+nomCabinet;
  const msgAR='مرحبا '+nom+'\n\nشكرا على تقييمك الايجابي\n\nهل يمكنك ترك تقييم على Google ؟\n\n'+lienGoogle;
  const msg=encodeURIComponent(langue==='ar'?msgAR:msgFR);
  const telF=tel.replace(/\s/g,'').replace(/^0/,'212');
  window.open('https://wa.me/'+telF+'?text='+msg,'_blank');
  showToast('Lien Google envoyé !','success');
}

// ── ENVOYER FORMULAIRE ──
async function envoyerFormulaire(lang){
  const nom=document.getElementById('ass-nom')?.value.trim()||'';
  const tel=document.getElementById('ass-tel')?.value.trim()||'';
  if(!tel){showToast('Entrez le numéro WhatsApp','error');return;}

  const token=crypto.randomUUID();
  const formUrl='https://medipulse-gamma.vercel.app/patient.html?token='+token;
  if(!formUrl){showToast('Cabinet non configuré','error');return;}

  const nomCabinet=cabinetData?.nom_cabinet||'notre cabinet';
  const msgFR='Bonjour '+nom+' \n\nMerci pour votre visite au '+nomCabinet+' !\n\nPourriez-vous nous donner votre avis ? Cela prend 2 minutes\n\nFormulaire :\n'+formUrl+'\n\nMerci !';
  const msgAR='مرحبا '+nom+' \n\nشكرا على زيارتكم\n\nهل يمكنكم تقييم تجربتكم ؟ دقيقتان فقط\n\n'+formUrl;
  const msg=encodeURIComponent(lang==='ar'?msgAR:msgFR);
  const telF=tel.replace(/\s/g,'').replace(/^0/,'212');

  window.open('https://wa.me/'+telF+'?text='+msg,'_blank');

  const{error}=await sb.from('envois_whatsapp').insert([{
    assistante_email:currentUser.email,
    cabinet_id:cabinetData?.id||'',
    nom_patient:nom,
    tel_patient:tel,
    langue:lang,
    statut:'envoye',
    form_url:formUrl,
    feedback_token:token
  }]);

  if(error){console.error(error);showToast('Erreur sauvegarde','error');}
  else showToast('Formulaire '+(lang==='ar'?'Arabe':'Français')+' envoyé !','success');

  document.getElementById('ass-nom').value='';
  document.getElementById('ass-tel').value='';
  setTimeout(()=>renderAccueil(),800);
}

// ── HISTORIQUE COMPLET ──
async function renderHistorique(){
  document.getElementById('main-content').innerHTML=`
    <div style="margin-bottom:20px;display:flex;align-items:center;justify-content:space-between">
      <div>
        <div style="font-size:20px;font-weight:700;color:#0F172A">Historique des envois</div>
        <div style="width:40px;height:3px;background:#2563EB;border-radius:2px;margin-top:6px"></div>
      </div>
      <button onclick="renderHistorique()" style="background:none;border:none;cursor:pointer;font-size:13px;color:#2563EB;font-weight:600;font-family:'Plus Jakarta Sans',sans-serif">↻ Actualiser</button>
    </div>
    <div class="card" id="hist-content">
      <div style="text-align:center;padding:40px;color:#94A3B8">Chargement...</div>
    </div>`;

  const{data:envois}=await sb.from('envois_whatsapp')
    .select('*')
    .eq('assistante_email',currentUser.email)
    .order('created_at',{ascending:false})
    .limit(100);

  const liste=envois||[];
  const panel=document.getElementById('hist-content');
  if(!panel)return;

  panel.innerHTML=liste.length?`
    <div class="table-scroll">
      <table class="hist-table">
        <thead><tr>
          <th>Patient</th><th>Téléphone</th><th>Langue</th><th>Date</th><th>Heure</th><th>Statut</th><th>Action</th>
        </tr></thead>
        <tbody>${liste.map(e=>`
          <tr>
            <td style="font-weight:600;color:#111827">${e.nom_patient||'—'}</td>
            <td style="color:#6B7280">${e.tel_patient||'—'}</td>
