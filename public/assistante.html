<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediPulse — Espace Assistante</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://unpkg.com/@tabler/icons-webfont@3.11.0/dist/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/shared.css">
<style>
body { background: #F5F7FF; color: #111827; }
</style>
</head>
<body>
<div class="layout">

  <!-- SIDEBAR -->
  <div class="sidebar sidebar-light" id="sidebar">
    <div class="sidebar-logo">
      <div style="display:flex;align-items:center;gap:9px;margin-bottom:6px">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        <div style="font-family:'Syne',sans-serif;font-size:19px;font-weight:800;letter-spacing:-0.5px;color:#1E3A5F">Medi<span style="color:#2563EB">Pulse</span></div>
      </div>
      <div style="font-size:10px;color:#94A3B8;padding-left:33px;font-style:italic">La réputation médicale, automatisée.</div>
    </div>
    <div class="sidebar-user">
      <div class="sidebar-avatar" id="sb-avatar" style="background:#F3E8FF;color:#8B5CF6"></div>
      <div>
        <div class="sidebar-username" id="sb-name"></div>
        <div class="sidebar-role" style="font-size:11px">Assistante</div>
      </div>
    </div>
    <div class="sidebar-nav">
      <div class="nav-section">Outils</div>
      <div class="nav-link active" id="nav-accueil" onclick="showPage('accueil')"><i class="ti ti-home"></i>Accueil</div>
      <div class="nav-link" id="nav-historique" onclick="showPage('historique')"><i class="ti ti-history"></i>Historique</div>
    </div>
    <div class="sidebar-footer">
      <button class="logout-btn logout-btn-blue" onclick="doLogout()">
        <i class="ti ti-logout" style="font-size:16px"></i> Déconnexion
      </button>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar topbar-light">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="mobile-menu-btn" onclick="toggleSidebar()" style="color:#0F172A"><i class="ti ti-menu-2"></i></button>
        <div style="font-family:'Plus Jakarta Sans',sans-serif;font-size:16px;font-weight:700;color:#0F172A" id="page-title">Espace Assistante</div>
      </div>
      <div style="display:flex;align-items:center;gap:12px">
        <span style="padding:4px 14px;border-radius:99px;font-size:11px;font-weight:600;background:rgba(139,92,246,0.15);color:#8B5CF6;border:1px solid rgba(139,92,246,0.25)">Assistante</span>
        <span style="font-size:13px;color:#64748B" id="topbar-date"></span>
      </div>
    </div>

    <div class="content content-light" id="main-content">
      <div style="text-align:center;padding:60px;color:#94A3B8">Chargement...</div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="/js/supabase.js"></script>
<script src="/js/auth.js"></script>
<script>
let currentUser = null;
let userRecord = null;
let sendCount = 0;
let envisList = [];

// ── INIT ──
(async () => {
  const auth = await requireAuth('assistante');
  if (!auth) return;
  currentUser = auth.session.user;
  userRecord = auth.user;

  const initials = (userRecord.nom || currentUser.email).substring(0, 2).toUpperCase();
  document.getElementById('sb-avatar').textContent = initials;
  document.getElementById('sb-name').textContent = userRecord.nom || currentUser.email.split('@')[0];
  document.getElementById('topbar-date').textContent = new Date().toLocaleDateString('fr-FR', {day:'numeric',month:'long'});

  showPage('accueil');
})();

function showPage(page) {
  document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
  const navEl = document.getElementById('nav-' + page);
  if (navEl) navEl.classList.add('active');
  const titles = { accueil: 'Espace Assistante', historique: 'Historique des envois' };
  document.getElementById('page-title').textContent = titles[page] || 'Accueil';

  if (page === 'accueil') renderAccueil();
  else if (page === 'historique') renderHistorique();
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

// ── ACCUEIL ──
function renderAccueil() {
  document.getElementById('main-content').innerHTML = `
    <div style="margin-bottom:28px">
      
      <div style="width:40px;height:3px;background:#2563EB;border-radius:2px;margin-top:6px"></div>
      <div style="font-size:14px;color:#6B7280;margin-top:8px;font-family:'Plus Jakarta Sans',sans-serif">${new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}</div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px">
      <!-- ENVOI FORM -->
      <div class="card-white">
        <div style="font-size:15px;font-weight:700;color:#111827;margin-bottom:6px;font-family:'Plus Jakarta Sans',sans-serif">Envoyer un formulaire</div>
        <div style="font-size:13px;color:#6B7280;margin-bottom:20px;font-family:'Plus Jakarta Sans',sans-serif">Renseignez les informations du patient</div>
        <div style="margin-bottom:14px">
          <label style="font-size:11px;font-weight:600;color:#374151;text-transform:uppercase;letter-spacing:0.05em;display:block;margin-bottom:6px;font-family:'Plus Jakarta Sans',sans-serif">Nom du patient</label>
          <input id="ass-nom" type="text" placeholder="Prénom Nom" style="width:100%;padding:11px 14px;border-radius:10px;border:1px solid #E5E7EB;font-size:14px;color:#111827;font-family:'Plus Jakarta Sans',sans-serif;outline:none;background:#F9FAFB" onfocus="this.style.borderColor='#2563EB';this.style.background='#fff'" onblur="this.style.borderColor='#E5E7EB';this.style.background='#F9FAFB'">
        </div>
        <div style="margin-bottom:20px">
          <label style="font-size:11px;font-weight:600;color:#374151;text-transform:uppercase;letter-spacing:0.05em;display:block;margin-bottom:6px;font-family:'Plus Jakarta Sans',sans-serif">Téléphone WhatsApp</label>
          <input id="ass-tel" type="tel" placeholder="06 XX XX XX XX" style="width:100%;padding:11px 14px;border-radius:10px;border:1px solid #E5E7EB;font-size:14px;color:#111827;font-family:'Plus Jakarta Sans',sans-serif;outline:none;background:#F9FAFB" onfocus="this.style.borderColor='#2563EB';this.style.background='#fff'" onblur="this.style.borderColor='#E5E7EB';this.style.background='#F9FAFB'">
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <button onclick="envoyerFormulaire('ar')" style="padding:14px;border-radius:12px;border:none;background:linear-gradient(135deg,#1E3A8A,#2563EB);color:#fff;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-family:'Plus Jakarta Sans',sans-serif">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.123.554 4.117 1.528 5.843L.057 23.786c-.092.355.232.68.587.587l5.943-1.471A11.955 11.955 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0z"/></svg>
            عربية
          </button>
          <button onclick="envoyerFormulaire('fr')" style="padding:14px;border-radius:12px;border:none;background:linear-gradient(135deg,#0369A1,#06B6D4);color:#fff;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-family:'Plus Jakarta Sans',sans-serif">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.123.554 4.117 1.528 5.843L.057 23.786c-.092.355.232.68.587.587l5.943-1.471A11.955 11.955 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0z"/></svg>
            Français
          </button>
        </div>
      </div>

      <!-- KPI CARDS -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
        <div class="card-white">
          <div style="width:34px;height:34px;border-radius:10px;background:#EFF6FF;display:flex;align-items:center;justify-content:center;margin-bottom:12px">
            <i class="ti ti-send" style="font-size:16px;color:#2563EB"></i>
          </div>
          <div style="font-size:26px;font-weight:700;color:#111827;font-family:'Plus Jakarta Sans',sans-serif;line-height:1" id="count-envois">0</div>
          <div style="font-size:12px;color:#6B7280;margin-top:5px;font-family:'Plus Jakarta Sans',sans-serif">Envoyés aujourd'hui</div>
        </div>
        <div class="card-white">
          <div style="width:34px;height:34px;border-radius:10px;background:#F0FDF4;display:flex;align-items:center;justify-content:center;margin-bottom:12px">
            <i class="ti ti-message-check" style="font-size:16px;color:#10B981"></i>
          </div>
          <div style="font-size:26px;font-weight:700;color:#111827;font-family:'Plus Jakarta Sans',sans-serif;line-height:1">0</div>
          <div style="font-size:12px;color:#6B7280;margin-top:5px;font-family:'Plus Jakarta Sans',sans-serif">Réponses reçues</div>
        </div>
        <div class="card-white">
          <div style="width:34px;height:34px;border-radius:10px;background:#F0FDF4;display:flex;align-items:center;justify-content:center;margin-bottom:12px">
            <i class="ti ti-thumb-up" style="font-size:16px;color:#10B981"></i>
          </div>
          <div style="font-size:26px;font-weight:700;color:#111827;font-family:'Plus Jakarta Sans',sans-serif;line-height:1">0</div>
          <div style="font-size:12px;color:#6B7280;margin-top:5px;font-family:'Plus Jakarta Sans',sans-serif">Avis positifs</div>
        </div>
        <div class="card-white">
          <div style="width:34px;height:34px;border-radius:10px;background:#FFF1F2;display:flex;align-items:center;justify-content:center;margin-bottom:12px">
            <i class="ti ti-alert-triangle" style="font-size:16px;color:#F43F5E"></i>
          </div>
          <div style="font-size:26px;font-weight:700;color:#111827;font-family:'Plus Jakarta Sans',sans-serif;line-height:1">0</div>
          <div style="font-size:12px;color:#6B7280;margin-top:5px;font-family:'Plus Jakarta Sans',sans-serif">Alertes</div>
        </div>
      </div>
    </div>

    <!-- HISTORIQUE DU JOUR -->
    <div class="card-white">
      <div style="font-size:15px;font-weight:700;color:#111827;margin-bottom:20px;font-family:'Plus Jakarta Sans',sans-serif;display:flex;align-items:center;gap:8px">
        <i class="ti ti-history" style="color:#6B7280"></i> Historique du jour
      </div>
      <div id="historique-list">
        <div style="text-align:center;padding:40px;color:#9CA3AF">
          <i class="ti ti-phone" style="font-size:40px;display:block;margin-bottom:12px;color:#E5E7EB"></i>
          <div style="font-size:14px;font-family:'Plus Jakarta Sans',sans-serif">Aucun envoi aujourd'hui</div>
          <div style="font-size:12px;margin-top:4px;font-family:'Plus Jakarta Sans',sans-serif">Les formulaires envoyés apparaîtront ici</div>
        </div>
      </div>
    </div>
  `;
}

// ── ENVOYER FORMULAIRE ──
function envoyerFormulaire(lang) {
  const nom = document.getElementById('ass-nom')?.value || '';
  const tel = document.getElementById('ass-tel')?.value || '';
  if (!tel) { showToast('Entrez le numéro WhatsApp', 'error'); return; }

  sendCount++;
  envisList.unshift({ nom, tel, lang, time: new Date().toLocaleTimeString('fr-FR', {hour:'2-digit',minute:'2-digit'}) });

  const countEl = document.getElementById('count-envois');
  if (countEl) countEl.textContent = sendCount;

  const googleLink = userRecord?.google_url || '';
  const googleText = googleLink ? ('\n\n⭐ Laissez-nous un avis Google : ' + googleLink) : '';

  const msg = lang === 'ar'
    ? encodeURIComponent('مرحباً، نود معرفة رأيك في زيارتك للعيادة. يرجى تعبئة هذا الاستبيان (دقيقتان): https://medipulse-gamma.vercel.app/saisie.html' + googleText)
    : encodeURIComponent('Bonjour, nous aimerions connaître votre expérience. Merci de remplir ce formulaire (2 min) : https://medipulse-gamma.vercel.app/saisie.html' + googleText);

  const telFormatted = tel.replace(/\s/g, '').replace(/^0/, '212');
  window.open('https://wa.me/' + telFormatted + '?text=' + msg, '_blank');

  // Update history
  const hist = document.getElementById('historique-list');
  if (hist) {
    const empty = hist.querySelector('[style*="text-align:center"]');
    if (empty) hist.innerHTML = '';
    hist.insertAdjacentHTML('afterbegin', `
      <div style="display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid #F9FAFB">
        <div style="width:38px;height:38px;border-radius:10px;background:#EFF6FF;display:flex;align-items:center;justify-content:center;flex-shrink:0">
          <i class="ti ti-send" style="font-size:16px;color:#2563EB"></i>
        </div>
        <div style="flex:1">
          <div style="font-size:14px;font-weight:600;color:#111827;font-family:'Plus Jakarta Sans',sans-serif">${nom || 'Patient'}</div>
          <div style="font-size:12px;color:#6B7280;margin-top:2px;font-family:'Plus Jakarta Sans',sans-serif">${tel} · Formulaire ${lang === 'ar' ? 'Arabe' : 'Français'}</div>
        </div>
        <div style="text-align:right">
          <span style="padding:4px 10px;border-radius:99px;font-size:11px;font-weight:600;background:#FFF7ED;color:#EA580C;font-family:'Plus Jakarta Sans',sans-serif">En attente</span>
          <div style="font-size:11px;color:#9CA3AF;margin-top:4px;font-family:'Plus Jakarta Sans',sans-serif">${new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</div>
        </div>
      </div>
    `);
  }

  document.getElementById('ass-nom').value = '';
  document.getElementById('ass-tel').value = '';
  showToast('Formulaire ' + (lang === 'ar' ? 'Arabe' : 'Français') + ' envoyé !', 'success');
}

// ── HISTORIQUE PAGE ──
function renderHistorique() {
  document.getElementById('main-content').innerHTML = `
    <div style="margin-bottom:24px">
      
      <div style="width:40px;height:3px;background:#2563EB;border-radius:2px;margin-top:6px"></div>
    </div>
    <div class="card-white">
      ${envisList.length ? `
        <table style="width:100%;border-collapse:collapse">
          <thead><tr>
            ${['Patient','Téléphone','Langue','Heure','Statut'].map(h =>
              `<th style="text-align:left;font-size:11px;font-weight:600;color:#9CA3AF;text-transform:uppercase;letter-spacing:0.05em;padding:0 0 12px;font-family:'Plus Jakarta Sans',sans-serif">${h}</th>`
            ).join('')}
          </tr></thead>
          <tbody>${envisList.map(e => `
            <tr style="border-top:1px solid #F9FAFB">
              <td style="padding:14px 0;font-size:13px;font-weight:600;color:#111827;font-family:'Plus Jakarta Sans',sans-serif">${e.nom || '—'}</td>
              <td style="padding:14px 12px;font-size:13px;color:#6B7280;font-family:'Plus Jakarta Sans',sans-serif">${e.tel}</td>
              <td style="padding:14px 12px"><span style="padding:4px 10px;border-radius:99px;font-size:11px;font-weight:600;background:#EFF6FF;color:#2563EB;font-family:'Plus Jakarta Sans',sans-serif">${e.lang === 'ar' ? 'Arabe' : 'Français'}</span></td>
              <td style="padding:14px 12px;font-size:13px;color:#6B7280;font-family:'Plus Jakarta Sans',sans-serif">${e.time}</td>
              <td style="padding:14px 0"><span style="padding:4px 10px;border-radius:99px;font-size:11px;font-weight:600;background:#FFF7ED;color:#EA580C;font-family:'Plus Jakarta Sans',sans-serif">En attente</span></td>
            </tr>
          `).join('')}</tbody>
        </table>
      ` : `
        <div style="text-align:center;padding:48px;color:#9CA3AF;font-family:'Plus Jakarta Sans',sans-serif">
          <i class="ti ti-inbox" style="font-size:40px;display:block;margin-bottom:12px;color:#E5E7EB"></i>
          Aucun envoi enregistré
        </div>
      `}
    </div>
  `;
}
</script>
</body>
</html>
